 по брифу, с требованиями и примером — промпт под слайдом","Сравните и напишите в чат Zoom одну разницу, которую заметили"],"take":"","prompt":["Бриф количественного исследования","Анкета без контекста","Анкета по брифу, с требованиями и примером"]},"more":[{"h":"Бриф, если не хотите генерировать свой","files":[{"ext":"MD","t":"Бриф: как люди в России пользуются ИИ-сервисами","n":"учебный, 1,5 страницы — под опрос и под интервью","url":"files/brif-ii-v-rossii.md"}]},{"co":"best","t":"Garbage in, garbage out — правило старше ИИ","text":["Программисты говорят «garbage in, garbage out», в народе — «shit in, shit out»: если на вход подать мусор, на выходе будет мусор. Коробочка не превращает его в конфетку. С моделями это правило работает так же: модель не знает того, чего вы ей не дали, и додумывает правдоподобно."]},{"co":"best","t":"От prompt engineering к context engineering и дальше","text":["Сначала был **prompt engineering** — искусство сформулировать вопрос так, чтобы модель ответила лучше. В июне 2025 года Тоби Лютке, глава Shopify, предложил другое слово — **context engineering**: искусство дать модели весь контекст, при котором задачу вообще можно решить. Андрей Карпатый поддержал: «+1 за context engineering вместо prompt engineering».","Что дальше — единого слова пока нет. В 2026 году заметнее всего два: **harness engineering** — так OpenAI назвала работу, где люди направляют, а агенты исполняют («Humans steer. Agents execute.»), и **agentic engineering** — так Карпатый называет то, что пришло на смену вайб-кодингу: вы управляете агентами и проверяете их работу. Общий смысл один: от формулировки вопроса — к устройству всей среды, в которой работает модель."],"src":[["Simon Willison: цитаты Лютке и Карпатого про context engineering","https://simonwillison.net/2025/Jun/27/context-engineering/"],["OpenAI: Harness engineering, февраль 2026","https://openai.com/index/harness-engineering/"]]}],"cap":"Garbage in, garbage out: мусор на входе — мусор на выходе","short":{"r":"г","min":5,"why":"Все генерируют бриф и делают одну анкету по брифу; анкету без контекста показываю я."},"words":["Сначала показываю я, потом делаете все. Бриф каждый генерирует сам — промпт под слайдом. Тема — как люди в России пользуются ИИ: какими сервисами, платят ли, для каких задач.","У этой мысли два корня. Старое правило программистов — «garbage in, garbage out», в народе «shit in, shit out». И то, что с 2025 года называют context engineering."]},{"n":17,"part":"p1","min":2,"t":"Как поставить задачу","body":[{"grid":[["Что сделать","Одно действие и его результат"],["Зачем и для кого","Кто прочтёт и какое решение примет"],["Что прикладываю","Бриф, данные, прошлые версии"],["В каком виде результат","Формат, длина, язык, структура"],["Чего не делать","Ограничения и запреты"],["Пример","Как выглядит хороший результат"]],"cols":3}],"take":"Хорошая постановка задачи — это контекст, упакованный в одно сообщение","more":[{"h":"Каркас для копирования","prompt":"Каркас постановки задачи"},{"h":"Откуда эти шесть пунктов","text":["У этих шести пунктов нет одного автора. Это общее, что повторяется в официальных гайдах Anthropic и OpenAI и в любом хорошем поручении новому коллеге. Anthropic формулирует золотое правило так: покажите промпт коллеге без контекста. Если он запутается, запутается и модель.","Похожие каркасы есть и у других. Самый известный — **CO-STAR**: Context, Objective, Style, Tone, Audience, Response. С ним Шейла Тео выиграла первый в Сингапуре конкурс промптинга GPT-4 (GovTech, 2023). OpenAI в гайде к GPT-4.1 предлагает такой порядок: роль и цель → инструкции → шаги рассуждения → формат ответа → примеры → контекст."],"table":{"head":["Пункт","Зачем","Где это в гайдах"],"rows":[["Что сделать","Модель не угадывает, что вы имели в виду","Anthropic: будьте ясны и прямы; OpenAI: конкретная задача"],["Зачем и для кого","Понимая причину, модель применяет правило и к похожим случаям","Anthropic: объясняйте, зачем; CO-STAR: Objective и Audience"],["Что прикладываю","Модель не знает того, чего вы ей не дали","Anthropic: длинные материалы наверх; OpenAI: опорный текст"],["В каком виде результат","Формат и объём каждая модель понимает по-своему","OpenAI и Google: формат и длина; CO-STAR: Response"],["Чего не делать","Ограничения задают рамки","Гайды советуют формулировать это как «делай так», а не только запретом"],["Пример","Самый надёжный способ показать формат и тон","Anthropic: 3–5 разных примеров; OpenAI: начать без примеров и добавлять"]]}},{"h":"Выжимка гайдов — положите в свой проект","lead":"PDF на русском: что советуют Anthropic и OpenAI, с примерами на исследовательских задачах. Загрузите его в проект в Claude или ChatGPT как материал — модель будет опираться на эти правила.","files":[{"ext":"PDF","t":"Как ставить задачу ИИ","n":"выжимка официальных гайдов Anthropic и OpenAI","url":"files/kak-stavit-zadachu-ii.pdf"}]},{"h":"Гайды по промптингу в оригинале","links":[["Anthropic: prompt engineering","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview","официальный гайд, на английском"],["OpenAI: prompt engineering","https://platform.openai.com/docs/guides/prompt-engineering","официальный гайд, на английском"],["Anthropic: prompting best practices","https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices","все техники на одной странице, на английском"],["OpenAI: гайд по последним моделям","https://developers.openai.com/api/docs/guides/gpt-5.5","на английском"],["Google: prompt design strategies","https://ai.google.dev/gemini-api/docs/prompting-strategies","на английском"]]}],"words":["Шесть пунктов — это не чья-то авторская методика, а то общее, что повторяется в гайдах Anthropic и OpenAI и в любом хорошем поручении коллеге. Подробнее и PDF с выжимкой — под слайдом."]},{"n":18,"part":"p1","min":1,"t":"Семь способов дать контекст","body":[{"grid":[["Уже видели","Текст · файл · проект · память"],["Сегодня дальше","Коннекторы и MCP · навыки"],["Дальше на курсе","Инструкции и другие способы"]],"cols":3}],"take":"Контекст можно не пересказывать каждый раз, а держать в одном месте — например, в проекте","words":["Соберём, как вообще можно дать модели контекст. Способов семь.","Четыре уже видели: текст, файл, проект и память. Дальше сегодня — коннекторы с MCP и навыки. Остальное — дальше на курсе.","Главное: контекст не обязательно пересказывать каждый раз. Его можно держать в одном месте."]},{"n":19,"part":"p2","kind":"section","min":0,"t":"Сервисов много: держитесь своего и следите за остальными","lead":"Есть: пять сервисов, девять режимов, коннекторы, навыки, задачи по расписанию, работа с телефона. Сегодня — пятёрка вскользь, потом крупным планом Claude, ChatGPT и Codex","short":{"r":"в","note":"Карта девяти режимов — в шпаргалке."},"more":[{"h":"Как не утонуть в новинках","text":["Сервисов и функций много, и каждую неделю появляется что-то новое. Следить за изменениями нужно, а прыгать между сервисами — нет: каждый переход стоит времени, а ваш контекст — проекты, память, навыки — остаётся в старом сервисе.","Рабочая стратегия: один основной сервис, который вы знаете глубоко. Следите, что развивается внутри него. Если в другом сервисе появилось что-то очень полезное — сначала разберитесь, как получить то же у себя, и переходите, только если без этого никак."]}],"words":["Сейчас будет много сервисов и функций. Задача — не выучить всё, а увидеть разнообразие и выбрать стратегию: свой сервис знать глубоко, за остальными следить, но не прыгать между ними."]},{"n":20,"part":"p2","min":4,"short":{"r":"в","min":2,"why":"Пятёрку — одним взглядом на скрины."},"t":"Одна задача — пять ответов","body":[{"shots":[{"name":"Claude","file":"20-claude.png"},{"name":"ChatGPT","file":"20-chatgpt.png"},{"name":"Perplexity","file":"20-perplexity.png"},{"name":"DeepSeek","file":"20-deepseek.png"},{"name":"Алиса AI","file":"20-alisa.png"}]}],"cap":"Gemini и GigaChat — одной строкой: устроены так же, на курсе не разбираем","take":"Разница не в том, кто умнее, а в модели, настройках и том, что подключено","more":[{"h":"Пять сервисов рядом","table":{"head":["Сервис","Чья модель","Что бесплатно","Чем силён","Что заметно в анкете"],"rows":[["Claude","Anthropic","…","…","…"],["ChatGPT","OpenAI","…","…","…"],["Perplexity","Модели разных компаний на выбор","…","…","…"],["DeepSeek","DeepSeek","…","…","…"],["Алиса AI","Яндекс","…","…","…"]]},"after":"Таблицу заполним по итогам прогона, а вы дополните её на домашке — ДЗ-2."}],"words":["Вопрос не в том, кто умнее, а в том, как каждый устроен. Дальше работаем в Claude: в нём видно больше всего, остальные сервисы сравниваем с ним."]},{"n":21,"part":"p2","min":0.5,"t":"Дальше — три инструмента крупным планом: Claude, ChatGPT и Codex","body":[{"cards":[["1","Claude","Настройки: коннекторы, навыки, память, инструкции, приватность, выбор модели"],["2","ChatGPT","Новое приложение на компьютере: режимы Chat, Work и Codex, приложения через @, задачи"],["3","Codex","Кодовый агент OpenAI: пишет и запускает программы в вашей папке. Смотрим рядом с Claude Code"]]}],"take":"Это три ключевых продукта, между которыми сейчас идёт выбор","words":["Дальше — три ключевых продукта, между которыми сейчас идёт выбор: сначала Claude, потом ChatGPT, потом Codex. Кто работает в другом сервисе — смотрите, что у вас похоже, а что устроено иначе."]},{"n":22,"part":"p2","min":2,"gap":24,"t":"Claude: сколько всего, оказывается, есть в настройках","body":[{"row":[[{"shots":[{"name":"Настройки Claude","file":"22-claude-settings.png","nocap":true}],"cols":1,"wide":true}],[{"label":"Что показываю"},{"list":["Коннекторы","Навыки","Память","Личные инструкции","Приватность","Выбор модели"],"sm":true}]],"w":"0.9fr 1fr"}],"take":"Половина возможностей — не на главном экране, а в настройках","demo":{"t":"Экскурсия по настройкам Claude","see":"Где коннекторы, навыки, память, инструкции, приватность и выбор модели","steps":["Коннекторы и навыки","Память и личные инструкции","Приватность и выбор модели"]},"more":[{"h":"Инструкция для показа: где что лежит в Claude","lead":"Сверено по скриншотам 18 октября 2026. Интерфейс на английском, поэтому пути — с английскими названиями. Все разделы — в окне настроек: меню аккаунта внизу слева → `Settings`; навыки, коннекторы и плагины — в его блоке Customize.","steps":["**Коннекторы:** `Настроить → Коннекторы` или каталог claude.ai/connectors. Показываю подключённые — Google Диск, почту, календарь — и как добавить новый: кнопка «Обзор» → сервис → «Подключить» → вход в аккаунт","**Навыки:** `Настроить → Навыки` (claude.ai/customize/skills). У каждого навыка — переключатель. Показываю встроенные навыки Anthropic, свой навык и кнопку загрузки ZIP-архива. Для навыков должно быть включено выполнение кода","**Память:** `Настройки → Память`. Что Claude записал обо мне, как поправить или удалить, флажок про чувствительные темы, импорт памяти из другого сервиса","**Личные инструкции:** `Settings → Account` — поле «Instructions for Claude»: как ко мне обращаться, стиль ответов, что всегда делать. Это подкладывается в каждый чат","**Приватность:** `Настройки → Конфиденциальность` — «Help improve our AI models»: учиться ли на моих переписках; срок хранения","**Выбор модели:** список под полем ввода: Fable, Opus, Sonnet, Haiku, ниже — уровень усилий (Effort) и «More models» со старыми версиями","**Использование:** `Настройки → Использование` — сколько ушло из пятичасового окна и недельного лимита"]},{"h":"Скриншоты по шагам","shots":[{"name":"Коннекторы","file":"22-claude-connectors.png"},{"name":"Навыки","file":"22-claude-skills.png"},{"name":"Память: `Settings → Memory`","file":"22-claude-memory.png"},{"name":"Личные инструкции: `Settings → Account`","file":"22-claude-instructions.png"},{"name":"Приватность: `Settings → Privacy`","file":"22-claude-privacy.png"},{"name":"Выбор модели и усилий под полем ввода","file":"22-claude-model.png"}]}],"words":["Начинаем с Claude. Многие пользуются им давно и не заглядывают в настройки, а половина возможностей — там.","Быстро пройдусь: коннекторы и навыки, память и личные инструкции, приватность и выбор модели. Запоминать каждую настройку не нужно — достаточно знать, что она есть и где лежит."]},{"n":23,"part":"p2","min":2,"gap":24,"t":"ChatGPT на компьютере: что в нём есть","lead":"Новое приложение вышло 9 июля 2026 вместе с GPT-5.6: в него переехал Codex","lw":720,"body":[{"grid":[["Chat","Вопросы и быстрые задачи"],["Work","Многошаговая работа с файлами, приложениями и сайтами: сначала план, потом действия"],["Codex","Работа с кодом"],["И ещё","Приложения и коннекторы через @, задачи, локальные папки, встроенный браузер, статус задач с телефона"]]}],"take":"Режимы и подключения у Claude и ChatGPT почти одинаковые — отличаются названия и детали","demo":{"t":"Десктопное приложение ChatGPT","see":"Три режима и что к ним подключается","steps":["Chat, Work и Codex — переключаюсь между режимами","Приложения и коннекторы через @","Задачи и локальные папки"]},"more":[{"h":"Что есть в новом приложении","lead":"Вышло 9 июля 2026 вместе с GPT-5.6, на всех тарифах, включая бесплатный. В него переехало отдельное приложение Codex, старое приложение теперь называется ChatGPT Classic. Агент с собственным виртуальным компьютером (ChatGPT agent) в августе 2026 убран — его заменил режим Work.","list":["**Chat** — вопросы и быстрые задачи","**Work** — многошаговая работа с файлами, приложениями и сайтами: сначала план, потом действия. Работает в облачном контейнере OpenAI или на вашем компьютере, может идти в фоне","**Codex** — работа с кодом: то же, что Work, но с техническими подробностями","**Приложения и коннекторы** — больше 1400 интеграций, вызываются через @","**Задачи** — разово или по расписанию; по событию из почты, Slack или GitHub — на платных тарифах","**Локальные папки и управление компьютером** — важные действия подтверждаете вы","**Встроенный браузер** и отдельный облачный браузер для сайтов, где нужен вход","**С телефона** — статус и результаты задач"]},{"h":"Инструкция для показа: где что лежит в ChatGPT","lead":"Сверено по веб-версии chatgpt.com 18 октября 2026. Режимы Chat и Work — переключатель над полем ввода, Codex — пункт меню слева.","steps":["**Режимы:** переключатель Chat · Work · Codex. Chat — разговор, Work — задача с планом и действиями, Codex — код в папке","**Приложения и коннекторы:** `@` в поле ввода — список подключённых сервисов; как подключить новый — показываю на скриншоте","**Задачи:** попросить в чате «каждый понедельник присылай…» и показать список задач. Активных задач — 5 на Plus, 15 на Pro","**Папки и компьютер:** в режиме Work дать доступ к папке; важные действия подтверждаю я","**Память:** `Настройки → Персонализация → Память`: сохранённые воспоминания, опора на историю чатов, сводка памяти","**Данные:** `Настройки → Управление данными` — «Improve the model for everyone»","**Использование:** `Настройки → Использование` — пятичасовое окно и неделя для Work и Codex","**Модель:** под полем ввода — GPT-6 и ползунок рассуждения от Instant до Extra High. На Free и Go — Luna"]},{"h":"Скриншоты по шагам","lead":"Из веб-версии chatgpt.com на бесплатном тарифе.","shots":[{"name":"Chat и Work — сверху, Codex, плагины и задачи — в меню слева","file":"23-chatgpt-modes.png"},{"name":"Плагины: `Plugins`, рядом вкладка Skills","file":"23-chatgpt-apps.png"},{"name":"Задачи по расписанию: `Scheduled`","file":"23-chatgpt-tasks.png"},{"name":"Память: `Settings → Personalization`","file":"23-chatgpt-settings.png"}]}],"words":["По набору возможностей ChatGPT и Claude сейчас очень похожи, разные в основном названия. Дальше на каждом слайде говорю, как то же самое устроено в ChatGPT."]},{"n":24,"part":"p2","min":3,"gap":24,"t":"От чата к агенту","body":[{"axis":["← больше делаете вы","больше делает модель →"]},{"scale":[{"h":"Чат","rows":[["Контекст","Носите вы"],["Действует","Вы"]]},{"h":"Проект","rows":[["Контекст","Лежит рядом"],["Действует","Вы"]]},{"h":"Агент на компьютере","rows":[["Контекст","Сам открывает файлы"],["Действует","Модель, в вашей папке"]]},{"h":"Кодовый агент","rows":[["Контекст","Сам находит в папке"],["Действует","Модель: пишет и запускает программы"]]}]}],"cap":"Метафора Андрея Карпатого — ползунок автономии","take":"Чем правее, тем больше делает модель и тем важнее проверять, что она сделала","demo":{"t":"Одна анкета в трёх режимах","see":"Что меняют постоянный контекст и доступ к файлам","steps":["Чат: прикладываю бриф и прошу анкету","Проект: бриф уже лежит в материалах, требования — в инструкциях проекта. Пишу только «Сделай анкету»","Cowork: даю доступ к папке с брифом. Агент сам находит бриф, делает анкету и сохраняет файл в папку"]},"gpt":"В ChatGPT агент на компьютере — режим Work, кодовый агент — Codex.","more":[{"h":"Чем агент на компьютере отличается от кодового агента","list":["**Агент на компьютере** (Cowork в Claude, режим Work в ChatGPT) работает с документами: открывает файлы в папке, делает Word, таблицы и презентации, ходит по сайтам. Работаете в обычном окне приложения","**Кодовый агент** (Claude Code, Codex) решает задачу через код: пишет и запускает программы в папке, ставит библиотеки, проверяет результат запуском. Работает в терминале или редакторе кода","Модель под капотом может быть одна и та же. Разница — в инструментах, доступе и инструкциях. Подробнее — на {{26}}"]},{"co":"best","t":"Ползунок автономии","text":"Андрей Карпатый предлагает думать об ИИ-инструментах как о ползунке: от «подсказывает, а делаете вы» до «делает сам, а вы проверяете». Чем дальше ползунок, тем важнее, чтобы результат было легко проверить.","src":[["Andrej Karpathy, Software Is Changing (Again)","https://www.youtube.com/watch?v=LCEmiRjPEtQ"]]}],"words":["Три раза одна и та же анкета: в чате я ношу контекст сам, в проекте он лежит рядом, в Cowork модель сама открывает папку и кладёт результат. Чем правее, тем больше делает модель и тем важнее проверить, что она сделала."]},{"n":25,"part":"p2","min":2,"gap":14,"t":"Чат, чат с инструментами и агент — три разных процесса","body":[{"row":[[{"label":"Чат"},{"p":"Вопрос — ответ"}],[{"flow":[{"h":"Сообщение"},{"h":"Модель"},{"h":"Ответ","sunk":true}]}]],"w":"200px 1fr","g":4},{"row":[[{"label":"Чат с инструментами"},{"p":"Шаги внутри ответа"}],[{"flow":[{"h":"Сообщение"},{"h":"Поиск","p":"в интернете"},{"h":"Код","p":"посчитать"},{"h":"Память","p":"что знает о вас"},{"h":"Ответ","sunk":true}]}]],"w":"200px 1fr","g":4},{"row":[[{"label":"Агент"},{"p":"Сам идёт к результату"}],[{"flow":[{"h":"Задача"},{"h":"План"},{"h":"Действие","p":"файлы, программы, сайты"},{"h":"Проверка"},{"h":"Снова, пока не готово"},{"h":"Результат","sunk":true}]}]],"w":"200px 1fr","g":4}],"take":"Агентность — шкала: сколько шагов модель делает сама и к чему у неё доступ","more":[{"h":"Сервисы становятся всё агентнее","text":["Модели и сервисы становятся всё агентнее: они всё дольше работают над задачей, не прерываясь и не прося у человека новых вводных. Год назад агент держался несколько минут, сейчас — часы.","Одно из пониманий AGI, ИИ общего назначения, как раз про это: модель способна выполнить тот объём работы, который делает человек. Подумайте, сколько вы сами работаете над задачей, прежде чем пойти за новым контекстом, проверкой или следующей задачей. Обычно это часы, а не недели. Модели к этому приближаются."]},{"co":"best","t":"Длина задач, которые ИИ делает сам, удваивается каждые 4–7 месяцев","text":["Исследователи METR измеряют «горизонт задачи»: сколько времени у специалиста-человека заняла бы задача, которую агент решает в половине случаев. С 2019 по 2025 год этот горизонт удваивался примерно каждые 7 месяцев, а в последние годы — примерно каждые 4.","В 2025 году лучшие модели держали задачи на 3–6 часов человеческой работы, в начале 2026 года — около 12 часов. Ранняя версия Claude Mythos весной 2026 года показала не меньше 16 часов — на пределе того, что METR вообще умеет измерять.","Инвестфонд Sequoia в январе 2026 года так и написал: агенты, которые работают долго, — это функционально уже AGI. А по их экстраполяции к 2028 году агент будет делать полный рабочий день эксперта."],"src":[["METR: Measuring AI Ability to Complete Long Tasks","https://arxiv.org/abs/2503.14499"],["METR: текущие горизонты моделей","https://metr.org/time-horizons"],["Sequoia: 2026: This is AGI","https://sequoiacap.com/article/2026-this-is-agi"]]},{"co":"best","t":"Начинать с простого","text":"Anthropic советует начинать с самого простого решения и добавлять шаги и самостоятельность агенту, только когда это заметно улучшает результат.","src":[["Anthropic: Building effective agents","https://www.anthropic.com/engineering/building-effective-agents"]]}],"words":["Три процесса рядом. Чат: сообщение — ответ. Чат с инструментами: внутри ответа модель сама ищет, считает, смотрит память. Агент: ставите задачу, и он идёт шагами — действие, проверка, снова — пока не добьётся результата.","И главный тренд: агенты работают всё дольше без человека. Подумайте, сколько вы сами работаете над задачей, прежде чем пойти за новым контекстом или проверкой, — часы, а не недели. Модели к этому приближаются."]},{"n":26,"part":"p2","min":2,"t":"Кодовый агент: Claude Code и Codex","body":[{"compare":[{"h":"Claude Code","accent":true,"rows":[["Чей","Anthropic"],["Где работает","В терминале, в редакторе кода, в приложении Claude"],["Что умеет","Работает с файлами в папке: читает, создаёт, правит, запускает программы"]]},{"h":"Codex","rows":[["Чей","OpenAI"],["Где работает","В приложении ChatGPT, в терминале, в облаке"],["Что умеет","То же: пишет и запускает код в вашей папке или в облаке"]]}]}],"demo":{"t":"Claude Code и Codex: одна задача, файл в папке","see":"Кодовый агент сам создаёт файл там, где вы работаете","steps":["Claude Code: открываю папку с брифом, прошу анкету и сохранить файлом","Файл появился в папке — открываю","Codex: та же папка, тот же запрос — что похоже и что отличается"],"more":["Codex с 9 июля 2026 — режим в приложении ChatGPT на компьютере. Есть и Codex CLI в терминале","Режим Codex → открываю ту же папку с брифом","Тот же запрос: «Сделай анкету по брифу brif-ii-v-rossii.md, сохрани в anketa-codex.md»","Модель — под полем ввода; для кода OpenAI советует GPT-6.1 Sol","Сравниваем с Claude Code: как спрашивает разрешения, как показывает шаги, где лежит файл"]},"week":[3,"Мастерская: своя программа расшифровки"],"more":[{"h":"Codex на экране","shots":[{"name":"Codex: та же папка, тот же запрос","file":"26-codex.png"},{"name":"Claude Code: файл анкеты в папке","file":"26-claude-code.png"}]},{"h":"Чем Cowork отличается от Claude Code и Codex в терминале","text":["Коротко: модель одна и та же, архитектура агента — тоже (Anthropic так и пишет: Cowork работает на той же агентной архитектуре, что и Claude Code). Разница — в обвязке: где агент работает, к чему у него доступ, какие у него инструменты и инструкции по умолчанию.","Поэтому одну и ту же задачу часто можно решить и там, и там. Выбирайте по задаче: документы, таблицы, презентации, сайты — Cowork; программа, данные, автоматизация, свой инструмент — Claude Code или Codex."],"table":{"head":["","Cowork в приложении Claude","Claude Code и Codex в терминале"],"rows":[["Где работает","В облаке Anthropic, к файлам на компьютере — через приложение Claude на компьютере","На вашем компьютере, прямо в папке; есть и облачные сессии"],["Доступ","Только к папкам и сервисам, которые вы дали","Ко всему, к чему есть доступ у вас в этой папке и в терминале; опасные действия спрашивает"],["Изоляция","Отдельная виртуальная машина","Песочница операционной системы, без отдельной машины"],["Под что настроен","Документы, таблицы, презентации, сайты, коннекторы","Код: читать проект, писать и запускать программы, тесты, git"],["Как расширяется","Навыки, коннекторы, плагины","Навыки, MCP, плагины, правила проекта (CLAUDE.md, AGENTS.md), хуки, помощники-субагенты"],["Интерфейс","Окно приложения, видно план и шаги","Терминал или редактор кода; у Claude Code есть и приложение"]]}},{"h":"Кто ещё делает кодовых агентов","table":{"head":["Агент","Чей","Что это"],"rows":[["[Cursor](https://cursor.com)","Anysphere; покупает SpaceX вместе с xAI","Редактор кода с агентом, агент в терминале (`agent`), облачные агенты"],["[Gemini CLI](https://github.com/google-gemini/gemini-cli)","Google","Агент в терминале с открытым кодом; бесплатно с аккаунтом Google — до 1000 запросов в день"],["[GitHub Copilot](https://docs.github.com/en/copilot)","GitHub, Microsoft","Облачный агент: даёте задачу в GitHub — он предлагает правку кода"],["[Qwen Code](https://github.com/QwenLM/qwen-code)","Alibaba","Агент в терминале с открытым кодом; нужен ключ API или подписка"],["[Kimi Code](https://github.com/MoonshotAI/kimi-code)","Moonshot","Агент в терминале, работает с MCP и в редакторах кода"],["[GLM Coding Plan](https://docs.z.ai/devpack/overview)","Z.ai (Zhipu)","Подписка на модель GLM, которую подключают в Claude Code, Codex и другие агенты"],["[DeepSeek](https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code)","DeepSeek","Своего агента нет: модели V4 подключают в Claude Code, Codex, OpenCode"],["[Trae](https://www.trae.ai/)","ByteDance","Редактор кода с режимом SOLO и открытый Trae Agent"],["[SourceCraft CLI](https://habr.com/ru/news/1026498/)","Яндекс","Агент в терминале на моделях Yandex AI Studio, с апреля 2026"],["[GigaCode](https://sber.pro/publication/obnovlyonnii-ii-assistent-gigacode-cli-sbera-uskoryaet-razrabotku/)","Сбер","GigaCode CLI; многоагентное приложение пока только внутри Сбера"]]},"after":"Устроены они похоже на Claude Code: агент читает папку, пишет и запускает код. Китайские модели часто подключают прямо в Claude Code вместо моделей Anthropic — так дешевле. Отдельного кодового агента под брендом Алисы мы не нашли: у Яндекса это SourceCraft."},{"h":"Как поставить","links":[["Claude Code: установка","https://code.claude.com/docs/en/setup","нужен для ДЗ-5 и недели 3"],["Codex","https://openai.com/codex","страница OpenAI"],["Codex: команды","https://learn.chatgpt.com/docs/cli/slash-commands/","/model, /status, /usage, /mcp"],["Codex: тарифы и лимиты","https://learn.chatgpt.com/docs/pricing"]]}],"words":["Под капотом Cowork и Claude Code — одна и та же модель и почти один и тот же агент. Разница в обвязке: где он работает, к чему у него доступ и под какие задачи настроен. Codex — то же самое у OpenAI."]},{"n":27,"part":"p2","min":3,"t":"MCP: как ИИ подключается к другим сервисам","body":[{"row":[[{"grid":[["MCP — Model Context Protocol","Открытый стандарт подключения ИИ к сервисам. Как розетка: один разъём для любых сервисов"],["Коннектор","Конкретный сервис, включённый в розетку"]],"cols":1}],[{"label":"Самое простое — офисное"},{"list":["**Google Диск** — найти бриф, положить анкету рядом","**Почта** — собрать требования заказчика из переписки","**Календарь** — найти время для интервью","**Поиск** — искать в интернете или по базе знаний"],"sm":true}]]}],"take":"MCP — руки модели в чужих сервисах: читать, искать, создавать, отправлять","demo":{"t":"Google Диск: бриф из папки, анкета — в папку","see":"Материалы не нужно копировать в чат","steps":["Claude берёт бриф из папки на Google Диске","Делает анкету и кладёт её в ту же папку","Показываю, сколько MCP подключено у меня"]},"more":[{"h":"Сколько MCP у меня","lead":"Коннекторы работают через интернет: Google Диск, почта, календарь, Figma, Miro, Todoist и мои собственные. Расширения — MCP, которые работают прямо на компьютере: управляют Chrome, заметками и самим Mac.","shots":[{"name":"Коннекторы: `Settings → Connectors`","file":"22-claude-connectors.png"},{"name":"Расширения на компьютере: `Settings → Extensions`","file":"27-rasshireniya.png"}]},{"h":"Что такое MCP","list":["**Model Context Protocol** — открытый стандарт подключения ИИ-ассистентов к системам, где лежат данные: хранилищам, рабочим сервисам, средам разработки","Anthropic представила его в ноябре 2024 года. В марте 2025 года стандарт поддержала OpenAI, в апреле — Google","В декабре 2025 года Anthropic передала MCP фонду Agentic AI Foundation при Linux Foundation, его соучредители — Anthropic, Block и OpenAI. Тогда публичных MCP-серверов было больше 10 000","В каталоге коннекторов Claude — около тысячи сервисов"]}],"lead":"Модель может брать контекст из других сервисов — и действовать в них","gpt":"В ChatGPT — приложения и коннекторы, вызываются через @. В Codex MCP-серверы подключаются в файле настроек, список — командой `/mcp`.","short":{"r":"д","min":2,"why":"Без показа Диска: только мой список MCP."},"words":["Мы говорили про контекст и подключения. Кроме того, что лежит у вас на компьютере, модель может подключаться к другим сервисам. Для этого и нужен MCP — Model Context Protocol. Начнём с простого: Диск, почта, календарь."]},{"n":28,"part":"p2","min":2,"t":"Сервисы сами делают MCP: с ними всё чаще работают через ИИ","lead":"Компании понимают, что пользователь приходит к ним не в приложение, а через ассистента, — и сами дают ему доступ","body":[{"cards":[["","ВкусВилл","Поиск товаров, состав и КБЖУ, ссылка на готовую корзину"],["","SCRN","Каталог экранов мобильных приложений: ассистент сам находит экраны и сценарии для разбора"],["","Pathway","Разбор ответов тестов прямо в своём ИИ-инструменте"]]}],"take":"Нет готового MCP — на неделе 3 научимся делать свой","demo":{"t":"SCRN: экраны онбординга банковских приложений","see":"Ассистент сам ходит в сервис через MCP","steps":["Прошу Claude найти экраны онбординга в банковских приложениях","Claude сам обращается к SCRN и приносит экраны","Если останется минута — то же во ВкусВилле: собрать корзину на ужин"]},"gpt":"В ChatGPT — приложения и коннекторы, больше 1400 интеграций, вызываются через @.","week":[3,"Мастерская: свой коннектор"],"more":[{"h":"Кто уже сделал MCP","links":[["ВкусВилл","https://mcp.vkusvill.ru/","поиск товаров, состав и КБЖУ, ссылка на готовую корзину; экспериментальный сервер с декабря 2025"],["SCRN","https://scrn.gallery","каталог экранов мобильных приложений, сильнее всего по российскому финтеху и e-commerce"],["Pathway","https://help.pthwy.ru/help/integracii/mcp-server/","MCP-сервер: разбирать ответы тестов в своём ИИ-инструменте"],["Model Context Protocol","https://modelcontextprotocol.io","сайт стандарта, на английском"],["Anthropic: анонс MCP, ноябрь 2024","https://www.anthropic.com/news/model-context-protocol"],["Anthropic: MCP передан в Agentic AI Foundation","https://www.anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation"],["Каталог коннекторов Claude","https://claude.ai/connectors"]]}],"short":{"r":"д","min":1,"why":"Примеры одной строкой, без показа SCRN."},"words":["Посмотрите на это со стороны компаний: пользователь всё чаще приходит не в их приложение, а через ассистента. Поэтому они сами делают MCP — чтобы ИИ мог с ними работать. ВкусВилл, SCRN, Pathway — у каждого своё место в этой системе."]},{"n":29,"part":"p2","min":4,"t":"Навык (skill): один раз объяснили — дальше по имени","body":[{"grid":[["Что это","Папка: описание, когда применять, инструкция SKILL.md, шаблоны и примеры. Формат открытый (Agent Skills)"],["Claude","Навыки лежат в аккаунте, в разделе «Настроить → Навыки», и работают в чате, в Cowork и в Claude Code. Модель подхватывает подходящий сама или вы зовёте по имени"],["ChatGPT и Codex","Тот же открытый формат. В ChatGPT — на рабочих тарифах: попросите собрать навык в чате, вызов через @. В Codex — `$имя` или `/skills`"]],"cols":3}],"take":"Навык — ваш способ делать работу, записанный так, чтобы модель его повторяла. Формат открытый: один навык работает в разных сервисах","demo":{"t":"Гайд глубинного интервью без навыка и с навыком","see":"Чем отличается результат и сколько больше не нужно объяснять каждый раз","steps":["Без навыка: навык выключен, прошу гайд по брифу","С навыком: включаю навык «гайд по брифу», тот же запрос в новом чате","Сравниваем рядом: формат, вопросы о будущем, связь с исследовательскими вопросами"],"more":["Перед показом: `Настроить → Навыки` — навык «гайд по брифу» загружен (ZIP из материалов) и выключен","Прогон без навыка: новый чат, бриф во вложении, «Сделай гайд глубинного интервью по этому брифу»","Включаю навык переключателем в `Настроить → Навыки`","Прогон с навыком: новый чат, тот же бриф, тот же запрос. Claude пишет, что использует навык","Если вживую долго — открываю два готовых гайда из материалов и сравниваю их"]},"more":[{"h":"Два гайда рядом и сам навык","lead":"Без навыка гайд тоже неплохой: модели хорошо знают, как делать гайды. Разница в другом. С навыком — ни одного вопроса о будущем («при какой цене вы бы…»), каждый блок привязан к исследовательскому вопросу, формат одинаковый каждый раз.","files":[{"ext":"MD","t":"Гайд без навыка","n":"по учебному брифу","url":"files/gajd-bez-navyka.md"},{"ext":"MD","t":"Гайд с навыком «гайд по брифу»","n":"тот же бриф, тот же запрос","url":"files/gajd-s-navykom.md"},{"ext":"ZIP","t":"Навык «Гайд глубинного интервью по брифу»","n":"папка с SKILL.md — можно загрузить в Claude","url":"files/navyk-gajd-po-brifu.zip"}]},{"h":"Где навыки в Claude","lead":"`Settings → Skills`. На вкладке Yours — ваши навыки, у меня их 14. На вкладке Discover — готовые наборы от Anthropic и других компаний: можно попробовать в чате или добавить себе.","shots":[{"name":"Мои навыки: вкладка Yours","file":"22-claude-skills.png"},{"name":"Готовые навыки: вкладка Discover","file":"29-claude-skills-discover.png"}]},{"h":"Как сделать свой навык из чата","lead":"Возьмите чат, в котором вы долго работали над похожей задачей и много поправляли модель. Попросите в этом же чате собрать из него навык — промпт ниже.","prompt":"Навык из этого чата","after":"Claude соберёт навык и предложит сохранить его в аккаунт; или скачайте ZIP и загрузите в `Настроить → Навыки`. После этого навык работает в чате, в Cowork и в Claude Code. В Claude есть и встроенный навык skill-creator, который помогает собирать навыки."},{"h":"Почитать про навыки","links":[["Agent Skills","https://agentskills.io","открытый формат навыков"],["Anthropic: как пользоваться навыками в Claude","https://support.claude.com/en/articles/12512180-use-skills-in-claude"],["Anthropic: зачем агентам навыки (инженерный блог)","https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills"],["Anthropic: навыки, MCP и проекты — чем отличаются","https://claude.com/blog/skills-explained"],["Claude Code: навыки","https://code.claude.com/docs/en/skills","в том числе синхронизация из аккаунта"],["OpenAI: навыки в ChatGPT","https://help.openai.com/en/articles/20001066-skills-in-chatgpt"],["OpenAI: как собрать навык для Codex","https://learn.chatgpt.com/docs/build-skills"]]}],"words":["Навык — skill по-английски. Главная особенность в Claude: навык живёт в аккаунте, а не в одном чате, поэтому работает в чате, в Cowork и в Claude Code. Формат открытый, поэтому навык можно перенести в ChatGPT и Codex. Собрать навык можно, просто попросив Claude."]},{"n":30,"part":"p2","min":3,"t":"Задача по расписанию: ИИ запускается сам","lead":"Модель запускается сама в заданное время","body":[{"grid":[["Примеры для исследователя","Разбор почты, сводка новостей рынка по понедельникам, мониторинг сайтов конкурентов, статус проекта"],["Что нужно","Сервис, который это умеет; включённый компьютер, если задача работает с файлами на нём"],["Claude","Задачи запускаются сами, даже когда компьютер спит: каждый час, день, неделю или по будням. Задача с локальными файлами работает, только пока компьютер включён"],["ChatGPT","На всех тарифах: разово или по расписанию. По событию из почты, Slack или GitHub — на платных, в режиме Work. Активных задач: 5 на Plus, 15 на Pro"]]}],"take":"Работа, которая повторяется каждую неделю, — первый кандидат","demo":{"t":"Задача, которая уже сработала — и ваша задача","see":"Модель запустилась сама и принесла результат. А что бы вы ей поручили","steps":["Открываю задачу по расписанию: когда сработала, что пришло в чат","Вопрос к вам: какую работу вы делаете регулярно — или хотели бы, чтобы ИИ делал её раз за разом","Разбор почты, сайты конкурентов, новости, анализ проекта — пишите в чат Zoom"],"links":[["Claude: задачи по расписанию и работа с телефона","https://support.claude.com/en/articles/15520349-use-claude-cowork-on-web-desktop-and-mobile","справка Anthropic"],["Claude: задачи по расписанию","https://support.claude.com/en/articles/13854387","справка Anthropic"],["ChatGPT: задачи по расписанию","https://help.openai.com/en/articles/10291617","справка OpenAI"]]},"short":{"r":"д","min":2,"why":"Вопрос группе — в чат, без обсуждения."},"words":["Следующая ступень — модель запускается сама, без вас. Это задачи по расписанию.","Покажу задачу, которая у меня уже сработала: когда запустилась и что прислала.","А теперь вопрос к вам: какую работу вы делаете регулярно — каждую неделю, каждый месяц? Напишите в чат. Из этого и получаются первые задачи по расписанию."]},{"n":31,"part":"p2","min":3,"t":"Свой компьютер или облачный: ушли от компьютера — работа продолжается","body":[{"compare":[{"h":"Задача идёт на вашем компьютере","list":["Работает, пока компьютер не спит: закрыли ноутбук — работа оборвалась","Видит ваши локальные файлы. С телефона можно вести задачу, если ноутбук открыт","Чтобы не уснул: Amphetamine или KeepingYouAwake на Mac, PowerToys Awake на Windows"]},{"h":"Задача идёт на облачном компьютере","accent":true,"list":["Компьютер в облаке работает, даже когда ваш ноутбук закрыт: дали задачу, закрыли, забыли","Работает с файлами в облаке: Диск, загруженные файлы, репозиторий кода","Ставить и смотреть задачу можно с телефона"]}]}],"take":"Компьютер уснул — локальный агент встал. Облачный работает дальше","demo":{"t":"Та же задача на телефоне","see":"Задача, запущенная в облаке, открыта на телефоне","steps":["Запускаю задачу в облаке","Открываю тот же чат на телефоне","Задача идёт дальше"]},"gpt":["Режим Work в ChatGPT работает в облачном контейнере OpenAI или на вашем подключённом компьютере. Облачные задачи Codex запускаются и с телефона: выберите Cloud и окружение. Агента с собственным виртуальным компьютером (ChatGPT agent) с августа 2026 нет — его заменил Work."],"more":[{"h":"Как это устроено у Claude и OpenAI","table":{"head":["","Claude","OpenAI"],"rows":[["На вашем компьютере","Claude Code в терминале; Cowork с доступом к вашим папкам через приложение Claude","Codex CLI; режимы Work и Codex в приложении ChatGPT с доступом к папке"],["В облаке","Cowork по умолчанию работает на серверах Anthropic; облачные сессии Claude Code с репозиторием GitHub","Work — в облачном контейнере OpenAI; облачные задачи Codex — в отдельной виртуальной машине"],["С телефона","Облачные сессии продолжаются с закрытым приложением. Dispatch — отправить задачу с телефона на свой компьютер. Remote Control — вести Claude Code на компьютере с телефона","Облачные задачи Codex запускаются из мобильного приложения: Cloud → окружение. Статус задач Work — с телефона"],["По расписанию","Задачи идут удалённо, даже когда компьютер спит; с локальными файлами — только пока он включён","Задачи на всех тарифах; по событию — на платных, в режиме Work"]]},"after":"Названия функций меняются каждые несколько месяцев: в августе 2026 OpenAI убрала ChatGPT agent с виртуальным компьютером и заменила его режимом Work, а в сентябре Anthropic объединила Cowork с обычным чатом. Смотрите не на название, а на то, где идёт работа — у вас или в облаке. Источники: [Claude Code с телефона](https://code.claude.com/docs/en/mobile), [Remote Control](https://code.claude.com/docs/en/remote-control), [Dispatch](https://claude.com/docs/cowork/guide/dispatch), [Codex: облачные окружения](https://learn.chatgpt.com/docs/environments/cloud-environments), [Codex с телефона](https://learn.chatgpt.com/docs/mobile)."},{"h":"Программы против сна","links":[["Amphetamine","https://apps.apple.com/app/amphetamine/id937984704","Mac, App Store"],["KeepingYouAwake","https://keepingyouawake.app","Mac"],["PowerToys Awake","https://learn.microsoft.com/windows/powertoys/awake","Windows"]]}],"gptH":"Как это в ChatGPT и Codex","short":{"r":"д","min":2,"why":"Показ на телефоне — только если всё готово заранее."},"words":["Два сценария. Первый: работа идёт на вашем компьютере. Модель в облаке, но действия — у вас: закрыли ноутбук — всё оборвалось. Зато видны ваши файлы, и с телефона можно вести задачу, пока ноутбук открыт.","Второй: облачный компьютер. Дали задачу, закрыли ноутбук, забыли — он сделает и пришлёт результат. На этом принципе работают мобильные приложения Claude и ChatGPT для кода и задач."]},{"n":32,"part":"p2","min":2,"short":{"r":"в","cut":true,"why":"Карта режимов уходит в шпаргалку, на слайде раздела — одной строкой."},"t":"Девять стилей работы с ИИ","body":[{"compare":[{"h":"Сегодня показали — шесть","accent":true,"list":["Чат — везде","Проект — {{24}}","Агент на компьютере, Cowork — {{24}}","Кодовый агент, Claude Code — {{26}}","Задачи по расписанию — {{30}}","Работа с телефона — {{31}}"]},{"h":"Попробуйте сами — три","list":["Голос","Глубокое исследование","Агент в браузере"]}]}],"take":"Сегодня — шесть стилей из девяти. Три оставшихся — попробуйте сами","more":[{"h":"Карта режимов по пятёрке","table":{"head":["Режим","Что это","Claude","ChatGPT","Perplexity","DeepSeek","Алиса AI"],"center":[2,3,4,5,6],"rows":[["Чат","Вопрос — ответ в окне","✓","✓","✓","✓","✓"],["Голос","Разговор вместо текста","✓","✓","✓","?","✓"],["Проект","Постоянный контекст под одну задачу","✓","✓","✓ Spaces","?","?"],["Глубокое исследование","Агент сам ищет и сводит источники","✓","✓","✓","?","?"],["Агент в браузере","Сам ходит по сайтам","✓","✓","✓ Comet","?","?"],["Агент на компьютере","Работает с вашими файлами","✓ Cowork","✓ Work","?","?","?"],["Кодовый агент","Пишет и запускает программы","✓ Claude Code","✓ Codex","?","?","?"],["Задачи по расписанию","Запускается сам","✓","✓","?","?","?"],["С телефона","Ведёте задачу, запущенную на компьютере или в облаке","✓","✓","?","?","?"]]},"after":"✓ — есть, ? — проверяем. Отметки — на 13 октября 2026."}],"words":["Итог второй части. Стилей работы с ИИ девять, сегодня мы показали шесть: чат, проект, агент на компьютере, кодовый агент, задачи по расписанию и работа с телефона.","Ещё три — голос, глубокое исследование и агент в браузере — попробуйте сами на неделе."]},{"n":33,"part":"p3","kind":"section","min":0,"t":"Какую модель выбрать и что происходит с данными","lead":"Есть: миллионы моделей, линейки Claude и OpenAI, локальные модели, настройки приватности. Сегодня — чем модели отличаются, как часто выходят, как выбирать и где рычаги","more":[{"h":"Что вообще есть в этой теме","text":"Миллионы моделей — текстовые, речевые, графические, узкие; линейки Claude и OpenAI; локальные модели; настройки приватности."}],"words":["Третья часть — на какой модели работать и что происходит с вашими данными. Моделей миллионы, у Claude и OpenAI — целые линейки, есть локальные модели. Разберём, чем модели отличаются, как часто выходят новые, как выбирать и где настройки приватности."]},{"n":34,"part":"p3","min":3,"gap":20,"t":"Почему модели все разные","body":[{"grid":[["Размер","Больше параметров: умнее, но дороже и медленнее"],["Данные","На чём учили"],["Дообучение","Под стиль, безопасность и задачи"],["Режим","Рассуждает перед ответом или отвечает сразу"],["Задача","Текст, речь или картинки"]],"cols":5},{"label":"Что размер значит на выходе — на разборе интервью"},{"compare":[{"h":"Старшая модель","p":"Держит в голове больше деталей сразу, замечает противоречия между респондентами, реже скатывается в банальные обобщения"},{"h":"Младшая модель","p":"Отвечает быстрее и дешевле, но чаще пересказывает поверхностно и теряет то, что прозвучало один раз"}]}],"take":"Лучшей модели нет. Есть подходящая под задачу — и под ваш лимит","more":[{"h":"Размер: сколько параметров у моделей","text":"Anthropic и OpenAI не раскрывают, сколько параметров в Claude и GPT: в техническом отчёте о GPT-4 прямо написано, что размера там нет. Слухи про «триллионы» в Claude не подтверждены. Размеры известны у моделей с открытыми весами — и они дают представление о масштабе.","table":{"head":["Модель","Всего параметров","Работает на каждом токене"],"rows":[["DeepSeek V4-Pro (2026)","1,6 трлн","49 млрд"],["DeepSeek V4-Flash (2026)","284 млрд","13 млрд"],["Kimi K2 (2025)","1 трлн","32 млрд"],["Qwen3-235B (2025)","235 млрд","22 млрд"],["Llama 3.1 405B (2024)","405 млрд","все 405 млрд"],["gpt-oss-120b (2025)","117 млрд","5,1 млрд — помещается в 80 ГБ"],["gpt-oss-20b (2025)","21 млрд","3,6 млрд — помещается в 16 ГБ"]]}},{"h":"Данные: на чём учат и почему их не хватает","list":["**Книги.** Anthropic покупала бумажные книги, срезала корешки, сканировала и выбрасывала бумагу — во внутренних документах это называлось проектом «Панама». Суд в 2025 году признал обучение на купленных книгах допустимым, а на скачанных пиратских — нет. За пиратские Anthropic заплатила авторам 1,5 млрд долларов, около 3000 долларов за книгу — [Ars Technica](https://arstechnica.com/ai/2025/06/anthropic-destroyed-millions-of-print-books-to-build-its-ai-models/), [Bloomberg Law](https://news.bloomberglaw.com/ip-law/anthropic-authors-1-5-billion-deal-receives-final-approval)","**Данные кончаются.** Илья Суцкевер, сооснователь OpenAI, в декабре 2024 года: «У нас есть только один интернет». По оценке Epoch AI, всего публичного текста, написанного людьми, — около 300 трлн токенов, и его выберут где-то между 2026 и 2032 годами — [Epoch AI](https://epoch.ai/blog/will-we-run-out-of-data-limits-of-llm-scaling-based-on-human-generated-data)","**Не хватает данных о простой физической работе.** Как складывают бельё или упаковывают товар, в интернете почти не описано. Поэтому в Индии людям платят около 2,6 доллара в час, чтобы они снимали свою работу и домашние дела на камеру на голове — на этом учат роботов — [NPR, октябрь 2026](https://www.kuow.org/npr-news/2026-10-14/these-workers-help-train-robots-who-could-one-day-steal-their-jobs)"]},{"h":"Дообучение и безопасность","list":["**Дообучение** — то, что делают с моделью после основного обучения: учат отвечать полезно, держать стиль и отказываться от опасного. Классический способ — RLHF: люди сравнивают ответы, модель учится на их оценках. У Anthropic — ещё и «конституция»: модель сама проверяет свои ответы по списку принципов","**Зачем это нужно — взломы.** В ноябре 2025 года Anthropic рассказала, как группа, которую компания связывает с китайским государством, использовала Claude Code для кибершпионажа: около 30 целей, и 80–90% операций ИИ делал сам. Летом 2025 года — вымогательство у 17 организаций с помощью Claude — [Anthropic, отчёт об угрозах](https://www.anthropic.com/research/detecting-countering-misuse-aug-2025)","**И вред людям.** Есть судебные иски, где семьи утверждают, что разговоры с чат-ботом подтолкнули подростков к самоубийству: против OpenAI (2025, идёт) и Character.AI (в 2026 году стороны договорились об урегулировании). Безопасность — это и то, как модель ведёт себя с уязвимым человеком"]},{"h":"Режим рассуждения: что это такое","list":["**Что это.** Перед ответом модель пишет скрытый черновик рассуждений: разбивает задачу на шаги, проверяет себя, исправляет ошибки — и только потом отвечает. OpenAI впервые показала это в модели o1 в сентябре 2024 года: «o1 думает, прежде чем ответить» — [OpenAI](https://openai.com/index/learning-to-reason-with-llms/)","**Сколько циклов.** Сколько угодно: модель может написать тысячи токенов рассуждений, вернуться назад, перепроверить. Чем дольше думает, тем лучше ответ на сложных задачах — но дольше и дороже. Это называют вычислениями во время ответа (test-time compute)","**Сколько это стоит.** Токены рассуждений оплачиваются как выходные, даже если вы их не видите. У Claude можно настроить, сколько модель думает, — [Anthropic: extended thinking](https://platform.claude.com/docs/en/build-with-claude/extended-thinking)","**Когда включать.** Анализ, сведение источников, расчёты, план исследования — да. Переформулировать, перевести, коротко ответить — не нужно"]},{"co":"mine","t":"Работаю на Opus, а не на Fable","text":"В Claude я работаю на Opus 5.5, а не на старшей Fable 5.1. Fable в 2,5 раза дороже, и на ней недельного лимита не хватает, а Opus на большинстве задач почти не уступает."}],"short":{"r":"д","min":2,"why":"Подробности — под слайдом."},"words":["Пять причин, почему модели разные. Подробности под слайдом: размеры открытых моделей, откуда берут данные, как модели учат безопасности и что такое рассуждение. Свой пример — Opus против Fable."]},{"n":35,"part":"p3","min":1,"t":"Модели работают не только с текстом","body":[{"cards":[["","Картинки","Видят скриншоты и фото — они тоже режутся на токены. Схемы рисуют кодом, иллюстрации — отдельным генератором"],["","Голос","Распознают речь и отвечают голосом. В голосовом режиме можно разговаривать, как по телефону"],["","Видео","Часть моделей понимает видео: о чём ролик, что на экране. Отдельные модели генерируют видео по описанию"],["","Документы и данные","PDF, таблицы, презентации, код. Таблицы надёжнее считать кодом — об этом в части 4"]],"cols":4}],"take":"Любой вход — картинка, звук, видео — тоже превращается в токены и тратит контекст","more":[{"h":"Что умеют разные модели","list":["**Мультимодальная модель** (multimodal) — та, что принимает не только текст: картинки, звук, иногда видео. Claude и ChatGPT понимают картинки и PDF, в Claude, ChatGPT и Алисе можно разговаривать голосом, модели Google понимают видео","**Видеть ≠ рисовать.** Понимает картинку языковая модель, а рисует обычно отдельная генеративная модель. Схемы и графики модель чаще рисует кодом — поэтому их легко поправить","**Голос — тоже цепочка или одна модель.** Диктовка — это распознавание речи плюс языковая модель ({{38}}). Голосовой режим, где модель отвечает голосом без задержки, работает на моделях, которые сразу принимают и выдают звук","**Всё это тратит контекст.** Скриншот, страница PDF, минута аудио — тоже токены. Большой PDF со сканами съедает окно быстрее текста"]},{"h":"Материал для самостоятельного изучения","files":[{"ext":"PDF","t":"ИИ и картинки","n":"генерация, анализ изображений, дизайн, анализ интерфейсов"}]}],"words":["Модели работают не только с текстом: картинки, голос, видео, документы. Подробно про картинки — в отдельном материале. Важно одно: любой такой вход тоже тратит контекст."]},{"n":36,"part":"p3","min":3,"t":"Почему модели всё время обновляются","body":[{"timeline":{"aria":"Выпуски моделей Anthropic, OpenAI и DeepSeek с января 2025 по октябрь 2026","lanes":[{"name":"Anthropic","cls":"a","count":"6 → 11","events":[["2025-02-24","Claude 3.7 Sonnet, первая с режимом рассуждения"],["2025-05-22","Claude Opus 4 и Sonnet 4"],["2025-08-05","Opus 4.1"],["2025-09-29","Sonnet 4.5"],["2025-10-15","Haiku 4.5"],["2025-11-24","Opus 4.5"],["2026-02-05","Opus 4.6"],["2026-02-17","Sonnet 4.6"],["2026-04-16","Opus 4.7"],["2026-05-28","Opus 4.8"],["2026-06-09","Fable 5, новая старшая линейка (вместе с закрытой Mythos 5)"],["2026-06-30","Sonnet 5"],["2026-07-24","Opus 5"],["2026-09-01","Fable 5.1"],["2026-09-22","Opus 5.5"],["2026-09-28","Sonnet 5.5"],["2026-10-07","Haiku 5.5"]]},{"name":"OpenAI","cls":"b","count":"8 → 8","events":[["2025-01-31","o3-mini"],["2025-02-27","GPT-4.5"],["2025-04-14","GPT-4.1"],["2025-04-16","o3 и o4-mini"],["2025-08-05","gpt-oss, первые открытые веса OpenAI со времён GPT-2"],["2025-08-07","GPT-5"],["2025-11","GPT-5.1"],["2025-12","GPT-5.2"],["2026-02","GPT-5.3 и GPT-5.3-Codex"],["2026-03","GPT-5.3 Instant"],["2026-03","GPT-5.4"],["2026-04","GPT-5.5"],["2026-07-09","GPT-5.6 Luna, Terra, Sol"],["2026-09-03","GPT-6 Astra"],["2026-09-22","GPT-6 Sol и Luna"],["2026-09-29","GPT-6.1 Sol, для кода"]]},{"name":"DeepSeek","cls":"c","count":"7 → 5","events":[["2025-01-20","R1, рассуждающая, открытые веса"],["2025-03-24","V3-0324"],["2025-05-28","R1-0528"],["2025-08-21","V3.1, рассуждение и быстрый режим в одной модели"],["2025-09-22","V3.1-Terminus"],["2025-09-29","V3.2-Exp"],["2025-12-01","V3.2"],["2026-04-24","V4 Preview (Pro и Flash), контекст на миллион токенов"],["2026-07-31","V4-Flash, публичная бета"],["2026-08-13","V4-Pro-0813"],["2026-08-21","V4-Flash-Vision-Exp"],["2026-09-10","V4.1-Flash: понимает картинки, открытые веса"]]}]}}],"cap":"Выпусков за 2025 год → за январь–октябрь 2026. Открытые источники на 17 октября 2026; где известен только месяц, точка в середине месяца","take":"Рядом с результатом записывайте модель и дату — как версию анкеты","more":[{"h":"Как читать названия","list":["**Anthropic:** Haiku — младшая, Sonnet — средняя, Opus — старшая, Fable — самая мощная из общедоступных (с июня 2026). Mythos — закрытая, только по приглашению","**OpenAI:** Luna — быстрая и дешёвая; Terra — средняя (есть только у GPT-5.6); Sol — для сложных задач; Astra — самая мощная (GPT-6). GPT-5.5 отключили 14 октября 2026","**DeepSeek:** V — основная линия, R — рассуждающая (с V3.1 они слились в одну модель); Flash и Pro — младшая и старшая. Веса открыты — что это значит, ниже"]},{"h":"Что это значит для вас","list":["**Модель по умолчанию в приложении меняется.** 7 августа 2025 года OpenAI выпустила GPT-5 и в тот же день убрала из ChatGPT привычную GPT-4o — без предупреждения. Пользователи возмутились, через неделю 4o вернули платным тарифам, а в феврале 2026 года отключили окончательно — [Simon Willison](https://simonwillison.net/2025/Aug/8/surprise-deprecation-of-gpt-4o/), [OpenAI](https://openai.com/index/retiring-gpt-4o-and-older-models)","**Так происходит постоянно.** В августе 2026 года модель по умолчанию на бесплатном ChatGPT сменилась на Luna, 14 октября 2026 года отключили GPT-5.5. Если вы не выбирали модель сами, вы могли не заметить, что работаете уже на другой","**Результат прошлого месяца может не повториться.** Тот же промпт на новой модели даёт другой ответ: другой стиль, другую длину, иногда другие выводы. Поэтому рядом с результатом записывайте модель и дату, как версию анкеты","**Старые модели отключают.** К модели, на которой вы полгода назад сделали отчёт, вернуться нельзя. Если важна повторяемость — сохраняйте промпт и результат, а для долгих проектов подумайте о модели с открытыми весами"]},{"co":"best","t":"Сегодняшняя модель — самая слабая из тех, что вы ещё увидите","text":["Итан Моллик, профессор Уортона, в книге «Co-Intelligence» (2024) сформулировал правило: «Исходите из того, что это худший ИИ, которым вы будете пользоваться». Сегодняшняя модель — самая слабая из тех, что вы ещё увидите: всё, что будет дальше, будет только мощнее.","Поэтому то, что сейчас не получается, через полгода может заработать. Записывайте такие задачи и возвращайтесь к ним."],"src":[["Итан Моллик, Co-Intelligence: четыре правила (конспект)","https://alyssafuward.substack.com/p/sketchnote-a-summary-of-ethan-mollicks"]]},{"h":"Зачем компании всё время делают новые модели","list":["**Гонка.** Anthropic, OpenAI, Google, DeepSeek и другие соревнуются за пользователей и компании. Кто отстал на полгода — теряет клиентов","**Новые умения.** Каждое поколение лучше пишет код, дольше работает без человека, лучше видит картинки. Под это появляются новые продукты: кодовые агенты, агенты на компьютере","**Дешевле на тех же задачах.** Новая маленькая модель часто умеет то, что вчера умела только большая, — и стоит в разы меньше","**Цель на горизонте.** Большие компании прямо говорят, что строят ИИ общего назначения (AGI), который сможет делать большую часть работы человека. Каждая модель — шаг к этому","**Деньги на обучение уже вложены.** Компании построили огромные вычислительные центры, и новые модели — способ их окупить"]},{"h":"Открытые и закрытые веса: что это значит для исследователя","text":["Веса — числа внутри модели, в которых хранится всё, что она умеет (см. {{8}}). Открытые веса значит, что компания выложила эти числа: модель можно скачать и запустить у себя или в своём облаке. Закрытые — веса есть только у компании, а вы получаете ответы через её приложение или API.","Почему компании делают по-разному. Закрытые модели — главный продукт и источник денег. Открытые дают известность, сообщество разработчиков и доверие; часто так делают те, кто догоняет лидеров, и китайские компании."],"table":{"head":["","Закрытые веса","Открытые веса"],"rows":[["Примеры","Claude, GPT, Gemini","DeepSeek, Qwen, Llama, gpt-oss, Kimi"],["Где работает","Только у компании: приложение или API","Где угодно: у вас на компьютере, на сервере компании, у облачного провайдера"],["Данные","Уходят компании, по её правилам","Могут не покидать ваш компьютер или контур компании"],["Качество","Обычно лучшее на рынке","Догоняет с отставанием в несколько месяцев"],["Что это значит для исследователя","Удобно и мощно, но смотрите на настройки приватности","Вариант для чувствительных данных и для повторяемости: модель не поменяют без вас"]]}},{"h":"Выпусков за год","table":{"head":["","2025","2026, январь — октябрь"],"rows":[["Anthropic","6","11"],["OpenAI","8","8"],["DeepSeek","7","5"]]}}],"short":{"r":"д","min":2,"why":"График — без разбора каждой линии."},"words":["У Anthropic в 2026 году — больше одного выпуска в месяц.","Что это значит для вас. Первое: модель по умолчанию в приложении меняется — так было, когда ChatGPT в одну ночь заменил GPT-4o на GPT-5. Второй: тот же промпт на новой модели даст другой результат. Третье: старые модели отключают — нельзя вернуться к той, на которой вы делали отчёт полгода назад.","И хорошая новость: сегодняшняя модель — самая слабая из тех, что вы ещё увидите. Дальше будет только мощнее."]},{"n":37,"part":"p3","min":1,"short":{"r":"а","cut":true,"why":"Hugging Face — в «Для любопытных»."},"t":"На самом деле моделей миллионы","body":[{"row":[[{"fig":["≈ 3 млн","моделей на Hugging Face"]}],[{"label":"Узкие модели под одну задачу"},{"p":"Распознать речь, определить минерал по фото, прочитать дорожный знак, найти болезнь растения по листу"},{"p":"Их соединяют в цепочки: одна слушает, другая пишет, третья рисует"}]],"w":"1fr 1.3fr"}],"take":"Тренд — не только огромные модели, но и много узких, соединённых в одну систему","demo":{"t":"Узкие модели на Hugging Face","see":"Что написано в карточке модели и можно ли попробовать прямо в браузере","steps":["Распознавание речи: карточка Whisper — задача, размер, лицензия","Узкая модель по картинке: определить минерал или дорожный знак по фото","Можно ли запустить у себя: размер и требования к памяти"],"links":[["Whisper large-v3","https://huggingface.co/openai/whisper-large-v3","распознавание речи OpenAI, 1,55 млрд параметров, 99 языков"],["Parakeet TDT 0.6B v3","https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3","распознавание речи NVIDIA, 0,6 млрд параметров, 25 языков, включая русский"],["Классификатор горных пород","https://huggingface.co/Bazaar/cv_rock_classification","по фото: базальт, гранит, мрамор, песчаник и ещё три"],["Дорожные знаки","https://huggingface.co/Erpix3lt/traffic-sign-classifier","42 класса знаков"],["Алфавит жестового языка","https://huggingface.co/prithivMLmods/Alphabet-Sign-Language-Detection","буква по фото руки"],["Болезни растений","https://huggingface.co/linkanjarad/mobilenet_v2_1.0_224-plant-disease-identification","38 классов по фото листа"],["Hugging Face: каталог моделей","https://huggingface.co/models"]]},"lead":"Большие модели — верхушка. Под ней — миллионы узких, каждая хорошо делает одно дело","more":[{"h":"Как называют системы из нескольких моделей","text":["Систему, где несколько моделей и инструментов работают вместе, называют **составной ИИ-системой** (compound AI system) — так её назвали исследователи из Беркли в 2024 году. Пример — голосовой ввод: одна модель распознаёт речь, другая причёсывает текст. А модель, которая сама принимает и текст, и картинки, и звук, называют **мультимодальной**.","Источник: [Berkeley AI Research: The Shift from Models to Compound AI Systems](https://bair.berkeley.edu/blog/2024/02/18/compound-ai-systems/)."],"src_links":null},{"h":"Hugging Face в цифрах","list":["На Hugging Face больше 3 млн моделей — рубеж пройден в августе 2026 года; ещё год назад было 2 млн","**2 сентября 2026 года NVIDIA договорилась купить Hugging Face** — около 13 млрд долларов вместе с бонусами команде. Сделка ещё не закрыта: её ждут в первой половине 2027 года, после одобрения регуляторов. NVIDIA обещает оставить платформу открытой — [TechCrunch](https://techcrunch.com/2026/09/03/nvidia-confirms-it-will-buy-hugging-face-for-12-9-billion/)"]}],"words":["Большие модели, о которых мы говорим, — только верхушка. На Hugging Face около трёх миллионов моделей, и большинство из них узкие: каждая хорошо делает одно дело.","Распознать речь, определить минерал по фото, прочитать дорожный знак. Такие модели соединяют в цепочки: одна слушает, другая пишет, третья рисует.","Покажу пару карточек моделей: что умеет, сколько весит, можно ли запустить у себя."]},{"n":38,"part":"p3","min":3,"t":"Голосом вы даёте модели втрое больше контекста","body":[{"grid":[["≈ 36","слов в минуту печатаем на телефоне"],["≈ 52","слова в минуту — на клавиатуре компьютера"],["≈ 150","слов в минуту — говорим"],["в 3 раза","быстрее голосом, чем пальцами на телефоне"]],"cols":4},{"label":"Голосовой ввод — это две модели подряд"},{"flow":[{"h":"Голос"},{"h":"Распознавание речи","p":"Whisper, Parakeet"},{"h":"Сырой текст","sunk":true},{"h":"Языковая модель","p":"убирает «эээ», ставит знаки"},{"h":"Готовый текст","sunk":true}]}],"cap":["Кембридж, Аалто, Стэнфорд и Baidu, английский. На русском числа другие, соотношение похожее"],"take":"Наговорить контекст быстрее, чем напечатать, — и модель меньше додумывает","demo":{"t":"Одна надиктовка в Handy","see":"Сырой текст и причёсанный рядом","steps":["Надиктовываю абзац","Сырой текст от модели распознавания","Тот же текст после языковой модели"]},"week":[3,"Мастерская: своя программа расшифровки"],"more":[{"h":"Почему это важно исследователю","text":["Модель знает только то, что вы ей дали. Голосом за минуту вы расскажете втрое больше, чем напечатаете, — и, как правило, подробнее: с оговорками, примерами, «а ещё важно, что…». Это и есть контекст, которого обычно не хватает.","Для исследователя это особенно ценно: бриф, наблюдения после интервью, контекст проекта проще наговорить, чем написать. Иногда наговорить целый блок гораздо легче, чем печатать его по пунктам."]},{"co":"best","t":"Вайб-кодинг родился с голоса","text":["В феврале 2025 года Андрей Карпатый придумал слово «вайб-кодинг» — когда вы не пишете код, а говорите модели, что нужно, и смотрите на результат. В том же посте: «Я просто разговариваю с Composer через SuperWhisper и почти не касаюсь клавиатуры».","То есть новый способ работать с ИИ родился во многом с голоса: так быстрее, а модель получает больше контекста."],"src":[["Пост Карпатого про вайб-кодинг (через блог Саймона Уиллисона)","https://simonwillison.net/2025/Feb/6/andrej-karpathy/"]]},{"h":"Источники про скорость","links":[["Кембридж: средняя скорость печати — 52 слова в минуту","https://www.cam.ac.uk/research/news/what-makes-a-faster-typist"],["Аалто: печать на телефоне — 36 слов в минуту","https://userinterfaces.aalto.fi/typing37k"],["Стэнфорд и Baidu: голос в 3 раза быстрее печати на телефоне","https://news.stanford.edu/stories/2016/08/stanford-study-speech-recognition-faster-texting"]]},{"h":"Инструменты","links":[["Handy","https://handy.computer","бесплатный, работает офлайн, macOS, Windows и Linux"],["Wispr Flow","https://wisprflow.ai","платный"],["Whisper","https://github.com/openai/whisper","модель распознавания речи OpenAI"],["Parakeet","https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3","модель распознавания речи NVIDIA"]]}],"gap":20,"short":{"r":"д","min":2,"why":"Скорость — одной фразой, без показа Handy."},"words":["Печатаем мы около сорока слов в минуту, говорим — в три раза быстрее. Значит, голосом за то же время модель получает втрое больше контекста. Иногда наговорить гораздо легче, чем напечатать каждый блок."]},{"n":39,"part":"p3","min":3,"t":"Одна анкета на разных моделях: где старшая даёт разницу","body":[{"table":{"head":["Модель","Время","Цена прогона","Что видно в анкете"],"rows":[["Haiku 5.5","…","…","…"],["Sonnet 5.5","…","…","…"],["Opus 5.5","…","…","…"],["Fable 5.1","…","…","…"],["GPT-6 Luna","…","…","…"],["GPT-6 Astra","…","…","…"]]}}],"take":"Старшая модель нужна не всегда. За черновик на ней вы переплачиваете в разы","gpt":"В ChatGPT: на Free и Go по умолчанию GPT-5.6 Luna; на Plus и Pro — GPT-6 с ползунком рассуждения; GPT-6 Pro на модели Astra — на Pro с недельным лимитом. В Codex OpenAI советует GPT-6.1 Sol.","more":[{"h":"Как читать таблицу","text":"Одна и та же анкета по учебному брифу на младшей, средней и старшей моделях. Цены моделей Claude — на слайде 15. Таблицу заполним по итогам прогона. Сравнить самим — ДЗ-3."},{"h":"Цены OpenAI","table":{"head":["Модель OpenAI","Вход / выход, $ за 1 млн","Класс"],"rows":[["GPT-6 Luna","0,10 / 0,50","младшая, как Haiku"],["GPT-6 Sol","2 / 10","средняя, как Sonnet"],["GPT-6.1 Sol","2 / 10","для кода, рекомендована в Codex"],["GPT-6 Astra","10 / 50","старшая, как Fable"]]},"after":"Цены на 17 октября 2026 по справке OpenAI; официальная страница цен API у нас не открылась — перед занятием сверить. По классам цены OpenAI и Anthropic теперь почти совпадают. В ChatGPT: на Free и Go по умолчанию GPT-5.6 Luna, на Plus и Pro — GPT-6 с ползунком рассуждения, GPT-6 Pro на модели Astra — на Pro."}],"lw":760,"short":{"r":"д","min":1,"why":"Цены были на слайде 15; таблицу результатов — одним взглядом."},"words":["Одна анкета — шесть моделей. Цены уже были на слайде 15; здесь смотрим, где старшая модель даёт разницу, а где нет."]},{"n":40,"part":"p3","min":3,"t":"Как выбрать модель","body":[{"table":{"head":["Задача","Модель","Почему"],"cw":["44%","27%","29%"],"rows":[["Сотни коротких ответов разложить по категориям","Маленькая: Haiku, Luna","Важны скорость и цена"],["Анкета или гайд по брифу, разбор интервью","Средняя: Sonnet, Sol","Баланс качества и цены"],["Много источников, неочевидные выводы","Старшая: Opus, Fable, Astra","Глубже, но дороже и медленнее"],["Данные, которые нельзя выносить","Локальная","Данные не уходят с компьютера"],["Речь в текст","Распознавание речи","Это не языковая модель"]]}}],"take":"Простое и массовое — младшей модели. Сложное и редкое — старшей. Чувствительное — локальной","more":[{"h":"Как выбирать — полностью","table":{"head":["Задача","Модель","Почему"],"rows":[["Переформулировать, сократить, разложить сотни коротких ответов по готовым категориям","Маленькая и быстрая: Haiku; у OpenAI — Luna","Задача простая и повторяется много раз — важны скорость и цена"],["Анкета или гайд по брифу, разбор интервью","Средняя: Sonnet; у OpenAI — Sol","Баланс качества и цены"],["Сведение многих источников, неочевидные выводы, долгая работа с инструментами","Старшая: Opus, Fable; у OpenAI — Astra","Рассуждает глубже, но дороже и медленнее"],["Чувствительные данные, которые нельзя выносить","Локальная","Данные не уходят с компьютера, но качество ниже"],["Речь в текст","Модель распознавания речи","Это не языковая модель"]]}},{"co":"mine","t":"Плачу 100 долларов в месяц и не экономлю на модели","text":["Я плачу за Claude 100 долларов в месяц и работаю на старшей модели. Наверное, переплачиваю: часть задач справилась бы и Sonnet. Зато получаю качество и не переживаю за результат.","Случай из практики: анализ проектной работы, где было много контекста, который надо было улавливать целиком. Я отдал задачу Opus — и результат получился феноменальный.","Если чувствуете, что ИИ вас подводит, попробуйте модель побольше — даже если придётся заплатить."]}],"words":["Свой пример: плачу сто долларов в месяц, работаю на старшей модели. Если ИИ подводит — попробуйте модель побольше."]},{"n":41,"part":"p3","min":3,"t":"Куда уходят ваши данные","body":[{"table":{"head":["Настройка","Claude","ChatGPT"],"rows":[["Обучение на переписках","Настройки → Конфиденциальность","Настройки → Управление данными"],["Память","Настройки → Память","Настройки → Персонализация → Память"],["Временный чат","Инкогнито-чат","Temporary Chat"],["Сколько хранится","С обучением — до 5 лет, без — 30 дней","Временные чаты — до 30 дней"]]}}],"cap":"Названия пунктов меню и сроки хранения — на 13 октября 2026, перед занятием проверить","short":{"r":"а","note":"Локальные модели — всё остаётся у вас: Handy для речи, LM Studio или Ollama для текста."},"take":"Такие настройки есть почти везде. Найдите их в своих сервисах до субботы","demo":{"t":"Настройки в Claude и ChatGPT","see":"Три рычага, которые есть почти везде","steps":["Обучение на ваших переписках","Память","Временный чат"]},"more":[{"h":"Где что лежит","table":{"head":["Настройка","Claude","ChatGPT"],"rows":[["Обучение на ваших переписках","Настройки → Конфиденциальность → «Help improve our AI models»","Настройки → Управление данными → «Improve the model for everyone»"],["Память","Настройки → Память: что Claude знает о вас (разделы «Вы», «Темы», «Люди»), можно поправить или удалить; отдельный флажок — запоминать ли чувствительные темы","Настройки → Персонализация → Память: сохранённые воспоминания и опора на историю чатов; сводка памяти, кнопка «удалить всё и выключить»"],["Временный чат","Инкогнито-чат: не попадает в историю и в память","Temporary Chat: не попадает в историю, не учит модель, не трогает память"],["Сколько хранится","С включённым обучением — до 5 лет, с выключенным — 30 дней","Временные чаты — до 30 дней"]]}},{"h":"Что модель уже знает о вас","lead":"Попросите сервис выписать всё, что он о вас помнит. Так видно, сколько данных уже накопилось, — и этот же документ поможет переехать в другой сервис: вставьте его туда как контекст.","prompt":"Всё, что ты знаешь обо мне","after":"В Claude такой документ можно вставить в `Настройки → Память → «Начать импорт»` — так память переезжает из ChatGPT или другого сервиса. Источник промпта: [Anthropic, импорт и экспорт памяти](https://support.claude.com/en/articles/12123587-import-and-export-your-memory-from-claude)."},{"h":"Справка сервисов","links":[["Anthropic: условия для личных тарифов и обучение на данных","https://www.anthropic.com/news/updates-to-our-consumer-terms"],["OpenAI: управление данными","https://help.openai.com/en/articles/7730893-data-controls-faq"],["OpenAI: память в ChatGPT","https://help.openai.com/en/articles/8590148-memory-faq"]]}],"words":["Что выгружать, решаете вы. Задача — знать, что эти рычаги есть."]},{"n":42,"part":"p3","min":2,"gap":20,"short":{"r":"а","cut":true,"why":"Локальные модели — строкой на слайде 41."},"t":"Локальные модели: всё остаётся у вас","body":[{"compare":[{"h":"Облачная модель","rows":[["Где считается","На серверах компании"],["Кто видит данные","Сервис — по своим правилам хранения"],["Качество","Выше: самые большие модели"],["Что нужно","Браузер или приложение"]]},{"h":"Локальная модель","accent":true,"rows":[["Где считается","На вашем компьютере"],["Кто видит данные","Только вы: данные не уходят"],["Качество","Ниже"],["Что нужно","Память и мощный процессор или видеокарта"]]}]}],"take":"Локальная модель — когда данные нельзя выносить. Платите за это памятью компьютера и качеством","more":[{"co":"mine","t":"Whisper у меня на ноутбуке","text":["Для своего рекордера встреч MeetGrab я расшифровываю записи локально — моделью Whisper. Записи не уходят с компьютера.","Сколько памяти это требует: по таблице OpenAI, самой большой модели Whisper нужно около 10 ГБ памяти, облегчённой turbo — около 6 ГБ, маленьким — 1–2 ГБ. У меня MacBook Air M2 с 16 ГБ общей памяти: большая модель заняла бы больше половины."]},{"h":"Почему всем вдруг понадобились память и Mac mini","list":["**Mac mini.** В январе 2026 года люди массово покупали Mac mini, чтобы круглосуточно держать на них ИИ-агента Clawdbot (потом OpenClaw), — даже автор агента просил не покупать. Маленький тихий компьютер, который не выключается, — ровно то, что нужно агенту и локальной модели — [Business Insider через Slashdot](https://tech.slashdot.org/story/26/01/28/0510226/clawdbot-has-ai-techies-buying-mac-minis)","**Почему память.** Чтобы модель работала, все её веса должны лежать в памяти — оперативной или видеокарты, — плюс место под контекст. Чем больше модель, тем больше памяти. У Mac память общая для процессора и видеочипа, поэтому на нём удобно запускать модели","**Почему она подорожала.** С октября по декабрь 2025 года комплект памяти DDR5 на 64 ГБ подорожал примерно с 200 до 800 долларов. Главная причина — дата-центры для ИИ: производители перевели мощности на память для серверов и видеокарт — [TechRadar](https://www.techradar.com/pro/good-news-ram-prices-seem-to-have-finally-stabilized-bad-news-its-probably-because-memory-prices-are-so-high-that-its-forcing-most-of-us-to-give-up-buying-anything), [The Register](https://www.theregister.com/2026/01/06/memory_firm_profits_up_as/)"]},{"h":"Попробовать","links":[["LM Studio","https://lmstudio.ai","локальные модели с окном чата"],["Ollama","https://ollama.com","локальные модели, проще всего из командной строки"],["Handy","https://handy.computer","распознавание речи на компьютере"]]}],"words":["Последнее в этой части — локальные модели. Они работают прямо на вашем компьютере, и данные никуда не уходят.","Платите за это памятью компьютера и качеством: самые большие модели дома не запустить.","У меня так работает расшифровка встреч в MeetGrab — моделью Whisper, записи не покидают ноутбук."]},{"n":43,"part":"p4","kind":"section","min":0,"t":"Код считает, токены угадывают","lead":"Галлюцинация в тексте неприятна, а в числах опаснее: выдуманное число выглядит так же точно, как посчитанное. Как сделать, чтобы модель считала, а не придумывала","more":[{"h":"Почему числа опаснее текста","text":["Выдуманную цитату иногда выдаёт стиль: так человек не говорит. Выдуманное число не выдаёт ничего: «37%» выглядит так же убедительно, как настоящие 37%. Его легко вставить в отчёт и трудно поймать.","Модель называет число так же, как продолжает текст, — по вероятности. Поэтому правило части: нужно число — просите посчитать кодом и смотрите на код."]}],"words":["Четвёртая часть — про числа. Выдуманная цитата иногда выдаёт себя стилем, а выдуманное число выглядит так же точно, как посчитанное. Поэтому правило: нужно число — просите посчитать кодом и смотрите на код."]},{"n":44,"part":"p4","min":4,"t":"Правдоподобное число и посчитанное","lead":"«Сколько респондентов старше 45 лет платят за ИИ-сервис?»","body":[{"compare":[{"h":"Токенами","rows":[["Что происходит","Модель называет число, которое выглядит правильным"],["Можно проверить?","Нет: за числом нет вычисления"]]},{"h":"Кодом","accent":true,"rows":[["Что происходит","Модель пишет программу на Python, сервис её запускает, программа считает"],["Можно проверить?","Да: число точное, код можно открыть"]]}]}],"take":"Токены угадывают, код считает","demo":{"t":"Один вопрос — без кода и с кодом","see":"Синтетическая выгрузка на 200 строк, один и тот же вопрос дважды","steps":["Claude с выключенным выполнением кода: вставляю данные текстом и задаю вопрос","Новый чат, выполнение кода включено: загружаю файл, тот же вопрос с промптом «Посчитай кодом»","Открываем код: как он обошёлся с возрастом текстом, пропусками и повторной анкетой"],"more":["Вы можете повторить сами: файл и промпт — под слайдом"]},"more":[{"h":"Файл для показа и для вас","files":[{"ext":"CSV","t":"Синтетическая выгрузка: как люди пользуются ИИ","n":"200 строк, как из платформы опросов, с настоящими шероховатостями","url":"files/vygruzka-ii-200.csv"},{"ext":"XLSX","t":"Та же выгрузка в Excel","n":"для тех, кто открывает в Excel или Numbers","url":"files/vygruzka-ii-200.xlsx"}]},{"h":"Как повторить: без кода и с кодом","steps":["**Без кода.** В Claude выключите выполнение кода: `Настройки → Возможности → «Выполнение кода и создание файлов»`. Откройте CSV в текстовом редакторе, скопируйте всё и вставьте в чат. Спросите: «Сколько респондентов старше 45 лет платят за ИИ-сервис?» Запишите число","**С кодом.** Включите выполнение кода обратно. В новом чате загрузите файл и отправьте промпт «Посчитай кодом» ниже. Запишите число","**Сравните.** Совпали ли числа? Откройте код: как он понял «старше 45», что сделал с возрастом «55 лет», с пустыми ячейками и с анкетой, которую отправили дважды","**В ChatGPT** то же самое: загрузите файл и попросите посчитать кодом. Если код в ответе не виден — попросите показать его"]},{"h":"Промпт","prompt":"Посчитай кодом"},{"h":"Где выключается выполнение кода в Claude","text":"`Настройки → Возможности → «Выполнение кода и создание файлов»`. Название пункта — на 13 октября 2026."}],"words":["Вопрос с подвохом, как в настоящей выгрузке: у двоих возраст записан текстом, у четверых пустой, один человек отправил анкету дважды. Правильный ответ — 11. Без чистки получается 10 или 12."]},{"n":45,"part":"p4","min":5,"gap":24,"t":"Как это работает и когда модель берётся за код","body":[{"flow":[{"h":"Вопрос"},{"h":"Модель пишет программу","p":"на Python"},{"h":"Песочница","p":"отдельный компьютер в облаке"},{"h":"Результат","p":"число, таблица, график"},{"h":"Ответ","p":"опирается на результат","sunk":true}]},{"grid":[["Обычно считает кодом","Вы загрузили файл с данными, вопрос требует точного счёта или вы прямо попросили"],["Может ответить токенами","Данные вставлены текстом, выполнение кода выключено или сервис этого не умеет"],["Как понять, что был код","В Claude шаги и вывод программы раскрываются в ответе. В ChatGPT — попросите показать код"]],"cols":3}],"take":"Нужно число — просите код. Не видите кода — не верьте числу","week":[5,"Лаборатория опроса: весь анализ — кодом"],"gpt":"В ChatGPT код выполняется в отдельной среде Python. Если код в ответе не виден — попросите: «Покажи код, который ты запускал».","more":[{"h":"Где посмотреть код","table":{"head":["Где","Как увидеть код и рассуждение"],"rows":[["Claude в чате","В ответе раскрываются шаги работы: нажмите на строку с анализом или запуском кода — откроется код и вывод программы. Если включено рассуждение, его тоже можно развернуть"],["ChatGPT","Код выполняется в отдельной среде Python. Если код в ответе не виден — попросите: «Покажи код, который ты запускал»"],["Claude Code и Codex","Код виден прямо в терминале: какие команды агент запускает и что они вывели. Скрипты, которые он пишет, остаются файлами в папке"]]}},{"h":"Попросите объяснить код","lead":"Код можно не уметь читать: попросите модель разобрать его построчно. Так видно, что на самом деле посчитано и где модель могла ошибиться.","prompt":"Объясни этот код"},{"h":"Подробнее","list":["**Когда модель обычно считает кодом:** вы загрузили файл с данными (CSV, Excel); вопрос требует точного счёта; вы прямо попросили «посчитай кодом»","**Когда может ответить токенами:** данные вставлены текстом и вопрос звучит как просьба пересказать; выполнение кода выключено; сервис этого не умеет — у DeepSeek и Алисы AI проверяем","**Как понять, что был код:** в Claude шаги работы и вывод программы раскрываются в ответе; в ChatGPT попросите показать код"]}],"demo":{"t":"Где посмотреть код и как попросить его объяснить","see":"Что на самом деле происходило под капотом","steps":["Раскрываю шаги ответа: рассуждение, код, вывод программы","Копирую кусок кода в новое сообщение","Прошу объяснить построчно — промпт «Объясни этот код»"]},"short":{"r":"д","min":4,"why":"Код объясняю на одном куске."},"words":["Сервисы не публикуют точного правила, когда модель выберет код: это решение модели. Поэтому если нужно число, просим посчитать кодом прямо.","И смотрим, что происходило под капотом: раскрываю рассуждение и код, копирую кусок и прошу объяснить построчно. Получается очень наглядно."]},{"n":46,"part":"out","kind":"section","nonum":true,"min":0,"t":"Новое на сегодня закончилось","lead":"Дальше — итоги: что вы теперь можете объяснить, домашка и что будет на неделе","words":["Новое на сегодня закончилось. Дальше — итоги: проверим, что вы теперь можете объяснить, разберём домашку и что будет на неделе."]},{"n":47,"part":"out","kind":"qs","min":3,"t":"Что вы теперь можете объяснить","body":[{"qs":["Почему ответ не бывает лучше контекста? {{16}}","Что такое токен и почему русский дороже?
