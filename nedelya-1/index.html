{{8}}","Что такое галлюцинация и откуда она берётся? {{9}}","Почему модель ничего не помнит и откуда тогда память? {{10}}","Почему контекст не бесконечный? {{12}}","«Токены кончились» — что именно кончилось? {{13}}","Чем чат отличается от агента? {{25}}","Что такое MCP и навык? {{27}}, {{29}}","Почему модели разные и какую взять под задачу? {{34}}, {{40}}","Когда модель считает кодом, а когда угадывает? {{44}}"],"cols2":true}],"more":[{"h":"Если на вопрос нет ответа","text":"Откройте слайд по ссылке: под каждым слайдом — подробности и источники. Не помогло — приходите в четверг на часы вопросов."}],"short":{"r":"д","min":2,"why":"Пять вопросов из десяти — остальные для самопроверки."},"words":["Вот десять вопросов. Если на вопрос можете ответить своими словами — тема легла.","Отвечать вслух не нужно, это для самопроверки. У каждого вопроса ссылка на слайд с ответом: если где-то пусто — откройте слайд или приходите в четверг."]},{"n":48,"part":"out","kind":"try","min":2,"t":"Попробуйте сами: домашка","body":[{"try":[["Начните сразу","В среду и четверг попробуйте части домашки в разных сервисах и режимах"],["Четверг, 18:30","Часы вопросов: приходите с тем, что получилось и что не завелось"],["Суббота, 10:00","Не проверка домашки, а разговор: что нового каждый узнал и как изменилось понимание"],["Обязательно",["Своя задача в двух сервисах — без контекста и с контекстом","Бриф → анкета в своих сервисах → общая таблица","Одна задача на младшей и старшей модели","Экскурсия по своему сервису и что он о вас знает","Поставить Claude Code и найти аудиозапись"]]]}],"more":[{"h":"Домашка целиком","text":"Что было на занятии, что должно получиться, если не получилось и промпты — на странице [Домашка](#dz)."}],"take":"Шаги и что должно получиться — на странице «Домашка»","words":["Не откладывайте на пятницу: начните в среду, тогда в четверг будет что спросить. А в субботу мы не проверяем домашку, а обсуждаем, кто что нового узнал и как изменилось понимание."]},{"n":49,"part":"out","min":1,"t":"Мини-библиотека: куда идти дальше","body":[{"compare":[{"h":"Как устроены модели","list":["[Карпатый: How I use LLMs](https://www.youtube.com/watch?v=EWvNQjAaOHw) — практично","[Карпатый: Deep Dive into LLMs](https://www.youtube.com/watch?v=7xTGNNLPyMI) — подробно","[Карпатый: Intro to LLMs](https://www.youtube.com/watch?v=zjkBMFhNj_g) — за час"]},{"h":"Как ставить задачу и держать контекст","accent":true,"list":["[Наша выжимка гайдов, PDF](files/kak-stavit-zadachu-ii.pdf)","[Anthropic: prompt engineering](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview)","[Anthropic: context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)"]},{"h":"Модели у себя","list":["[Hugging Face](https://huggingface.co/models) — каталог моделей","[LM Studio](https://lmstudio.ai) — локальные модели с окном чата","[Ollama](https://ollama.com) — локальные модели"]}]}],"more":[{"h":"Где это на сайте","links":[["Для любопытных: видео, гайды, статьи","#lyubopytnym"],["Домашка: по желанию","#dz"],["Материалы и файлы недели","#materialy"]]}],"take":"Всё это и многое другое — на странице «Для любопытных»","words":["Если хочется глубже — вот мини-библиотека: как устроены модели, как ставить задачу и держать контекст, модели у себя. Зачитывать не буду: всё это есть на сайте, а ещё больше — на странице «Для любопытных»."]},{"n":50,"part":"out","min":1,"t":"Что дальше","body":[{"dates":[{"h":"Чт, 22 октября, 18:30","p":"Часы вопросов: что получилось и что не завелось. Что не успели на занятии — разберём здесь"},{"h":"Сб, 24 октября, 10:00","p":"Встреча: что нового каждый узнал, как изменилось понимание и самая странная вещь, которую сделала модель"},{"h":"Неделя 2","p":"Алёна Захарова, «Штаб исследователя»","accent":true}]}],"take":"Сегодня — общая база и словарь. На следующих неделях применяем их к своей работе","words":["Что дальше на неделе. В четверг в 18:30 — часы вопросов: что получилось, что не завелось, и то, что не успели сегодня.","В субботу в 10:00 — встреча: что нового каждый узнал, как изменилось понимание и какую самую странную вещь сделала модель.","Следующую неделю ведёт Алёна Захарова — «Штаб исследователя»."]},{"n":51,"part":"out","kind":"qs","min":3,"t":"Обратная связь: три вопроса","lead":"Ответьте в чат Zoom — по одному-два предложения","body":[{"qs":["Что сегодня вы узнали нового?","Что ценного получили? Это не обязательно новое знание: обсуждение, понимание, открытие про себя","Что хочется раскрыть глубже? Чего ждали, но не получили?"],"one":true}],"take":"Ответы читаю после занятия и учитываю на неделях 3 и 5","short":{"r":"д","min":2,"why":"Ответы — письменно в чат, без обсуждения."},"words":["И последнее — три вопроса в чат Zoom, по одному-два предложения: что нового узнали, что ценного получили и что хочется раскрыть глубже.","Ответы читаю после занятия и учитываю на неделях 3 и 5. Вопросы, на которые не хватило времени, — в чат курса или в четверг в 18:30."]}],"prompts":{"Токенайзер: промпт на русском":{"text":"Ты — опытный исследователь пользовательского опыта. Мне нужно подготовить опрос о том, как люди в России пользуются ИИ-сервисами: какими сервисами, как часто, для каких задач и готовы ли за них платить. Опрос пройдут 1000 человек от 18 лет, на прохождение — не больше 10 минут.\n\nСделай анкету из 12–15 вопросов. Начни с вопросов-фильтров, потом основная часть, в конце — вопросы о респонденте. У закрытых вопросов добавь варианты «Другое» и «Затрудняюсь ответить». Не используй слова «нейросеть» и «промпт»: часть респондентов их не знает.\n\nДля каждого вопроса укажи тип: один ответ, несколько ответов, шкала или открытый вопрос. Результат оформи таблицей: номер, вопрос, тип, варианты ответа.","where":"Практика на {{8}}: вставьте в токенайзер, потом отправьте в свой чат.","note":"В токенизаторе o200k — 195 токенов."},"Токенайзер: тот же промпт на английском":{"text":"You are an experienced user experience researcher. I need to prepare a survey about how people in Russia use AI services: which services, how often, for which tasks, and whether they are willing to pay for them. The survey will be completed by 1,000 people aged 18 and over and should take no more than 10 minutes.\n\nCreate a questionnaire of 12–15 questions. Start with screening questions, then the main part, and end with questions about the respondent. For closed questions, add the options \"Other\" and \"Don't know\". Do not use the words \"neural network\" or \"prompt\": some respondents do not know them.\n\nFor each question, specify the type: single choice, multiple choice, scale, or open-ended. Format the result as a table: number, question, type, answer options.","where":"Практика на {{8}}: сравните с русским.","note":"В токенизаторе o200k — 170 токенов."},"Бриф количественного исследования":{"text":"Составь бриф количественного исследования. Тема: как люди в России пользуются ИИ-сервисами.\n\nЦель исследования — понять, как люди в массе используют ИИ: какими сервисами и моделями пользуются, платят за них или нет, для каких задач и типов работы.\n\nЗаказчик: ⟪команда, которая делает ИИ-ассистента для массового пользователя⟫. По итогам он решит: ⟪на какой сегмент делать ставку и какой будет подписка⟫.\n\nВ брифе должно быть: кто заказчик и какое решение примет; что хотим узнать — 5–7 пунктов; кого опрашиваем и квоты; метод и ограничения (онлайн-опрос, ⟪1000⟫ анкет, до 10 минут); что уже известно; сроки. Объём — до полутора страниц, простым языком.","where":"Практика на {{16}}, шаг 1. Или возьмите готовый бриф из материалов."},"Анкета без контекста":{"text":"Сделай анкету про то, как люди пользуются ИИ.","where":"Практика на {{16}}, шаг 2."},"Анкета по брифу":{"text":"Сделай анкету по этому брифу.\n\n⟪вставьте или приложите бриф⟫","where":"{{16}}, второй прогон."},"Анкета по брифу: показ в Claude Code":{"text":"Сделай анкету онлайн-опроса по брифу ниже. Ответь прямо в чате, файлов не создавай. В конце напиши, сколько получилось вопросов.\n\n---\n\n# Бриф: как люди в России пользуются ИИ-сервисами\n\nУчебный бриф курса «ИИ в исследованиях», неделя 1. Компания и задача вымышленные, совпадения случайны.\n\n## Кто заказчик\n\n«Нейрон» — команда, которая делает ИИ-ассистента для массового пользователя: приложение на телефоне и веб-версия. Ассистент вышел полгода назад, у него 400 тысяч активных пользователей в месяц, платят из них около 3%. Команда решает, что делать в следующем году: бороться за тех, кто ИИ ещё не пользуется, или за тех, кто уже пользуется чужими сервисами.\n\n## Какое решение примут по итогам\n\n1. На какой сегмент делать ставку в 2027 году: новички, регулярные пользователи бесплатных сервисов или те, кто уже платит.\n2. Какие три сценария использования развивать первыми.\n3. Какой должна быть подписка: цена и за что люди готовы платить.\n\n## Что хотим узнать\n\n- Какая доля взрослых жителей России пользуется ИИ-сервисами и как часто. Чем различаются возрастные группы.\n- Какими сервисами и моделями пользуются: ChatGPT, Алиса AI, GigaChat, DeepSeek, Claude, Perplexity и другие. Какой из них основной и почему.\n- Для каких задач: поиск информации, тексты и письма, учёба, работа с кодом, перевод, картинки, анализ данных, советы и разговоры.\n- Платят ли за ИИ, сколько в месяц и за что именно. Почему не платят те, кто не платит.\n- Что мешает пользоваться чаще: доверие, точность ответов, доступ и оплата, непонимание, как спрашивать.\n- Кто пробовал и бросил — почему.\n- Насколько довольны своим основным сервисом и готовы ли его рекомендовать.\n\n## Кого опрашиваем\n\nЖители России от 18 лет, которые пользуются интернетом каждый день. Квоты по полу, возрасту (18–29, 30–44, 45–59, 60+) и типу населённого пункта (Москва, Санкт-Петербург, города-миллионники, другие города, сёла). Тех, кто ИИ не пользуется, не отсекаем: им — короткая ветка про причины.\n\n## Метод и ограничения\n\n- Онлайн-опрос, 1000 анкет, не дольше 10 минут на прохождение.\n- Больше всего закрытых вопросов; открытых — не больше двух.\n- Не спрашиваем доход и место работы с названием компании.\n- Формулировки — без слов «нейросеть», «LLM» и «промпт»: часть респондентов их не знает. Говорим «ИИ-сервисы», «ассистенты вроде ChatGPT или Алисы».\n- Если останется бюджет — 12 глубинных интервью: 6 с теми, кто платит, и 6 с теми, кто попробовал и бросил.\n\n## Что уже известно\n\n- Внутренняя аналитика «Нейрона»: самые частые запросы — поиск информации и тексты. Пользователи старше 45 приходят реже, но остаются дольше.\n- Отзывы в магазинах приложений: жалуются на выдуманные факты, лимиты и то, что ассистент «не помнит, о чём говорили».\n\n## Сроки\n\nАнкета — за неделю, поле — две недели, отчёт — через месяц после старта.","where":"{{15}}, показ: одна задача на двух моделях.","note":"Бриф учебный — тот же, что в материалах. «Файлов не создавай» — чтобы Claude Code не спрашивал разрешения на запись посреди показа."},"Анкета по брифу, с требованиями и примером":{"text":"Сделай анкету опроса по брифу во вложении.\n\nТребования к анкете:\n— ⟪не больше 15 вопросов, до 10 минут на прохождение⟫\n— ⟪сначала вопросы-фильтры, потом основная часть⟫\n— ⟪у закрытых вопросов есть варианты «Другое» и «Затрудняюсь ответить»⟫\n— ⟪без слов «нейросеть» и «промпт»⟫\n\nПример хорошего вопроса:\n⟪Как часто за последний месяц вы пользовались ИИ-сервисами, например ChatGPT или Алисой? — Ни разу / 1–2 раза / Раз в неделю / Несколько раз в неделю / Каждый день⟫\n\n⟪приложите бриф⟫","where":"Практика на {{16}}, шаг 3, и ДЗ-2."},"Каркас постановки задачи":{"text":"Что сделать: ⟪анкету опроса⟫\nЗачем и для кого: ⟪для продуктовой команды, чтобы решить …⟫\nЧто прикладываю: ⟪бриф, прошлую анкету⟫\nВ каком виде нужен результат: ⟪таблица: вопрос, тип, варианты ответа⟫\nЧего не делать: ⟪не добавлять вопросы про доход⟫\nПример: ⟪хороший вопрос из прошлой анкеты⟫","where":"{{17}} и ДЗ-1."},"Посчитай кодом":{"text":"Посчитай кодом по файлу во вложении: ⟪сколько респондентов старше 45 лет платят за ИИ-сервис⟫.\nПеред подсчётом проверь данные: пропуски, значения записанные текстом, повторяющиеся анкеты. Напиши, что нашёл и как это учёл.\nПокажи код, который запускал, и результат его выполнения.","where":"{{44}}, ДЗ-10."},"Объясни этот код":{"text":"Вот код, который ты запускал, чтобы получить ответ. Объясни его построчно простыми словами: что делает каждая строка и какие данные берёт.\nОтдельно скажи: как код обошёлся с пропусками, со значениями, записанными текстом, и с повторяющимися строками. Где в нём может быть ошибка?\n\n⟪вставьте код⟫","where":"{{45}}, ДЗ-10."},"Навык из этого чата":{"text":"Проанализируй этот чат и собери из него навык (skill), чтобы в следующий раз делать такую работу без долгих объяснений.\n\nНазови навык ⟪гайд-по-брифу⟫. В описании напиши, когда его применять: какими словами я обычно прошу такую работу.\nВ инструкцию включи: шаги, которые мы в итоге прошли; мои правки и требования, которые я повторял; формат результата; чего не делать; пример хорошего результата из этого чата.\nОформи как папку навыка: файл SKILL.md с полями name и description в начале. Если в чате мало моих правок — сначала скажи, каких сведений не хватает.","where":"{{29}}, ДЗ-12."},"Всё, что ты знаешь обо мне":{"text":"Мне нужно увидеть всё, что ты обо мне знаешь. Перечисли каждую запись из своей памяти обо мне и всё, что ты узнал обо мне из прошлых разговоров.\n\nВыведи всё одним блоком кода, чтобы было удобно скопировать. Каждая запись — в формате: [дата, если известна] — что записано.\n\nОбязательно охвати:\n— мои инструкции о том, как отвечать: тон, формат, стиль, «всегда делай», «никогда не делай»;\n— личное: имя, город, работа, семья, интересы;\n— проекты, цели и темы, к которым я возвращаюсь;\n— инструменты и программы, которыми я пользуюсь;\n— мои поправки к твоему поведению;\n— всё остальное, что не вошло выше.\n\nПо возможности сохраняй мои слова дословно. Ничего не обобщай, не группируй и не пропускай. После блока кода скажи, полный ли это список или что-то осталось.","where":"{{11}}, {{41}}, ДЗ-4.","note":"Перевод промпта, который Anthropic предлагает для переноса памяти из другого сервиса в Claude: claude.com/import-memory."},"Найди проблемы в интерфейсе":{"text":"На скриншоте — ⟪экран оформления заявки в мобильном приложении⟫.\nНайди проблемы, которые могут помешать пользователю ⟪оформить заявку с первого раза⟫. Для каждой: что не так, где на экране, насколько серьёзно.","where":"ДЗ-11, к {{35}}."}},"hw":{"lead":"До субботы, 24 октября. Начните в среду: в четверг, 22 октября, на часах вопросов разберём, что получилось и что не завелось. В субботу не проверяем домашку, а обсуждаем, что нового каждый узнал и как изменилось понимание.","must":[{"id":"ДЗ-1","must":true,"from":[16,17],"t":"Своя рабочая задача в двух сервисах — без контекста и с контекстом","was":"На занятии — анкета про ИИ: без контекста и по брифу с требованиями и примером.","check":["Взята своя рабочая задача, а не учебная","Два сервиса, в каждом два прогона: без контекста и с контекстом","Записано, чем отличаются ответы","Готовы показать разницу в субботу"],"retry":"Нет подходящей задачи — возьмите учебный бриф из материалов. Не завелось — разберём в четверг на часах вопросов.","prompt":"Каркас постановки задачи","how":"Возьмите задачу из своей работы на этой неделе: анкету, гайд, разбор интервью, письмо заказчику. Важно, чтобы у вас был к ней настоящий контекст: бриф, данные, прошлые версии.","steps":["Выберите задачу и соберите контекст: бриф, требования, пример хорошего результата","Сервис 1, новый чат: попросите сделать задачу одной фразой, без контекста. Сохраните ответ","Сервис 1, новый чат: та же задача по каркасу из шести пунктов, с приложенным контекстом. Сохраните ответ","Повторите оба шага во втором сервисе","Запишите три–пять отличий: что появилось, что ушло, где модель додумала"],"result":"Короткая заметка: задача, два сервиса, что изменилось с контекстом, и пара скриншотов. В субботу — две минуты на самую заметную разницу. Данные заказчика замажьте или замените."},{"id":"ДЗ-2","must":true,"from":20,"t":"Бриф → анкета в своих сервисах → общая таблица","was":"На занятии — анкеты пяти сервисов рядом и практика с брифом.","how":"Сервисы пятёрки распределяем заранее, чтобы каждый попробовали хотя бы трое. Тогда к субботе у группы будет общая карта, собранная своими руками.","check":["Анкета по синтетическому брифу сделана в двух своих сервисах","В общей таблице заполнены сервис, модель и режим","Записано, что получилось и чем отличается"],"retry":"Сервис не пускает или кончился лимит — сделайте в одном и отметьте это в таблице.","prompt":"Анкета по брифу, с требованиями и примером","steps":["Посмотрите в таблице распределения, какие два сервиса — ваши","Возьмите учебный бриф или тот, что сгенерировали на занятии","В каждом сервисе: новый чат, промпт «Анкета по брифу, с требованиями и примером», бриф приложите","Запишите в общую таблицу: сервис, модель (как она называется в интерфейсе), режим, сколько вопросов получилось, что хорошо, что плохо","Отметьте одну вещь, которая в этом сервисе удивила"],"result":"Строки в общей таблице и файл или ссылка на анкету. В субботу смотрим таблицу всей группой: где какой сервис силён."},{"id":"ДЗ-3","must":true,"from":39,"t":"Одна и та же задача на младшей и старшей модели","was":"На занятии — одна анкета в линейках Claude и OpenAI, результаты заготовлены заранее.","how":"В Claude и в ChatGPT или в своих сервисах.","check":["Одна задача прогнана на младшей и старшей модели","Рядом с результатом записаны модель и дата","Видно, где старшая модель дала разницу, а где нет"],"retry":"Старшая модель недоступна на вашем тарифе — сравните младшую и среднюю.","steps":["Возьмите задачу посложнее: разбор интервью, сводку нескольких источников, анкету по брифу","Claude: выберите младшую модель в списке моделей под полем ввода и отправьте задачу. В новом чате — старшая модель, та же задача. В ChatGPT — то же с быстрой и с самой мощной моделью","Засеките, сколько думала каждая модель","Рядом с каждым результатом запишите модель и дату","Отметьте, где старшая дала разницу, а где нет"],"result":"Таблица на две–три строки: модель, время, что видно в результате. В субботу — одна находка: на какой задаче младшей хватает."},{"id":"ДЗ-4","must":true,"from":[22,23,41],"t":"Экскурсия по своему сервису и что он о вас знает","was":"На занятии — экскурсия по Claude, ChatGPT и Codex и настройки приватности.","how":"Потратьте время на проекты, артефакты, режим плана, дизайн, кастомизацию (навыки, коннекторы), память и настройки приватности. И посмотрите, что сервис уже знает о вас.","check":["Пройдены проекты, артефакты, режим плана, навыки и коннекторы","Выставлены настройки памяти и обучения на ваших данных","Сервис выписал, что он о вас знает, и вы это прочитали","Есть одна находка, которую вы нашли сами"],"retry":"Не нашли пункт меню — названия меняются. Спросите в четверг на часах вопросов.","steps":["Пройдите по разделам: проекты, артефакты, режим плана, навыки, коннекторы, память, приватность","Выставьте настройки обучения на ваших данных и памяти так, как вам нужно","Попросите сервис выписать всё, что он о вас знает, — промпт «Всё, что ты знаешь обо мне»","Прочитайте: что правда, что лишнее, что удивило. Лишнее удалите в настройках памяти","Найдите одну функцию, о которой вы не знали, и попробуйте её на своей задаче"],"result":"Одна находка: что это, где лежит, чем полезна. И одна фраза: что сервис знал о вас такого, чего вы не ожидали. Сам документ показывать не нужно.","prompt":"Всё, что ты знаешь обо мне"},{"id":"ДЗ-5","must":true,"from":26,"t":"Поставить Claude Code и найти у себя аудиозапись","was":"На занятии — Claude Code кладёт файл анкеты в папку.","how":"Обе вещи понадобятся на неделе 3, в Мастерской.","check":["Claude Code поставлен и отвечает в папке","Найдена аудиозапись интервью или встречи, которую можно расшифровывать"],"retry":"Не ставится — разберём в четверг на часах вопросов. Терминал подробно — на неделе 3.","steps":["Поставьте Claude Code по [инструкции Anthropic](https://code.claude.com/docs/en/setup): на Mac и Linux — одна команда в терминале, на Windows — своя","Создайте папку для курса и откройте её в терминале: `cd` и путь к папке","Запустите `claude` и войдите своей подпиской","Попросите: «Создай файл привет.md с тремя строками о том, зачем я пришёл на курс». Проверьте, что файл появился в папке","Найдите аудиозапись интервью или встречи на 20–60 минут, которую можно расшифровывать, и положите копию в эту папку"],"result":"Скриншот терминала с ответом Claude Code и файлом в папке. Запись — у вас на компьютере, понадобится на неделе 3."}],"opt":[{"id":"ДЗ-6","from":24,"t":"Та же задача в проекте и в агенте","was":"На занятии — одна анкета в чате, в проекте и в Cowork.","how":"Покажет, что меняют постоянный контекст и доступ к файлам.","steps":["Создайте проект: в материалы — бриф, в инструкции — требования к результату","В проекте попросите сделать задачу одной фразой","Откройте Cowork (в ChatGPT — режим Work), дайте доступ к папке с теми же материалами и попросите то же самое, с сохранением файла в папку","Сравните: сколько пришлось объяснять и где лежит результат"],"result":"Два результата рядом и одна фраза: что удобнее для вашей работы."},{"id":"ДЗ-7","from":38,"t":"Час работы с ИИ только голосом","was":"На занятии — сколько контекста даёт голос и как устроен голосовой ввод.","how":"Если ещё не пробовали — попробуйте целый час работать с ИИ, не печатая.","steps":["Включите голосовой ввод: кнопка микрофона в приложении Claude или ChatGPT, диктовка в системе или программа вроде Handy","Выберите час обычной работы с ИИ и весь этот час не печатайте: только голос","Наговаривайте контекст подробно, как в разговоре с коллегой: кто, зачем, что важно, что уже пробовали","После — запишите ощущения: что было проще, что раздражало, стали ли ответы лучше"],"result":"Три–четыре предложения о том, как это было. В субботу обсудим, кому зашло и почему."},{"id":"ДЗ-8","from":27,"t":"Коннектор к своему Google Диску","was":"На занятии — бриф из папки на Диске и анкета в ту же папку.","steps":["В Claude: `Настроить → Коннекторы` → Google Drive → «Подключить», войдите в аккаунт Google. В ChatGPT — через приложения, вызов через @","Положите на Диск папку с учебным брифом","В новом чате: «Найди на моём Google Диске бриф про ИИ и сделай по нему анкету»","Попросите сохранить анкету в ту же папку. Если коннектор умеет только читать — это тоже результат: вы узнали, где его граница"],"result":"Скриншот: модель нашла файл на Диске. Одна фраза: что коннектор умеет, а чего нет."},{"id":"ДЗ-9","from":31,"t":"Задача, которую ведёте с телефона","was":"На занятии — облачная задача, открытая на телефоне.","how":"Цель — почувствовать, как работа идёт без вас.","steps":["На компьютере запустите длинную задачу: например, глубокое исследование рынка ИИ-ассистентов в России","Отойдите от компьютера и откройте тот же чат или задачу в мобильном приложении Claude или ChatGPT","Посмотрите, как задача идёт, и допишите уточнение с телефона","Если задача в облаке — закройте ноутбук и проверьте, что она дошла до конца. Если на компьютере — не давайте ему уснуть"],"result":"Скриншот с телефона и одна фраза: где работала задача — на компьютере или в облаке — и что было неудобно."},{"id":"ДЗ-10","from":44,"t":"Своя небольшая выгрузка — посчитать без кода и кодом","was":"На занятии — синтетическая выгрузка на 200 строк: один вопрос без кода и с кодом.","prompt":["Посчитай кодом","Объясни этот код"],"steps":["Возьмите небольшую выгрузку из своей работы — без персональных данных — или учебную на 200 строк","Задайте вопрос с точным числовым ответом без кода: данные текстом, выполнение кода выключено","Тот же вопрос с кодом: файл и промпт «Посчитай кодом»","Сравните числа и попросите объяснить код — промпт «Объясни этот код»"],"result":"Два числа рядом и что нашли в коде: как он обошёлся с пропусками и странными значениями."},{"id":"ДЗ-11","from":35,"t":"Скриншот интерфейса — попросить модель найти проблемы","was":"На занятии — один слайд про то, как модель видит картинки.","prompt":"Найди проблемы в интерфейсе","steps":["Сделайте скриншот экрана из своего продукта или любого приложения","Отправьте его в чат с промптом «Найди проблемы в интерфейсе»","Отметьте, какие проблемы правда есть, какие модель выдумала и что пропустила"],"result":"Скриншот и три пометки: верно, выдумано, пропущено."},{"id":"ДЗ-12","from":29,"t":"Свой навык из рабочего чата","was":"На занятии — гайд интервью без навыка и с навыком.","steps":["Найдите чат, где вы долго работали над повторяющейся задачей и поправляли модель","Отправьте в этом чате промпт «Навык из этого чата»","Сохраните навык: Claude предложит добавить его в аккаунт; или скачайте ZIP и загрузите в `Настроить → Навыки`","В новом чате попросите ту же работу и посмотрите, подхватился ли навык"],"result":"Название навыка и одна фраза: стало ли меньше объяснять.","prompt":"Навык из этого чата"}],"bring":["Что нового вы узнали за неделю и как изменилось понимание","Строки в общей таблице сервисов","Находка из экскурсии по своему сервису","Самая странная вещь, которую сделала модель, — и объяснение словами с занятия"]},"promise":["Общую базу: что вообще есть и как это устроено","Понимание, почему контекст решает и как его собирать","Общий словарь и схему","Понимание, какую модель брать под задачу","Знание, где лежат настройки приватности","Понимание, когда модель считает кодом, а когда угадывает"],"nopromise":["Глубокой настройки каждого сервиса","Сборки своих агентов и программ — это неделя 3","Работы в терминале — неделя 3","Разбора политики безопасности конкретной компании"],"weeks":[[1,"Инструментарий","Игорь","Общая база: модели, контекст, режимы, данные; поставленный Claude Code и своя аудиозапись"],[2,"Штаб исследователя","Алёна","Папка исследования, список проектов, дашборд со стадиями"],[3,"Мастерская","Игорь","Своя программа локальной расшифровки и транскрипт в штабе"],[4,"Лаборатория интервью","Алёна","Интервью, разложенное на наблюдения, выводы с привязкой к цитатам"],[5,"Лаборатория опроса","Игорь","Карта данных, распределения, код-фрейм, проверенный кросс"],[6,"Отдел развития","Алёна","Наблюдатель за индустрией, свод правил для проверки документов"]],"rhythm":[["Вт, 20 октября, 18:30–20:00","Занятие, 90 минут"],["Ср — Чт","Начинаете домашку: пробуете на своих задачах"],["Чт, 22 октября, 18:30–20:00","Часы вопросов: что получилось, что не завелось. Что не успели на занятии — разберём здесь"],["Сб, 24 октября, 10:00–11:30","Встреча: что нового узнали и как изменилось понимание"]],"pages":{"promptsLead":"Промпты с занятия. Кнопка копирует текст целиком; подсвеченные места замените своими.","termsLead":"Слова «токен», «контекст», «агент», «MCP», «навык» звучат со всех сторон, но каждый понимает их по-своему. Здесь — как мы понимаем их на курсе.","terms":[["Модель","model","То, что думает: языковая, речевая, графическая. Одна модель живёт в разных продуктах.",[5,7]],["LLM","large language model","Большая языковая модель: нейросеть с миллиардами параметров, которую научили продолжать текст.",[8]],["Веса","weights","Числа внутри модели, подобранные при обучении. В них хранится всё, что модель «знает».",[8,36]],["Продукт","","То, через что вы работаете с моделью: Claude, ChatGPT, Алиса AI — в браузере, на компьютере или в телефоне. Продукт подкладывает модели память и инструкции.",[7,10]],["Режим","","Как вы работаете: чат, проект, агент, кодовый агент, агент в браузере; с компьютера или телефона, текстом или голосом.",[5,32]],["Токен","token","Кусок слова. Всё, что модель видит, и всё, за что вы платите, считается в токенах. Русский текст режется мельче английского.",[8]],["Галлюцинация","hallucination","Уверенный ответ, которого нет ни в ваших данных, ни в мире: цитата, которую не говорили, источник, которого нет, число, которого нет в выгрузке.",[9]],["Окно контекста","context window","Всё, что модель видит прямо сейчас: инструкции сервиса, ваши инструкции и память, файлы, история чата, ваше сообщение и место под ответ. У окна есть край.",[10,12]],["Гниение контекста","context rot","Качество ответа падает по мере того, как окно заполняется, — задолго до его края.",[12]],["Память","memory","Короткие заметки о вас, которые продукт записывает сам и подкладывает модели в каждый новый чат.",[11,41]],["Проект","project","Контекст под одну задачу: материалы и инструкции, которые работают только внутри проекта.",[11,24]],["Сжатие","compact","Когда окно заполнилось, сервис сам упаковывает историю в выжимку и продолжает в том же чате. Детали при этом теряются.",[13]],["Лимит тарифа","","Сколько вы можете отправить за период на своей подписке. Длинный чат съедает его быстрее.",[13,14]],["Входные и выходные токены","input, output","Что вы отправили модели и что она написала в ответ. Выходные стоят в несколько раз дороже.",[15]],["Контекст-инжиниринг","context engineering","Подход, при котором качество ответа решает не формулировка вопроса, а всё, что модель видит вместе с ним.",[16]],["Постановка задачи","","Что сделать, зачем и для кого, что прикладываю, в каком виде результат, чего не делать, пример.",[17]],["Агент","agent","Модель, которой дали руки: сама планирует шаги, действует инструментами, проверяет результат и идёт дальше.",[24,25]],["Агентность","","Шкала, а не переключатель: сколько шагов модель делает сама и к чему у неё доступ.",[25]],["Кодовый агент","coding agent","Агент, который сам пишет и запускает программы в вашей папке: Claude Code, Codex.",[26]],["MCP","Model Context Protocol","Model Context Protocol — открытый стандарт «розетки»: через неё модель берёт контекст из сервисов и действует в них.",[27]],["Коннектор","connector","Конкретный сервис, включённый в розетку: Google Диск, почта, календарь.",[27]],["Навык","skill","Папка с описанием, инструкцией SKILL.md, шаблонами и примерами: ваш способ делать работу, записанный для модели.",[29]],["Задача по расписанию","scheduled task","Модель запускается сама в заданное время.",[30]],["Облачный компьютер","","Компьютер в облаке, на котором агент работает, даже когда ваш ноутбук закрыт.",[31]],["Рассуждающая модель","reasoning model","Модель, которая думает перед ответом. Медленнее и дороже, зато глубже.",[34]],["Мультимодальная модель","multimodal","Модель, которая принимает не только текст, но и картинки, звук или видео.",[35]],["Открытые веса","open weights","Веса модели выложены в открытый доступ: её можно скачать и запустить у себя. У закрытых моделей веса есть только у компании.",[36,42]],["Составная ИИ-система","compound AI system","Система из нескольких моделей и инструментов, где каждая делает свою часть работы.",[37]],["Временный чат","temporary chat","Чат, который не попадает в историю и в память.",[41]],["Локальная модель","local model","Модель, которая работает на вашем компьютере: данные не уходят, но качество ниже.",[42]],["Песочница","sandbox","Отдельный компьютер в облаке, где выполняется код, который написала модель.",[45]]],"materials":{"lead":"Файлы недели, сервисы и инструменты с занятия. Файлы со ссылкой можно скачать сейчас, остальные появятся ближе к занятию.","files":[{"ext":"MD","t":"Учебный бриф: как люди в России пользуются ИИ-сервисами","n":"1,5 страницы — под опрос и под глубинные интервью","url":"files/brif-ii-v-rossii.md"},{"ext":"CSV","t":"Синтетическая выгрузка","n":"200 строк ответов на анкету про ИИ; пригодится и на неделе 5","url":"files/vygruzka-ii-200.csv"},{"ext":"XLSX","t":"Та же выгрузка в Excel","n":"для Excel и Numbers","url":"files/vygruzka-ii-200.xlsx"},{"ext":"PDF","t":"Как ставить задачу ИИ","n":"выжимка гайдов Anthropic и OpenAI — положите в свой проект","url":"files/kak-stavit-zadachu-ii.pdf"},{"ext":"ZIP","t":"Навык «Гайд глубинного интервью по брифу»","n":"папка с SKILL.md","url":"files/navyk-gajd-po-brifu.zip"},{"ext":"MD","t":"Гайд без навыка и с навыком","n":"два результата одного запроса","url":"files/gajd-s-navykom.md"},{"ext":"GS","t":"Общая таблица сравнения","n":"Участник, сервис, модель, режим, что получилось, ipt>
<script>
/* Движок сайта лекции курса «ИИ в исследованиях».
   Данные лекции — window.LECTURE (weeks/nedelya-N.js). Режим сборки — window.SITE_MODE:
   'host' — версия ведущего (таймер, заметки, пульт, короткая версия), 'guest' — версия участника.
   words — «Слова ведущего»: что ведущий говорит на слайде. Видят все — под слайдом; у ведущего то же в заметках как «Что говорю».
   kind: 'probe' — проба на занятии: на слайде плашка «Проба · N мин», на главной — отдельная строка времени.
   Слайды рисуются классами .sl-* из «Фирменный стиль/styles.css». */
(() => {
  'use strict';
  const D = window.LECTURE;
  /* Заметки ведущего лежат в отдельном файле и попадают только в версию ведущего. */
  const HD = window.LECTURE_HOST;
  if (HD) {
    for (const s of D.slides) {
      if (HD.slides && HD.slides[s.n]) Object.assign(s, HD.slides[s.n]);
      if (HD.more && HD.more[s.n]) s.more = (s.more || []).concat(HD.more[s.n]);
    }
    if (HD.prep) D.pages.prep = HD.prep;
  }
  const HOST = window.SITE_MODE === 'host';
  const SHOTS = window.LECTURE_SHOTS || {};
  const FILES = window.LECTURE_FILES || {};
  const fileKey = k => String(k || '').normalize('NFC').toLowerCase().trim();
  const fileOf = f => f.url ? [f.url, f.ext] : (FILES[fileKey(f.file)] || FILES[fileKey(f.t)] || null);
  const app = document.getElementById('app');
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* ---------- хранилище в браузере: только удобства, всё в try/catch ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(D.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(D.id + ':' + k, JSON.stringify(v)); } catch (e) { /* без хранилища — просто не запоминаем */ } }
  };

  /* ---------- текст ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function md(s, ph) {
    let h = esc(s);
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/\[([^\]]+)\]\((#[a-z0-9]+)\)/g, '<a href="$2">$1</a>');
    h = h.replace(/\[([^\]]+)\]\((files\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/\{\{(\d+)(?:\|([^}]+))?\}\}/g, (m, n, t) => `<a href="#s${n}">${t || 'слайд ' + n}</a>`);
    h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    if (ph) h = h.replace(/⟪([^⟫]*)⟫/g, '<mark class="ph">⟪$1⟫</mark>');
    return h;
  }
  const arr = v => v == null ? [] : (Array.isArray(v) ? v : [v]);
  const paras = v => arr(v).map(x => `<p>${md(x)}</p>`).join('');
  const ul = v => `<ul>${arr(v).map(x => `<li>${md(x)}</li>`).join('')}</ul>`;
  const fmtNum = x => String(x).replace('.', ',');
  const fmtMin = m => m < 1 && m > 0 ? `${Math.round(m * 60)} с` : `${fmtNum(m)} мин`;
  const pad = n => String(n).padStart(2, '0');
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const clock = m => { m = Math.floor(m + 1e-6); return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`; };
  const clockS = sec => { const s = Math.max(0, Math.round(sec)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };

  /* ---------- слайды, части, время ---------- */
  const ALL = D.slides;
  const byN = new Map(ALL.map(s => [s.n, s]));
  const partOf = s => D.parts.find(p => p.id === s.part);
  const S = {
    view: 'home', n: 1, face: 0,
    short: HOST ? store.get('short', false) : false,
    notes: HOST ? store.get('notes', false) : false,
    focus: false, toc: false
  };
  const isCut = s => S.short && s.short && s.short.cut;
  const mins = s => (S.short && s.short && s.short.min != null) ? s.short.min : (s.min || 0);
  const active = () => ALL.filter(s => !isCut(s));
  function plan() {
    let t = 0; const at = new Map();
    for (const s of ALL) { at.set(s.n, t); if (!isCut(s)) t += mins(s); }
    return { at, total: t };
  }
  const START = toMin(D.meta.start), END = toMin(D.meta.end);
  const partMin = p => active().filter(s => s.part === p.id).reduce((a, s) => a + mins(s), 0);
  function neighbour(n, dir) {
    let i = ALL.findIndex(s => s.n === n) + dir;
    while (i >= 0 && i < ALL.length) { if (!isCut(ALL[i])) return ALL[i]; i += dir; }
    return null;
  }
  const demoPill = s => (s.demo && s.demo.pill) || 'Показ';
  const kindLabel = (s, face) => face === 1 ? demoPill(s) : ({ title: 'Титул', section: 'Раздел', qs: 'Вопросы', try: 'Домашка', final: 'Вопросы', probe: 'Проба' }[s.kind] || (s.demo ? 'Рассказ и показ' : 'Рассказ'));
  const shortTag = s => s.short && s.short.r ? 'Р4-' + s.short.r : 'короткая версия';
  const R4 = ALL.some(s => s.short && s.short.r);
  const hwFrom = n => [...D.hw.must, ...D.hw.opt].filter(h => arr(h.from).includes(n));

  /* ========== Слайд ========== */
  function metaRow(s) {
    const p = partOf(s);
    const L = s.kind === 'title' ? `${D.meta.org} · ${D.meta.course}` : `${D.meta.course} · Неделя ${D.meta.week}`;
    const R = s.kind === 'title' ? `Неделя ${D.meta.week} из ${D.meta.weeks}` : p.label;
    return `<div class="sl-meta"><span>${esc(L)}</span><span>${esc(R)}</span></div>`;
  }

  function timelineSVG(v) {
    const t0 = Date.UTC(2025, 0, 1), day = 864e5, px = 0.9118;
    const X = iso => { const [y, m, d] = iso.split('-').map(Number); return 150 + px * (Date.UTC(y, m - 1, d || 15) - t0) / day; };
    const names = ['янв', 'апр', 'июл', 'окт'];
    let g = '';
    for (const y of [2025, 2026]) for (let q = 0; q < 4; q++) {
      const x = X(`${y}-${pad(q * 3 + 1)}-01`);
      g += `<line class="grid" x1="${x.toFixed(1)}" y1="16" x2="${x.toFixed(1)}" y2="186"/><text x="${x.toFixed(1)}" y="206" text-anchor="middle">${q === 0 ? 'янв ' + y : names[q]}</text>`;
    }
    g += `<line class="axis" x1="150" y1="186" x2="760" y2="186"/>`;
    v.lanes.forEach((ln, i) => {
      const y = 46 + i * 56;
      g += `<text class="lane-name" x="0" y="${y + 4}">${esc(ln.name)}</text>`;
      let prev = -99, off = false;
      ln.events.forEach(([d, label]) => {
        const x = X(d);
        off = (x - prev < 7) ? !off : false;
        prev = x;
        g += `<circle class="${ln.cls}" cx="${x.toFixed(1)}" cy="${y + (off ? 6 : 0)}" r="5"><title>${esc(d.split('-').reverse().join('.'))} — ${esc(label)}</title></circle>`;
      });
      g += `<text class="count" x="832" y="${y + 5}" text-anchor="end">${esc(ln.count)}</text>`;
    });
    return `<svg class="sl-chart x-svg" viewBox="0 0 832 230" width="832" height="230" role="img" aria-label="${esc(v.aria)}">${g}</svg>`;
  }

  const B = {
    p: v => `<p class="sl-body">${md(v)}</p>`,
    lead: v => `<p class="sl-lead">${md(v)}</p>`,
    label: v => `<span class="x-lbl">${md(v)}</span>`,
    cap: v => `<p class="sl-caption">${md(v)}</p>`,
    list: (v, b) => `<ul class="sl-list${b.sm ? ' sm' : ''}">${v.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ul>`,
    grid: (v, b) => `<div class="sl-grid2${b.cols ? ' c' + b.cols : ''}">${v.map(([h, p]) => `<div class="sl-cell"><h3>${md(h)}</h3>${p ? `<p>${md(p)}</p>` : ''}</div>`).join('')}</div>`,
    cards: (v, b) => `<div class="sl-cards${b.cols && b.cols !== 3 ? ' c' + b.cols : ''}">${v.map(c => `<div class="sl-card">${c[0] ? `<span class="sl-label">${md(c[0])}</span>` : ''}<h3>${md(c[1])}</h3>${c[2] ? `<p>${md(c[2])}</p>` : ''}</div>`).join('')}</div>`,
    compare: v => `<div class="sl-compare${v.length === 3 ? ' c3' : ''}">${v.map(c => `<div class="sl-col${c.accent ? ' is-accent' : ''}"><h3>${md(c.h)}</h3>${c.rows ? `<dl>${c.rows.map(([t, d]) => `<dt>${md(t)}</dt><dd>${md(d)}</dd>`).join('')}</dl>` : ''}${c.list ? `<ul>${c.list.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ul>` : ''}${c.p ? `<p class="sl-small">${md(c.p)}</p>` : ''}${c.frag ? `<div class="frag">${md(c.frag)}</div>` : ''}</div>`).join('')}</div>`,
    table: v => `<div class="x-tablewrap"><table class="sl-table"${v.cw ? '' : ''}><thead><tr>${v.head.map((x, i) => `<th${(v.num || []).includes(i) ? ' class="num"' : ''}${v.cw && v.cw[i] ? ` style="width:${v.cw[i]}"` : ''}>${md(x)}</th>`).join('')}</tr></thead><tbody>${v.rows.map((r, ri) => `<tr${v.mark === ri ? ' class="is-mark"' : ''}>${r.map((x, i) => `<td${(v.num || []).includes(i) ? ' class="num"' : ''}>${md(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
    flow: v => `<div class="x-flow">${v.map((x, i) => (i ? '<span class="ar">→</span>' : '') + `<div class="st${x.sunk ? ' sunk' : ''}">${typeof x === 'string' ? md(x) : `<b>${md(x.h)}</b>${x.p ? `<small>${md(x.p)}</small>` : ''}`}</div>`).join('')}</div>`,
    scheme: v => { const wk = v.layers.some(l => l[2]); const bands = v.bands || []; return `<div class="sl-scheme${wk ? ' wk' : ''}${bands.length ? '' : ' nob'}"><div class="sl-layers">${v.layers.map(([h, p, w]) => `<div class="sl-layer${wk ? ' wk' : ''}"><h3>${md(h)}</h3><p>${md(p)}</p>${wk ? `<span class="x-week">${md(w || '')}</span>` : ''}</div>`).join('')}</div>${bands.length ? `<div class="sl-through">${bands.map(([t, c]) => `<div class="sl-band ${c}">${esc(t)}</div>`).join('')}</div>` : ''}</div>`; },
    window: v => `<div class="x-stack" style="gap:10px"><div class="x-brace">${esc(v.label)}</div><div class="x-window">${v.items.map(([t, sub, cls, f]) => `<div style="flex:${f || 1}"><div class="bx ${cls || ''}"></div><div class="t">${md(t)}${sub ? `<small>${md(sub)}</small>` : ''}</div></div>`).join('')}</div></div>`,
    tokens: v => `<div class="x-tokens">${v.map(l => `<div class="line"><span class="sl-label">${esc(l.lang)}</span><div class="seq">${l.toks.map(t => `<span class="tk">${esc(t)}</span>`).join('')}</div><div class="cnt">${l.toks.length}<small>токенов</small></div></div>`).join('')}</div>`,
    next: v => `<div class="x-next"><div class="q">${md(v.q)} <i></i></div>${v.opts.map(([w, p], i) => `<div class="opt${i === 0 ? ' top' : ''}"><span>${esc(w)}</span><div class="b"><i style="width:${p}%"></i></div><span>${p ? p + '%' : '…'}</span></div>`).join('')}</div>`,
    snow: v => `<div class="x-snow">${v.map((lbl, i) => `<div class="r">${Array.from({ length: i + 1 }, (_, j) => `<i class="${j === i ? 'new' : ''}"></i>`).join('')}<span>${md(lbl)}</span></div>`).join('')}</div>`,
    scale: v => `<div class="x-scale${v.length === 3 ? ' c3' : ''}">${v.map(s => `<div class="s"><h3>${md(s.h)}</h3>${s.p ? `<p>${md(s.p)}</p>` : ''}${s.rows ? `<dl>${s.rows.map(([t, d]) => `<dt>${md(t)}</dt><dd>${md(d)}</dd>`).join('')}</dl>` : ''}</div>`).join('')}</div>`,
    axis: v => `<div class="x-axis"><span>${md(v[0])}</span><span>${md(v[1])}</span></div>`,
    timeline: v => timelineSVG(v),
    qs: (v, b) => `<ol class="sl-qs${b.one ? ' one' : ''}${b.cols2 ? ' c2' : ''}">${v.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ol>`,
    try: v => `<dl class="sl-try">${v.map(([t, d]) => `<dt>${md(t)}</dt><dd>${Array.isArray(d) ? `<ol>${d.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ol>` : md(d)}</dd>`).join('')}</dl>`,
    steps: v => `<ol class="sl-steps">${v.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ol>`,
    shots: (v, b) => `<div class="x-shots" style="grid-template-columns:repeat(${b.cols || v.length},1fr)">${v.map(x => shotHTML(x, b.wide)).join('')}</div>`,
    fig: v => `<div class="x-fig"><b>${md(v[0])}</b><span>${md(v[1])}</span></div>`,
    dates: v => `<div class="x-dates">${v.map(d => `<div${d.accent ? ' class="is-accent"' : ''}><b>${md(d.h)}</b><span>${md(d.p)}</span></div>`).join('')}</div>`,
    row: (v, b) => `<div class="x-row"${b.w ? ` style="grid-template-columns:${b.w}"` : ''}>${v.map(col => `<div class="x-stack"${b.g ? ` style="gap:${b.g}px"` : ''}>${arr(col).map(block).join('')}</div>`).join('')}</div>`
  };
  function block(b) { const k = Object.keys(b).find(k => B[k]); return k ? B[k](b[k], b) : ''; }
  function shotHTML(x, wide) {
    const src = SHOTS[x.file];
    return `<figure class="x-shot${wide ? ' wide' : ''}" style="margin:0">${src ? `<img src="${src}" alt="${esc(x.name)}" data-zoom="${esc(x.name)}">` : `<div class="ph">скриншот: ${esc(x.file)}</div>`}${x.nocap ? '' : `<figcaption class="cap">${md(x.name)}</figcaption>`}</figure>`;
  }

  function demoSlide(s) {
    const d = s.demo;
    return `<div class="sl" style="gap:${d.gap || 24}px">${metaRow(s)}<span class="sl-pill">${esc(demoPill(s))}</span><div class="sl-head"><h2 class="sl-title">${md(d.t)}</h2>${d.see ? `<p class="sl-lead">${md(d.see)}</p>` : ''}</div><ol class="sl-steps">${d.steps.map(x => `<li><span>${md(x)}</span></li>`).join('')}</ol>${d.you ? `<div class="sl-callout"><span class="sl-label">${esc(d.youL || 'Теперь вы')}</span><span>${md(d.you)}</span></div>` : ''}${d.take !== undefined ? (d.take ? `<p class="sl-take">${md(d.take)}</p>` : '') : (s.take ? `<p class="sl-take">${md(s.take)}</p>` : '')}</div>`;
  }
  function slideHTML(s, face = 0) {
    if (face === 1 && s.demo) return demoSlide(s);
    const p = partOf(s);
    if (s.kind === 'title' || s.kind === 'final') return `<div class="sl">${metaRow(s)}<div class="sl-head" style="margin-top:auto"><h1 class="sl-display">${md(s.t)}</h1>${s.lead ? `<p class="sl-lead">${md(s.lead)}</p>` : ''}</div><p class="sl-take sl-small" style="font-family:var(--font-sans);margin-top:var(--space-5)">${md(s.foot)}</p></div>`;
    if (s.kind === 'section') return `<div class="sl sl-dark">${metaRow(s)}<div class="x-sec" style="display:flex;gap:var(--space-5);align-items:flex-end;margin-top:auto">${p.num != null && !s.nonum ? `<div class="sl-partnum">${p.num}</div>` : ''}<div class="sl-head" style="padding-bottom:12px"><h2 class="sl-title">${md(s.t)}</h2><p class="sl-lead">${md(s.lead)}${S.short && s.short && s.short.note ? ' ' + md(s.short.note) : ''}</p></div></div></div>`;
    let h = `<div class="sl"${s.gap ? ` style="gap:${s.gap}px"` : ''}>${metaRow(s)}`;
    if (s.kind === 'probe') h += `<span class="sl-pill probe">Проба · ${esc(fmtMin(mins(s)))}</span>`;
    h += `<div class="sl-head"><h2 class="sl-title"${s.tw ? ` style="max-width:${s.tw}px"` : ''}>${md(s.t)}</h2>${s.lead ? `<p class="sl-lead"${s.lw ? ` style="max-width:${s.lw}px"` : ''}>${md(s.lead)}</p>` : ''}</div>`;
    for (const b of s.body || []) h += block(b);
    for (const c of arr(s.cap)) h += `<p class="sl-caption">${md(c)}</p>`;
    if (S.short && s.short && s.short.note) h += `<p class="sl-caption short-note">${md(s.short.note)}</p>`;
    if (s.co) h += `<div class="sl-callout"><span class="sl-label">${esc(s.co.l)}</span><span>${md(s.co.t)}</span></div>`;
    if (s.take) h += `<p class="sl-take">${md(s.take)}</p>`;
    return h + '</div>';
  }

  /* ---------- вписать слайд 960×540 в контейнер ---------- */
  function fitSlide() {
    const st = $('#stage'), f = $('#fit');
    if (!st || !f) return;
    const sl = f.firstElementChild;
    const focus = document.body.classList.contains('focus');
    if (window.innerWidth < 720 && !focus) {
      st.classList.add('reflow'); f.style.width = f.style.height = ''; sl.style.transform = '';
      document.documentElement.style.setProperty('--slide-x', '0px');
      return;
    }
    st.classList.remove('reflow');
    const cs = getComputedStyle(st);
    const padL = parseFloat(cs.paddingLeft), padR = parseFloat(cs.paddingRight);
    const availW = st.clientWidth - padL - padR;
    const tb = focus ? 0 : ($('.tb') ? $('.tb').offsetHeight : 0);
    const ft = focus ? 0 : ($('.ft') ? $('.ft').offsetHeight : 0);
    const availH = window.innerHeight - tb - ft - (focus ? 0 : 32);
    const k = Math.max(0.25, Math.min(availW / 960, availH / 540));
    f.style.width = (960 * k) + 'px'; f.style.height = (540 * k) + 'px';
    sl.style.transform = `scale(${k})`;
    const x = f.getBoundingClientRect().left - st.getBoundingClientRect().left - padL;
    document.documentElement.style.setProperty('--slide-x', Math.max(0, x) + 'px');
  }
  function fitInto(box, maxW, maxH) {
    if (!box) return;
    const sl = box.firstElementChild;
    const k = Math.min(maxW / 960, maxH / 540);
    box.style.width = (960 * k) + 'px'; box.style.height = (540 * k) + 'px';
    sl.style.transform = `scale(${k})`;
  }

  /* ========== Таймер слайда ========== */
  const T = {
    total: 0, left: 0, run: false, last: 0,
    reset(sec, auto) { this.total = sec; this.left = sec; this.run = !!auto; this.last = performance.now(); draw(); },
    toggle() { this.run = !this.run; this.last = performance.now(); draw(); },
    tick() { if (!this.run) return; const now = performance.now(); this.left -= (now - this.last) / 1000; this.last = now; }
  };
  function timerState() {
    const over = T.left < 0;
    return { txt: (over ? '+' : '') + clockS(Math.abs(T.left)), cls: over ? 'over' : (T.left <= 60 && T.total > 60 ? 'warn' : '') };
  }
  function lectureClock(s) {
    const st = store.get('start', null);
    const now = new Date();
    let base;
    if (st) base = new Date(st);
    else { base = new Date(now); base.setHours(Math.floor(START / 60), START % 60, 0, 0); }
    const p = plan();
    const planned = new Date(base.getTime() + (p.at.get(s.n) || 0) * 60000);
    const delta = (now - planned) / 60000;
    const live = Math.abs((now - base) / 60000) < 240;
    const nowS = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const plS = `${pad(planned.getHours())}:${pad(planned.getMinutes())}`;
    let dl = '';
    if (live) dl = Math.abs(delta) < 1 ? ' · по плану' : (delta > 0 ? ` · <span class="late">отстаём на ${Math.round(delta)} мин</span>` : ` · опережаем на ${Math.round(-delta)} мин`);
    return `Сейчас <b>${nowS}</b> · слайд по плану с <b>${plS}</b>${dl}`;
  }
  function draw() {
    const t = timerState();
    $$('[data-tm]').forEach(el => { el.textContent = t.txt; });
    $$('.tm, .pult-big').forEach(el => { el.classList.toggle('warn', t.cls === 'warn'); el.classList.toggle('over', t.cls === 'over'); });
    $$('[data-tm-play]').forEach(el => { el.textContent = T.run ? '❚❚' : '▶'; el.setAttribute('aria-label', T.run ? 'Пауза' : 'Старт'); });
    const share = T.total > 0 ? Math.min(1, Math.max(0, (T.total - T.left) / T.total)) : 0;
    $$('[data-tm-line]').forEach(el => { el.style.width = (share * 100).toFixed(2) + '%'; el.parentNode.classList.toggle('warn', t.cls === 'warn'); el.parentNode.classList.toggle('over', t.cls === 'over'); el.parentNode.classList.toggle('paused', !T.run); });
    const s = byN.get(S.n);
    if (s) $$('[data-clock]').forEach(el => { el.innerHTML = lectureClock(s); });
  }
  setInterval(() => { T.tick(); draw(); }, 250);
  function slideSeconds(s) {
    if (s.kind === 'final') { const p = plan(); return Math.max(0, (END - START - p.total)) * 60; }
    return mins(s) * 60;
  }

  /* ========== Оболочка: верх и низ ========== */
  const btn = (act, label, key, extra = '') => `<button class="btn" data-act="${act}" title="${esc(label)}${key ? ' (' + key + ')' : ''}" ${extra}><span class="lbl">${esc(label)}</span>${key ? `<kbd>${key}</kbd>` : ''}</button>`;
  const themeBtn = () => `<button class="btn" data-act="theme" aria-label="Сменить тему" title="Светлая или тёмная тема" style="padding:0 10px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>`;
  const homeLink = () => `<a class="tb-home" href="#home"><span class="long">${esc(D.meta.course)} · </span>Неделя ${D.meta.week}</a>`;

  function topbarSlide(s, face) {
    const p = partOf(s);
    const sec = ALL.find(x => x.part === p.id && x.kind === 'section');
    const timer = HOST ? `<div class="tm" role="timer"><span class="caps">${s.kind === 'final' ? 'на вопросы' : 'план ' + fmtMin(mins(s))}</span><b class="tm-v" data-tm>0:00</b><button data-act="tm-play" data-tm-play aria-label="Старт">▶</button><button data-act="tm-reset" aria-label="Сначала">↺</button></div>` : '';
    const show = s.demo ? `<button class="btn btn-show" data-act="face" aria-pressed="${face === 1}" title="Показ (D)"><b>Показ</b><kbd>D</kbd></button>` : '';
    return `<header class="tb gut"><div class="tb-left">${homeLink()}<span class="tb-sep"></span><span class="tb-kind">${kindLabel(s, face)}</span><a class="tb-part" href="#s${sec ? sec.n : s.n}">${esc(p.label)}${p.num ? ' · ' + esc(p.title) : ''}</a><span class="tb-sep s2"></span><span class="tb-num">Слайд ${s.n}</span></div><div class="tb-right">${show}${timer}${btn('toc', 'Содержание', 'M')}${themeBtn()}${HOST ? btn('notes', 'Заметки', 'N', `aria-pressed="${S.notes}"`) : ''}${btn('focus', 'Фокус', 'F')}</div></header>`;
  }
  function footerSlide(s, face) {
    const list = active();
    const i = list.findIndex(x => x.n === s.n);
    const pos = i >= 0 ? i + 1 : '—';
    let nextTxt = '';
    if (s.demo && face === 0) nextTxt = `Дальше — ${demoPill(s).toLowerCase()}: ${s.demo.t}`;
    else { const nx = neighbour(s.n, 1); nextTxt = nx ? `Дальше — ${nx.n}. ${nx.t}` : 'Это последний слайд'; }
