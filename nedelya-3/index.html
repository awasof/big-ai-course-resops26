/* Стиль курса «ИИ в исследованиях» — цвета и шаблоны слайдов. Значения из tokens.json. */
:root {
  --surface: #faf9f5;
  --surface-sunk: #f0eee6;
  --line: #e8e6dc;
  --ink: #141413;
  --ink-muted: #5e5d59;
  --ink-faint: #b0aea5;
  --clay: #d0694a;
  --clay-text: #a04629;
  --clay-soft: #f6e3da;
  --on-clay: #141413;
  --slab: #141413;
  --on-slab: #faf9f5;
  --on-slab-muted: #b0aea5;
  --sky: #5689bf;
  --sage: #728756;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --space-7: 64px;
  --radius-sm: 4px;
  --radius-md: 12px;
  --radius-full: 9999px;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sans: "Golos Text", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1a1918;
    --surface-sunk: #262523;
    --line: #3a3936;
    --ink: #f5f4ef;
    --ink-muted: #b0aea5;
    --ink-faint: #5e5d59;
    --clay: #d97757;
    --clay-text: #e3906f;
    --clay-soft: #3b2419;
    --on-clay: #141413;
    --slab: #262523;
    --on-slab: #faf9f5;
    --on-slab-muted: #b0aea5;
    --sky: #7fa9d6;
    --sage: #93a878;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #1a1918;
  --surface-sunk: #262523;
  --line: #3a3936;
  --ink: #f5f4ef;
  --ink-muted: #b0aea5;
  --ink-faint: #5e5d59;
  --clay: #d97757;
  --clay-text: #e3906f;
  --clay-soft: #3b2419;
  --on-clay: #141413;
  --slab: #262523;
  --on-slab: #faf9f5;
  --on-slab-muted: #b0aea5;
  --sky: #7fa9d6;
  --sage: #93a878;
  color-scheme: dark;
}


/* Слайд 960×540. Всё — из токенов; для 1920×1080 масштаб ×2. */
html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-sans); }

.sl { box-sizing: border-box; width: 960px; height: 540px; padding: var(--space-6) var(--space-7); background: var(--surface); color: var(--ink); display: flex; flex-direction: column; gap: var(--space-5); position: relative; overflow: hidden; font-family: var(--font-sans); }
.sl *, .sl *::before, .sl *::after { box-sizing: border-box; }
:where(.sl) :where(p, h1, h2, h3, ul, ol, dl, dd) { margin: 0; }

/* верхняя строка: курс слева, неделя и часть справа */
.sl-meta { display: flex; justify-content: space-between; gap: var(--space-4); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.sl-label { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

.sl-head { display: flex; flex-direction: column; gap: var(--space-3); }
.sl-display { font-family: var(--font-serif); font-size: 56px; line-height: 60px; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
.sl-title { font-family: var(--font-serif); font-size: 36px; line-height: 42px; font-weight: 500; letter-spacing: -.005em; text-wrap: balance; max-width: 760px; }
.sl-lead { font-size: 20px; line-height: 28px; color: var(--ink-muted); max-width: 640px; text-wrap: pretty; }
.sl-body { font-size: 16px; line-height: 24px; max-width: 640px; }
.sl-small { font-size: 14px; line-height: 20px; }
.sl-muted { color: var(--ink-muted); }
.sl-code { font-family: var(--font-mono); font-size: 14px; line-height: 20px; }
.sl-caption { font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* вывод внизу слайда */
.sl-take { margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--line); font-family: var(--font-serif); font-size: 18px; line-height: 26px; max-width: 760px; text-wrap: pretty; }

/* тёмный слайд-раздел */
.sl-dark { background: var(--slab); color: var(--on-slab); }
.sl-dark .sl-meta, .sl-dark .sl-label, .sl-dark .sl-lead { color: var(--on-slab-muted); }
.sl-dark .sl-take { border-top-color: var(--on-slab-muted); }
.sl-partnum { font-family: var(--font-serif); font-size: 120px; line-height: 1; font-weight: 400; color: var(--clay); }

/* сетка 2×2 */
.sl-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
.sl-cell { display: flex; flex-direction: column; gap: var(--space-1); padding-top: var(--space-2); border-top: 1px solid var(--line); min-width: 0; }
.sl-cell h3, .sl-card h3, .sl-col h3 { font-family: var(--font-serif); font-size: 20px; line-height: 26px; font-weight: 500; }
.sl-cell p { font-size: 14px; line-height: 20px; color: var(--ink-muted); }

/* карточки */
.sl-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
.sl-cards.c4 { grid-template-columns: repeat(4, 1fr); }
.sl-card { background: var(--surface-sunk); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.sl-card p { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.sl-card .sl-label { color: var(--ink-muted); }

/* сравнение колонок */
.sl-compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
.sl-compare.c3 { grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.sl-col { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-3); border-top: 2px solid var(--ink); min-width: 0; }
.sl-col.is-accent { border-top-color: var(--clay); }
.sl-col dl { display: flex; flex-direction: column; gap: var(--space-2); }
.sl-col dt { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.sl-col dd { font-size: 14px; line-height: 20px; }

/* таблица */
.sl-table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.sl-table th { text-align: left; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 0 var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
.sl-table td { padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.sl-table td.num, .sl-table th.num { text-align: right; }
.sl-table tr.is-mark td { background: var(--clay-soft); }

/* плашка «ПОКАЗ» */
.sl-pill { display: inline-flex; align-items: center; gap: var(--space-2); align-self: flex-start; height: 28px; padding: 0 14px; border-radius: var(--radius-full); background: var(--clay); color: var(--on-clay); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.sl-pill::before { content: ""; width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.sl-steps { display: flex; flex-direction: column; gap: var(--space-2); counter-reset: st; max-width: 720px; }
.sl-steps li { list-style: none; display: grid; grid-template-columns: 32px 1fr; font-size: 16px; line-height: 24px; counter-increment: st; }
.sl-steps li::before { content: counter(st); font-family: var(--font-serif); color: var(--ink-muted); }

/* плашка-ловушка */
.sl-callout { background: var(--clay-soft); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: 14px; line-height: 20px; color: var(--ink); max-width: 760px; display: flex; flex-direction: column; gap: var(--space-1); }
.sl-callout .sl-label { color: var(--clay-text); }

/* домашка: метка слева, текст справа */
.sl-try { display: grid; grid-template-columns: 140px 1fr; gap: var(--space-3) var(--space-5); align-items: baseline; }
.sl-try dt { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.sl-try dd { font-size: 14px; line-height: 20px; }
.sl-try ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }

/* вопросы */
.sl-qs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--space-6); counter-reset: q; }
.sl-qs li { list-style: none; display: grid; grid-template-columns: 32px 1fr; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); font-family: var(--font-serif); font-size: 18px; line-height: 24px; counter-increment: q; }
.sl-qs li::before { content: counter(q); font-family: var(--font-sans); font-size: 12px; line-height: 24px; color: var(--ink-muted); }

/* схема слоёв */
.sl-scheme { display: grid; grid-template-columns: 1fr 120px; gap: var(--space-3); }
.sl-layers { display: flex; flex-direction: column; }
.sl-layer { display: grid; grid-template-columns: 200px 1fr; gap: var(--space-4); padding: var(--space-2) 0; border-top: 1px solid var(--line); align-items: baseline; }
.sl-layer:first-child { border-top-color: var(--ink); }
.sl-layer h3 { font-family: var(--font-serif); font-size: 20px; line-height: 26px; font-weight: 500; }
.sl-layer p { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.sl-through { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.sl-band { border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.sl-band.ctx { background: var(--clay); color: var(--on-clay); }
.sl-band.data { background: var(--surface-sunk); color: var(--ink); }

/* график-таймлайн */
.sl-chart text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink-muted); }
.sl-chart .lane-name { font-size: 13px; fill: var(--ink); font-weight: 500; }
.sl-chart .grid { stroke: var(--line); stroke-width: 1; }
.sl-chart .axis { stroke: var(--ink); stroke-width: 1; }
.sl-chart .a { fill: var(--clay); }
.sl-chart .b { fill: var(--sky); }
.sl-chart .c { fill: var(--sage); }
.sl-chart .count { font-family: var(--font-serif); font-size: 15px; fill: var(--ink); }


/* Сайт лекции курса «ИИ в исследованиях» — оболочка вокруг слайдов.
   Слайды рисуются классами .sl-* из «Фирменный стиль/styles.css»; здесь — только оболочка,
   дополнительные блоки слайдов и раскладка для телефона. Все цвета — токены из styles.css. */

:root {
  --tb-h: 56px;
  --ft-h: 64px;
  --gut: 16px;
  --notes-w: 420px;
  --slide-x: 0px;
}
@media (min-width: 720px) { :root { --gut: 32px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--tb-h) + 16px); }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; }
a { color: inherit; text-decoration-color: var(--ink-faint); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--font-mono); font-size: .875em; }
.caps { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.muted { color: var(--ink-muted); }
.gut { padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Кнопки ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); font-size: 14px; line-height: 20px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink-muted); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn kbd, .kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: var(--radius-sm); background: var(--surface-sunk); color: var(--ink-muted); }
.btn[aria-pressed="true"] kbd { background: transparent; color: inherit; opacity: .7; }
.btn-main { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-main:hover { border-color: var(--ink); opacity: .9; }
.btn-big { height: 52px; padding: 0 24px; font-size: 18px; }
.btn-show { background: var(--clay-soft); border-color: transparent; color: var(--ink); }
.btn-show b { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--clay-text); }
.btn-show[aria-pressed="true"] { background: var(--clay); color: var(--on-clay); }
.btn-show[aria-pressed="true"] b { color: var(--on-clay); }
@media (max-width: 1180px) { .btn .lbl { display: none; } }
@media (max-width: 1640px) { body.notes-open .btn .lbl, body.notes-open .tb-part, body.notes-open .tb-sep.s2, body.notes-open .tb-home .long { display: none; } }
/* Кнопка заметок ведущего подписана всегда, пока панель закрыта: на узком экране одна буква N незаметна */
@media (min-width: 560px) { body:not(.notes-open) .btn[data-act="notes"] .lbl { display: inline; } }

/* ---------- Верхняя строка ---------- */
.tb { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--tb-h); display: flex; align-items: center; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.tb-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; overflow: hidden; }
.tb-left > * { flex: none; }
.tb-home { font-family: var(--font-serif); font-size: 17px; line-height: 24px; text-decoration: none; white-space: nowrap; }
.tb-sep { width: 1px; height: 20px; background: var(--line); }
.tb-kind { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.tb-part { font-size: 14px; color: var(--ink-muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto !important; min-width: 0; }
.tb-num { font-size: 14px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tb-right { display: flex; align-items: center; gap: 8px; flex: none; }
.tb-nav { display: flex; gap: 16px; flex-wrap: nowrap; font-size: 14px; flex: 0 1 auto !important; min-width: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.tb-nav::-webkit-scrollbar { display: none; }
.tb-nav a { text-decoration: none; color: var(--ink-muted); }
.tb-nav a:hover, .tb-nav a[aria-current="page"] { color: var(--ink); }
@media (max-width: 900px) { .tb-part, .tb-sep.s2 { display: none; } }
@media (max-width: 719px) { .tb-home .long { display: none; } .tb-kind { display: none; } }

/* таймер */
.tm { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 14px; border: 1px solid var(--line); border-radius: var(--radius-full); }
.tm .caps { white-space: nowrap; }
.tm-v { font-family: var(--font-mono); font-size: 15px; line-height: 20px; min-width: 5ch; text-align: right; font-variant-numeric: tabular-nums; }
.tm.warn .tm-v, .tm.over .tm-v { color: var(--clay-text); }
.tm button { width: 28px; height: 28px; border: 0; border-radius: var(--radius-full); background: var(--surface-sunk); font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.tm button:hover { background: var(--line); }
@media (max-width: 719px) { .tm .caps { display: none; } }

/* ---------- Сцена со слайдом ---------- */
.stage { display: flex; justify-content: center; align-items: flex-start; padding-top: 16px; padding-bottom: 16px; }
.fit { position: relative; flex: none; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.fit > .sl { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.fit.is-dark { border-color: var(--slab); background: var(--slab); }
.cut-flag { position: absolute; top: 12px; right: 12px; z-index: 2; }

/* фокус: только слайд */
body.focus .tb, body.focus .ft, body.focus .details, body.focus .notes { display: none !important; }
body.focus .stage { padding: 0; height: 100vh; align-items: center; }
body.focus .fit { border: 0; border-radius: 0; }
body.focus.dark-slide { background: var(--slab); }

/* телефон: слайд без масштаба, в одну колонку */
.stage.reflow { display: block; padding-top: 12px; }
.stage.reflow .fit { width: auto !important; height: auto !important; }
.stage.reflow .sl { position: static; transform: none !important; width: 100%; height: auto; min-height: 0; padding: 24px 20px 28px; gap: 20px; }
.stage.reflow .sl-display { font-size: 40px; line-height: 44px; }
.stage.reflow .sl-title { font-size: 26px; line-height: 32px; }
.stage.reflow .sl-lead { font-size: 17px; line-height: 24px; }
.stage.reflow .sl-partnum { font-size: 72px; }
.stage.reflow .sl-take { font-size: 17px; line-height: 24px; margin-top: 8px; }
.stage.reflow .sl-grid2, .stage.reflow .sl-cards, .stage.reflow .sl-compare, .stage.reflow .sl-qs, .stage.reflow .x-row, .stage.reflow .x-shots, .stage.reflow .x-scale, .stage.reflow .x-dates { grid-template-columns: 1fr !important; }
.stage.reflow .sl-try { grid-template-columns: 1fr; gap: 4px; }
.stage.reflow .sl-try dd { margin-bottom: 12px; }
.stage.reflow .sl-scheme { grid-template-columns: 1fr; }
.stage.reflow .sl-layer { grid-template-columns: 1fr; gap: 2px; }
.stage.reflow .sl-through { grid-template-columns: 1fr 1fr; }
.stage.reflow .sl-band { writing-mode: horizontal-tb; transform: none; padding: 8px; }
.stage.reflow .x-tablewrap { overflow-x: auto; }
.stage.reflow .x-tablewrap .sl-table { min-width: 560px; }
.stage.reflow .sl-chart, .stage.reflow .x-svg { width: 100%; height: auto; }
.stage.reflow .x-flow { flex-wrap: wrap; }
.stage.reflow .x-sec { flex-direction: column; align-items: flex-start !important; gap: 8px !important; }
.stage.reflow .x-tokens .tk { font-size: 15px; }
.stage.reflow .x-window { flex-direction: column; }
.stage.reflow .x-window > div { flex: none !important; }

/* ---------- Нижняя строка ---------- */
.ft { position: sticky; bottom: 0; z-index: 20; height: calc(var(--ft-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); display: flex; align-items: center; gap: 16px; background: var(--surface); border-top: 1px solid var(--line); }
.ft-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ft-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.ft-row .next { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ft-row .keys { white-space: nowrap; font-family: var(--font-mono); font-size: 11px; }
.bar { position: relative; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px; }
@media (max-width: 900px) { .ft-row .keys { display: none; } }
@media (max-width: 560px) { .ft .btn .lbl2 { display: none; } }

/* ---------- Подробности под слайдом ---------- */
.details { display: flex; flex-direction: column; gap: 48px; padding-top: 40px; padding-bottom: 96px; }
.details-in { width: 100%; max-width: 760px; margin-left: var(--slide-x); display: flex; flex-direction: column; gap: 48px; }
@media (max-width: 719px) { .details-in { margin-left: 0; } .details { padding-top: 24px; } }
.dstrip { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 6px 12px; border-radius: 14px; background: var(--surface-sunk); font-size: 13px; line-height: 16px; text-decoration: none; max-width: 100%; }
a.chip:hover { background: var(--line); }
.chip b { font-weight: 600; }
.chip.clay { background: var(--clay-soft); }
.dsec { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: calc(var(--tb-h) + 16px); }
.dsec > h2 { margin: 0; display: flex; align-items: baseline; gap: 14px; font-family: var(--font-serif); font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: -.005em; text-wrap: balance; }
.dsec > h2 .lt { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); letter-spacing: .08em; min-width: 12px; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose ul, .prose ol { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.prose li::marker { color: var(--ink-muted); }
.prose h3 { margin: 8px 0 0; font-family: var(--font-serif); font-size: 19px; line-height: 26px; font-weight: 500; }
.lead { font-size: 19px; line-height: 28px; color: var(--ink-muted); max-width: 64ch; margin: 0; }
.ol-steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.ol-steps li { counter-increment: st; display: grid; grid-template-columns: 32px 1fr; }
.ol-steps li::before { content: counter(st, decimal-leading-zero); font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); line-height: 24px; }

/* ссылки */
.links { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.links li { border-bottom: 1px solid var(--line); }
.links a, .links .nolink { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0; text-decoration: none; }
.links a:hover .t { text-decoration: underline; text-decoration-color: var(--ink-muted); text-underline-offset: 3px; }
.links .t { font-size: 16px; line-height: 22px; }
.links .n { grid-column: 1; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.links .go { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 14px; color: var(--ink-muted); }
.links .nolink { color: var(--ink-muted); }
.links .nolink .go { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--clay-text); }

/* врезки */
.cos { display: flex; flex-direction: column; gap: 8px; }
.co { border-radius: var(--radius-md); background: var(--surface-sunk); }
.co > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: baseline; padding: 14px 18px; }
.co > summary::-webkit-details-marker { display: none; }
.co > summary::after { content: "+"; font-family: var(--font-mono); color: var(--ink-muted); }
.co[open] > summary::after { content: "−"; }
.co .co-l { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.co.trap .co-l { color: var(--clay-text); }
.co .co-t { font-family: var(--font-serif); font-size: 18px; line-height: 24px; }
.co .co-b { padding: 0 18px 18px calc(150px + 30px); display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 23px; }
.co .co-b p { margin: 0; }
.co .src { font-size: 13px; color: var(--ink-muted); }
@media (max-width: 719px) {
  .co > summary { grid-template-columns: 1fr auto; }
  .co .co-l { grid-column: 1 / -1; }
  .co .co-b { padding-left: 18px; }
}

/* промпт */
.prompt { border-radius: var(--radius-md); background: var(--surface-sunk); overflow: hidden; }
.prompt-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.prompt-h .nm { font-size: 14px; font-weight: 500; }
.prompt pre { margin: 0; padding: 16px 18px; font-family: var(--font-mono); font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; }
.prompt .hint { padding: 0 18px 14px; font-size: 13px; color: var(--ink-muted); }
mark.ph { background: var(--clay-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }

/* файлы */
.files { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 720px) { .files.two { grid-template-columns: 1fr 1fr; } }
.file { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); text-decoration: none; min-width: 0; }
.file .ext { height: 40px; border-radius: var(--radius-sm); background: var(--surface-sunk); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink-muted); }
.file .t { font-size: 15px; line-height: 20px; }
.file .n { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.file.soon { border-style: dashed; }
.file.soon .n::after { content: " · появится ближе к занятию"; }
a.file:hover { border-color: var(--ink-muted); }

/* таблица в подробностях */
.tw { overflow-x: auto; }
.dt { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.dt th { text-align: left; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
.dt td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.dt td.c { text-align: center; }
.dt tr.is-mark td { background: var(--clay-soft); }

/* домашка: карточка и чек-лист */
.hw { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius-md); }
.hw-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hw h3 { margin: 0; font-family: var(--font-serif); font-size: 21px; line-height: 28px; font-weight: 500; text-wrap: balance; }
.hw .was { font-size: 14px; line-height: 21px; color: var(--ink-muted); margin: 0; }
.hw-sub { display: flex; flex-direction: column; gap: 8px; }
.hw-sub .ol-steps li { font-size: 15px; line-height: 23px; }
.check { display: flex; flex-direction: column; gap: 6px; }
.check-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.check-h .cnt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
.check label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 22px; cursor: pointer; }
.check input { appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 18px; height: 18px; border: 1.5px solid var(--ink-muted); border-radius: 4px; display: grid; place-content: center; background: var(--surface); cursor: pointer; }
.check input::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.check input:checked { background: var(--ink); border-color: var(--ink); }
.check input:checked::after { opacity: 1; }
.check input:checked + span { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.retry { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 14px; line-height: 21px; }
.retry .caps { color: var(--ink-muted); }

/* ---------- Страницы: главная и служебные ---------- */
.page { padding-top: 40px; padding-bottom: 96px; }
.page-in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
.page-h { display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
.page-h h1 { margin: 0; font-family: var(--font-serif); font-size: clamp(36px, 5vw, 56px); line-height: 1.08; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }
.block { display: flex; flex-direction: column; gap: 18px; }
.block > h2 { margin: 0; font-family: var(--font-serif); font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -.005em; }
.block > .sub { margin: -8px 0 0; color: var(--ink-muted); font-size: 15px; }
.two { display: grid; grid-template-columns: 1fr; gap: 24px 48px; }
@media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }
.col-h { margin: 0 0 8px; padding-top: 12px; border-top: 2px solid var(--ink); font-family: var(--font-serif); font-size: 20px; line-height: 26px; font-weight: 500; }

.hero { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hero h1 { margin: 0; font-family: var(--font-serif); font-size: clamp(40px, 10.5vw, 120px); line-height: .95; font-weight: 500; letter-spacing: -.02em; }
.hero .lead { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.35; max-width: 34ch; }
.hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.idea { margin: 0; max-width: 46ch; font-family: var(--font-serif); font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; text-wrap: pretty; }
.note { display: flex; flex-direction: column; gap: 6px; padding: 18px 22px; border-radius: var(--radius-md); background: var(--surface-sunk); max-width: 760px; }
.note p { margin: 0; }

/* карта занятия */
.map { display: flex; flex-direction: column; gap: 14px; }
.map-strip { display: flex; height: 44px; border-radius: var(--radius-sm); overflow: hidden; gap: 2px; }
.map-strip a { position: relative; display: flex; align-items: center; padding: 0 10px; background: var(--surface-sunk); text-decoration: none; font-size: 12px; line-height: 16px; color: var(--ink-muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.map-strip a:hover { background: var(--line); color: var(--ink); }
.map-strip a.q { background: transparent; border: 1px dashed var(--line); }
.map-rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
.map-rows li { border-bottom: 1px solid var(--line); }
.map-rows a { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 16px; align-items: baseline; padding: 12px 0; text-decoration: none; }
.map-rows .tm0 { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.map-rows .pt { font-family: var(--font-serif); font-size: 19px; line-height: 25px; }
.map-rows .pt small { display: block; font-family: var(--font-sans); font-size: 13px; line-height: 18px; color: var(--ink-muted); margin-top: 2px; }
.map-rows .mn { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.map-rows .sl0 { font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
@media (max-width: 640px) { .map-rows a { grid-template-columns: 52px 1fr auto; } .map-rows .sl0 { display: none; } }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--ink-muted); }
.stats b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-full); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 14px; border-radius: var(--radius-full); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* недели курса */
.weeks tr.is-mark td { background: var(--clay-soft); }
.weeks td:first-child { font-family: var(--font-serif); font-size: 17px; }

/* словарь */
.terms { margin: 0; display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--ink); }
.terms > div { display: grid; grid-template-columns: 220px 1fr; gap: 6px 24px; padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--tb-h) + 16px); }
.terms dt { font-family: var(--font-serif); font-size: 19px; line-height: 25px; }
.terms dt small { display: block; font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--ink-muted); }
.terms dd { margin: 0; font-size: 15px; line-height: 23px; }
.terms dd a { color: var(--ink-muted); font-size: 13px; white-space: nowrap; }
@media (max-width: 640px) { .terms > div { grid-template-columns: 1fr; } }

/* люди */
.person { display: grid; grid-template-columns: 1fr; align-content: start; gap: 10px; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius-md); }
.person h3 { margin: 0; font-family: var(--font-serif); font-size: 24px; line-height: 30px; font-weight: 500; }
.person p { margin: 0; }

/* ---------- Содержание (M) ---------- */
.toc { position: fixed; inset: 0; z-index: 40; background: var(--surface); overflow-y: auto; padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: 48px; }
.toc-in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.toc-h { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.toc-h h2 { margin: 0; font-family: var(--font-serif); font-size: 32px; line-height: 38px; font-weight: 500; }
.toc-grid { display: grid; grid-template-columns: 1fr; gap: 28px 48px; }
@media (min-width: 900px) { .toc-grid { grid-template-columns: 1fr 1fr; } }
.toc-part h3 { margin: 0 0 6px; display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 2px solid var(--ink); font-family: var(--font-serif); font-size: 19px; line-height: 25px; font-weight: 500; }
.toc-part h3 span { font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted); font-weight: 400; white-space: nowrap; }
.toc-part ol { margin: 0; padding: 0; list-style: none; }
.toc-part a { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: var(--radius-sm); text-decoration: none; font-size: 14px; line-height: 20px; align-items: baseline; }
.toc-part a:hover { background: var(--surface-sunk); }
.toc-part a[aria-current="true"] { background: var(--clay-soft); }
.toc-part a.is-cut { color: var(--ink-faint); text-decoration: line-through; }
.toc-part .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
.toc-part .m, .toc-part .c { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.toc-part .k { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--clay-text); margin-left: 6px; }

/* ---------- Заметки ведущего (N) ---------- */
.notes { position: fixed; top: 0; right: 0; bottom: 0; z-index: 30; width: min(var(--notes-w), 100vw); background: var(--slab); color: var(--on-slab); overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 32px 24px; display: flex; flex-direction: column; gap: 20px; }
.notes a { color: inherit; }
.notes .caps { color: var(--on-slab-muted); }
.notes-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.notes-x { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--on-slab-muted); background: transparent; color: var(--on-slab); }
.notes h3 { margin: 0; font-family: var(--font-serif); font-size: 24px; line-height: 30px; font-weight: 500; }
.notes .clock { font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--on-slab-muted); }
.notes .clock b { color: var(--on-slab); font-weight: 500; }
.notes .clock .late { color: var(--clay); }
.nsec { display: flex; flex-direction: column; gap: 8px; }
.nsec p, .nsec ul { margin: 0; font-size: 15px; line-height: 23px; }
.nsec ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.nsec.warn .caps { color: var(--clay); }
.nkeys { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(176, 174, 165, .3); font-family: var(--font-mono); font-size: 11px; line-height: 18px; color: var(--on-slab-muted); }
@media (min-width: 1100px) {
  body.notes-open .app { padding-right: var(--notes-w); }
}

/* ---------- Пульт ведущего (P) ---------- */
.pult { height: 100vh; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); }
.pult-main { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; min-width: 0; }
.pult-side { background: var(--slab); color: var(--on-slab); display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; overflow-y: auto; min-width: 0; }
.pult-side .caps { color: var(--on-slab-muted); }
.pult-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pult-now { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
.pult-next { display: flex; flex-direction: column; gap: 8px; }
.pult-big { font-family: var(--font-mono); font-size: 56px; line-height: 60px; font-variant-numeric: tabular-nums; }
.pult-big.warn, .pult-big.over { color: var(--clay); }
.pult-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pult-side .btn { background: transparent; color: var(--on-slab); border-color: rgba(176, 174, 165, .45); }
.pult-side .btn:hover { border-color: var(--on-slab); }
.pult .fit { box-shadow: none; }
.pult-wait { padding: 48px; font-size: 18px; color: var(--ink-muted); }

/* ---------- Лайтбокс и тост ---------- */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(20, 20, 19, .82); display: flex; align-items: center; justify-content: center; padding: 24px; }
.lb figure { margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 100%; max-height: 100%; }
.lb img { max-width: 100%; max-height: calc(100vh - 100px); border-radius: var(--radius-md); background: var(--surface); }
.lb figcaption { color: var(--on-slab); font-size: 14px; display: flex; justify-content: space-between; gap: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--ft-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; padding: 10px 18px; border-radius: var(--radius-full); background: var(--ink); color: var(--surface); font-size: 14px; }

/* ========== Дополнительные блоки слайда (единицы — px слайда 960×540) ========== */
.sl-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid var(--line); max-width: 760px; }
.sl-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 22px; }
.sl-list.sm li { font-size: 14px; line-height: 20px; padding: 6px 0; }
.sl-grid2.c3 { grid-template-columns: repeat(3, 1fr); }
.sl-grid2.c4 { grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
.sl-grid2.c1 { grid-template-columns: 1fr; }

.x-tokens .line { display: grid; grid-template-columns: 84px 1fr 64px; gap: var(--space-3); align-items: center; }
.x-tokens .seq { display: flex; flex-wrap: wrap; gap: 2px; }
.x-tokens .tk { font-family: var(--font-mono); font-size: 15px; line-height: 26px; padding: 0 2px; border-radius: var(--radius-sm); background: var(--surface-sunk); white-space: pre; }
.x-tokens .tk:nth-child(even) { background: var(--line); }
.x-tokens .cnt { font-family: var(--font-serif); font-size: 30px; line-height: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.x-tokens .cnt small { display: block; font-family: var(--font-sans); font-size: 11px; line-height: 14px; color: var(--ink-muted); }

/* следующий токен */
.x-next { display: flex; flex-direction: column; gap: 10px; }
.x-next .q { font-family: var(--font-serif); font-size: 20px; line-height: 26px; white-space: nowrap; }
.x-next .q i { display: inline-block; width: 48px; border-bottom: 2px solid var(--ink-muted); height: 20px; vertical-align: baseline; }
.x-next .opt { display: grid; grid-template-columns: 90px 1fr 46px; gap: 10px; align-items: center; font-size: 14px; line-height: 20px; }
.x-next .opt span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.x-next .b { height: 10px; border-radius: 5px; background: var(--surface-sunk); overflow: hidden; }
.x-next .b i { display: block; height: 100%; background: var(--ink-muted); }
.x-next .opt.top .b i { background: var(--clay); }

/* окно контекста */
.x-window { display: flex; gap: 4px; }
.x-window > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.x-window .bx { height: 64px; border-radius: var(--radius-sm); background: var(--surface-sunk); }
/* Каждая часть окна — свой цвет и своя фактура, чтобы различались и без цвета */
.x-window .bx.sys { background: var(--ink); }
.x-window .bx.mem { background: var(--sky); }
.x-window .bx.files { background: repeating-linear-gradient(135deg, var(--sage) 0 6px, transparent 6px 11px); box-shadow: inset 0 0 0 2px var(--sage); }
.x-window .bx.hist { background: repeating-linear-gradient(180deg, var(--ink-muted) 0 4px, transparent 4px 10px); box-shadow: inset 0 0 0 2px var(--ink-muted); }
.x-window .bx.you { background: var(--clay); }
.x-window .bx.free { background: transparent; border: 2px dashed var(--ink-muted); }
.x-window .t { font-size: 13px; line-height: 17px; }
.x-window .t small { display: block; color: var(--ink-muted); font-size: 12px; line-height: 16px; }
.x-brace { display: flex; align-items: center; gap: 10px; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.x-brace::before, .x-brace::after { content: ""; flex: 1; height: 1px; background: var(--ink); }

/* снежный ком */
.x-snow { display: flex; flex-direction: column; gap: 4px; }
.x-snow .r { display: flex; gap: 3px; align-items: center; }
.x-snow .r i { width: 46px; height: 12px; border-radius: 3px; background: var(--line); }
.x-snow .r i.new { background: var(--ink-muted); }
.x-snow .r span { margin-left: 10px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* шкала автономности */
.x-scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
.x-scale.c3 { grid-template-columns: repeat(3, 1fr); }
.x-scale .s { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 2px solid var(--line); min-width: 0; }
.x-scale .s:nth-child(1) { border-top-color: var(--ink-faint); }
.x-scale .s:nth-child(2) { border-top-color: var(--ink-muted); }
.x-scale .s:nth-child(3), .x-scale .s:nth-child(4) { border-top-color: var(--ink); }
.x-scale .s h3 { font-family: var(--font-serif); font-size: 20px; line-height: 26px; font-weight: 500; }
.x-scale .s p { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.x-scale .s dl { display: flex; flex-direction: column; gap: 4px; }
.x-scale .s dt { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.x-scale .s dd { font-size: 14px; line-height: 20px; }
.x-axis { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* скриншоты-заглушки */
.x-shots { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); }
.x-shot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.x-shot .ph { aspect-ratio: 1 / 1; max-width: 100%; border: 1px dashed var(--ink-faint); border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; font-family: var(--font-mono); font-size: 10px; line-height: 13px; color: var(--ink-muted); overflow: hidden; word-break: break-all; }
.x-shot img { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--line); cursor: zoom-in; display: block; }
.x-shot .cap { font-size: 13px; line-height: 18px; }

/* большое число */
.x-fig { display: flex; flex-direction: column; gap: 4px; }
.x-fig b { font-family: var(--font-serif); font-size: 64px; line-height: 64px; font-weight: 400; }
.x-fig span { font-size: 14px; line-height: 20px; color: var(--ink-muted); }

/* даты «что дальше» */
.x-dates { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.x-dates > div { display: flex; flex-direction: column; gap: 6px; padding-top: var(--space-3); border-top: 2px solid var(--ink); }

.x-dates span { font-size: 14px; line-height: 20px; color: var(--ink-muted); }

/* подпись «условно» и строка короткой версии */

/* телефон: кнопки без клавиш */

}


/* ---------- Слова ведущего под слайдом ---------- */
.words { border-left: 3px solid var(--clay); padding: 2px 0 2px 20px; font-family: var(--font-serif); font-size: 18px; line-height: 28px; color: var(--ink); max-width: 760px; }
.words p { margin: 0 0 12px; }
.words p:last-child { margin-bottom: 0; }
@media (max-width: 719px) { .words { font-size: 16px; line-height: 25px; padding-left: 14px; } }

/* ---------- Проба на слайде ---------- */
.sl-pill.probe::before { border: 0; width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); }

/* ---------- Полоска времени слайда (версия ведущего) ---------- */
.tm-line { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: transparent; pointer-events: none; z-index: 2; }
.tm-line i { display: block; height: 100%; width: 0; background: var(--ink-muted); opacity: .45; transition: width .25s linear; }

.stage.reflow .tm-line { display: none; }

/* ---------- Цикл опроса: верхнеуровневая схема (блок cycle) ----------

.x-cycle .cy-rl { font-size: 13px; font-weight: 600; fill: var(--ink); }
.x-cycle .cy-rt, .x-cycle .cy-tag { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-muted); }
.x-cycle .cy-br { stroke: var(--ink-faint); stroke-width: 1; }
.x-cycle .cy-field { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 4 4; }
.x-cycle .cy-ft { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-muted); paint-order: stroke; stroke: var(--surface); stroke-width: 8px; }
.x-cycle .cy-band.top { fill: color-mix(in srgb, var(--sky) 16%, transparent); stroke: var(--sky); stroke-width: 1; }
.x-cycle .cy-band.bot { stroke: var(--sage); stroke-width: 1; }

.x-cycle .cy-hl { stroke: color-mix(in srgb, var(--sage) 45%, transparent); stroke-width: 2; }

.x-cycle .cy-step.cur .cy-box, .x-cycle .cy-band.cur { fill: var(--clay); stroke: var(--clay); }
.x-cycle .cy-step.cur .cy-t, .x-cycle .cy-step.cur .cy-s, .x-cycle .cy-bt.cur, .x-cycle .cy-tag.cur { fill: var(--on-clay); }

 "prompts": {
  "01. Самая простая версия": {
   "text": "Сделай калькулятор выборки для исследований из двух вкладок: «Сколько нужно анкет» и «Юзабилити-тест».\n\nТребование к формату: калькулятор должен легко открываться в браузере и легко пересылаться коллегам: один файл, без установки программ и без интернета. Выбери подходящий формат сам и назови его одной фразой. Назови файл sample-size-calculator (расширение зависит от формата) и дальше правь на всех шагах именно его.\n\nОткуда брать данные. В папке проекта лежат файлы sample-size-proportion.md (метод для вкладки «Сколько нужно анкет») и usability-problem-discovery.md (метод для вкладки «Юзабилити-тест»). Пути я не знаю: найди их по названию. Если рядом лежит z-values-and-rounding.md, прочитай и его (справка про табличные z). Если не нашёл файлы, скажи мне и попроси положить их в папку проекта.\n\nПравила, которые действуют на всех следующих шагах:\n- Формулы, константы, поля ввода, диапазоны, значения по умолчанию и контрольные примеры бери только из этих файлов. Спецификация вкладки — раздел «Как сделано в калькуляторе».\n- Не ищи в интернете и не подставляй формулы по памяти. Если нужного нет в файле, спроси меня.\n- Не меняй файлы методов и не удаляй мои файлы.\n- Проверяя страницу, не трогай мои данные на компьютере. В частности, кнопку копирования проверяй с подменой буфера обмена в тесте, чтобы не перезаписать мой настоящий буфер.\n- Только две вкладки, других расчётов не добавляй.\n\nСейчас нужна самая простая версия. Бери из спецификации поля и результат (включая строки результата вроде числа приглашений). Не делай пока: оформление (стандартные элементы браузера подойдут), блок «Как посчитано», таблицу участников на вкладке «Юзабилити-тест». Результат пересчитывай сразу при вводе, кнопка не нужна. Дальше мы будем улучшать калькулятор по шагам.\n\nВ конце скажи, как открыть калькулятор, и покажи его мне (открой в браузере, если можешь).",
   "note": "Перед промптом: папка `materials` из `materials.zip` — в папке проекта."

  "02. Контрольные значения": {
   "text": "Продолжаем править тот же файл калькулятора. Если его нет в контексте, найди в папке проекта файл с названием sample-size-calculator.\n\nПроверь расчёты на контрольных значениях. В обоих файлах методов есть разделы «Раскрытый пример» и «Контрольные значения». Введи в калькулятор каждое значение из них и сравни результат с ожидаемым из файла.\n\nПокажи таблицу: вкладка / что вводили / ожидалось (из файла) / получилось. Если всё совпало, так и скажи.\nЕсли что-то не совпало, не подгоняй формулу под ответ: покажи формулу из файла, подстановку чисел и пару «ожидалось / получилось», и спроси, как поступить.\n\nЧтобы проверку можно было сделать скриптом, а не только глазами, держи расчёты в отдельных функциях, которые не обращаются к странице, и проверь их скриптом (Node или Python). Если запустить скрипт нельзя, скажи, что проверка была ручной."
  },
  "03. Ввод и ошибки": {
   "text": "Продолжаем править тот же файл калькулятора. Правила прежние: данные только из файлов методов, интернет не нужен.\n\nСделай ввод удобным и устойчивым:\n- принимай запятую и точку как десятичный разделитель; пробелы в числах не мешают («10 000»);\n- если поле пустое или значение неверное, покажи понятное сообщение, что не так; никаких NaN, Infinity и пустого экрана;\n- значения по умолчанию и допустимые диапазоны бери из раздела «Как сделано в калькуляторе». Если для поля в файле нет границы или значения по умолчанию, не придумывай их, а перечисли мне в ответе;\n- числа выводи по-русски: запятая — десятичный разделитель, пробел — разделитель тысяч; размер выборки и число приглашений округляй всегда вверх, как написано в файле;\n- у каждого поля короткая подсказка: что это и что вводить, если значение неизвестно (формулировки бери из файлов, если они там есть).\n\nПосле правок снова прогони контрольные значения из шага 2 и скажи, что ничего не сломалось. Затем введи заведомо плохие значения (буквы, 0, пустое поле, слишком большие числа) и покажи, что получилось."
  },
  "04. Как посчитано": {
   "text": "Продолжаем править тот же файл калькулятора. Правила прежние: данные только из файлов методов.\n\nПод результатом на каждой вкладке добавь блок «Как посчитано»: формула и подстановка введённых чисел шаг за шагом, чтобы результат можно было пересчитать вручную. Например: «n₀ = 1,96² · 0,5 · 0,5 / 0,05² = 384,16 → 385».\n\nЗатем в этом же блоке строка «Источник»:\n- что взято из файла, со ссылкой, если она там есть;\n- статус проверки ровно такой, как в разделе «Источники и статус проверки». Если в файле написано «книга не сверялась» или «источника нет», на странице должно быть то же самое;\n- примечание про табличные z-значения, если оно есть в файлах.\n\nИз раздела «Допущения и ограничения» вынеси на страницу то, что влияет на вывод. Не пиши на странице больше, чем есть в файлах. То, что файлы называют «открытыми вопросами», не решай и не реализуй: перечисли мне в ответе.\n\nПосле правок снова прогони контрольные значения.",
   "note": "Дома, ДЗ-1."

  "05. Оформление без скилла": {
   "text": "Продолжаем править тот же файл калькулятора. Расчёты не трогай, только оформление.\n\nСделай калькулятор аккуратным и читаемым:\n- заголовок и короткое пояснение вверху; вкладки выглядят как вкладки, а не как список ссылок;\n- поля ввода в сетке: два столбца на компьютере, один на телефоне; подписи над полями, подсказки мелким серым;\n- результат крупным шрифтом в отдельном выделенном блоке, детали под ним строками «название — значение»;\n- блок «Как посчитано» визуально тише результата: мельче и серым, формулы моноширинным шрифтом;\n- выбор уровня доверия (90 / 95 / 99%) и похожие переключатели сделай кнопками-сегментами, а не выпадающим списком;\n- светлая и тёмная тема по настройкам системы;\n- системные шрифты, без загрузки чего-либо из интернета.\n\nПроверь узкий экран (ширина телефона 375 px): без горизонтальной прокрутки. Покажи мне результат. После правок снова прогони контрольные значения.",
   "note": "Если скилл frontend-design не поставился."

  "05b. Дизайн по скиллу": {
   "text": "Продолжаем править тот же файл калькулятора. Расчёты и тексты не меняй, меняется только внешний вид.\n\nСначала сохрани копию текущей страницы рядом под именем sample-size-calculator-before-design (с тем же расширением), чтобы мы могли сравнить «до» и «после».\n\nКак делать дизайн. Если у тебя есть скилл или плагин для визуального дизайна интерфейсов (например, frontend-design), используй его. Если нет, следуй принципам ниже. В любом случае бриф важнее скилла: нужен спокойный рабочий инструмент для исследователей, который коллеги открывают из письма. Без эффектов ради эффектов.\n\nРаботай в два прохода.\n1. План, без кода. В 6–8 строках: 4–6 цветов с названиями и значениями; шрифты и их роли; идея компоновки одной фразой; что на странице главное и запоминающееся (подсказка: результат). Проверь план: если какая-то часть подошла бы любому калькулятору, замени её и скажи, что изменено и почему.\n2. Код по исправленному плану.\n\nПринципы:\n- Одно главное место, остальное тихое. Перед тем как закончить, посмотри на страницу и убери одну лишнюю деталь.\n- Шрифты только системные (интернета нет). Заведи шкалу размеров и держись её. Строки не длиннее 80 символов.\n- Не используй приметы шаблонного дизайна: подписи заглавными буквами над блоками, цветную полосу слева у карточки, одинаковые скруглённые карточки с одинаковой тенью, градиентные заливки, цветом выделенное одно слово в заголовке, кремовый фон с терракотовым акцентом, чёрный фон с кислотно-зелёным.\n- Рамки, линии и подписи только если они что-то сообщают, например отделяют результат от пояснений.\n- Цвет: нейтральные с лёгким оттенком акцента; светлая и тёмная тема по системной настройке; контраст текста не ниже 4,5:1.\n- Анимации нет, кроме ответа на действие пользователя (раскрытие, подтверждение).\n- Видимый фокус с клавиатуры, учёт «уменьшить анимацию», ширина телефона 375 px без горизонтальной прокрутки.\n\nБез внешних шрифтов, библиотек и картинок из интернета: страница должна работать офлайн. После правок прогони контрольные значения и проверь узкий экран. Посмотри на результат (сделай скриншот, если можешь) и покажи мне «до» и «после» рядом.",
   "note": "Перед промптом — снимок экрана «до»."

  "06. Тонкие плюшки": {

  },
  "07. Готов к пересылке": {
   "text": "Продолжаем править тот же файл калькулятора. Подготовь его к пересылке коллегам, чтобы он работал у них так же, как у меня.\n\n1. Убедись, что в файле нет обращений к интернету: ни шрифтов, ни библиотек, ни картинок по ссылкам, ни запросов. Допускаются только обычные ссылки на источники. Покажи результат поиска по файлу.\n2. Если страница меняет адрес (например, добавляет #вкладка) или использует память браузера, сделай так, чтобы расчёты работали, даже если браузер это запретил (оберни в try/catch), или убери это совсем. Ничего не сохраняй в браузере.\n3. Добавь подсказку на случай отключённого JavaScript: «Открой файл в обычном браузере (Chrome, Safari, Firefox, Edge), а не в предпросмотре почты или мессенджера».\n4. В подвале одной строкой: расчёты идут в браузере, введённые числа никуда не отправляются, интернет не нужен, версия от сегодняшней даты. Пиши это только если пункт 1 подтвердил.\n5. Запусти всё в последний раз: контрольные значения, плохие значения в полях, узкий экран, отсутствие ошибок в консоли (если можешь открыть страницу в браузере).\n\nИтоговый отчёт, коротко:\n- где лежит файл и сколько он весит;\n- таблица «ожидалось / получилось»;\n- что не проверено (какие браузеры не запускались; какие книги из источников файлы называют несверенными);\n- открытые вопросы из файлов, которые не реализованы;\n- решения, которые пришлось принять самостоятельно.",
   "note": "Дома, ДЗ-1."
  },
  "08. Бюджет": {
   "text": "Продолжаем править тот же файл калькулятора. Если его нет в контексте, найди в папке проекта файл с названием sample-size-calculator.\n\nКалькулятор отвечает «сколько анкет», а заказчик спрашивает «сколько это стоит». Хочу, чтобы сразу после расчёта выборки было видно бюджет у поставщика панели, чтобы согласовать исследование с заказчиком.\n\nПравило «только две вкладки» с этого шага меняется: добавь третью вкладку «Бюджет». Остальные правила прежние: данные только из файлов методов, ничего не ищи в интернете и не подставляй по памяти, файлы методов не меняй.\n\nМетод для вкладки — файл budget-vendors.md: найди его по названию. Тарифы, уровни, границы уровней, поля, значения по умолчанию, формат вывода и контрольные значения бери только оттуда. Если чего-то в файле нет — не придумывай, а перечисли мне в ответе. Если файла нет — скажи и попроси положить его в папку materials.\n\nСначала, ничего не меняя, покажи план: какие поля, откуда берётся число анкет, как выбирается уровень на границах (20%, 80%, 10 и 30 вопросов), что увидит пользователь. Перечисли пограничные случаи, которые видишь. Жди моего «ок».\n\nПосле «ок»:\n- расчёты держи в отдельных функциях, которые не обращаются к странице, как и раньше;\n- прогони контрольные значения из budget-vendors.md и покажи таблицу «ожидалось / получилось», отдельно отметь строки на границах уровней;\n- прогони все прежние контрольные значения первых двух вкладок и покажи, что они не изменились;\n- если на прошлых шагах было оформление, новая вкладка должна выглядеть так же, проверь узкий экран.\nЕсли что-то не совпало, не подгоняй: покажи формулу, подстановку и спроси.",
   "note": "Учебные тарифы Pathway и OMI — `budget-vendors.md` в папке `materials`. Цены придуманы для курса."
  },
  "Расшифровка, шаг 1. Окно: файл → текст": {
   "text": "Сделай программу с окном, которая расшифровывает аудиофайл в текст. Всё должно работать на этом компьютере, без облака.\n\nФормат. Один файл на Python с именем transcribe_app.py, окно на tkinter (он входит в Python). Запуск: uv run transcribe_app.py. Зависимости пиши в шапку файла по стандарту PEP 723 (блок «# /// script»), чтобы uv поставил их сам. Ничего не ставь через pip install.\n\nЧто умеет окно:\n1. Кнопка «Выбрать аудиофайл…» открывает системное окно выбора. Принимает mp3, m4a, wav и видео mp4 (из видео берётся звук).\n2. Список моделей: tiny и base, по умолчанию tiny. Список языка: Русский (по умолчанию), English, «Определить само».\n3. Кнопка «Расшифровать» запускает распознавание. Окно не должно зависать: работа идёт в отдельном потоке, фразы передаются в окно через очередь, окно забирает их через after().\n4. Полоса прогресса и фразы с отметками времени появляются в текстовом поле по мере распознавания.\n5. Результат сохраняется рядом с записью в файл .md. Если файл с таким именем уже есть, не перезаписывай его, а добавь -2, -3 и так далее.\n6. Под полосой прогресса строка состояния на четыре строки: что сейчас происходит («Загружаю модель…», «Расшифровываю…»), ошибки, «в файле нет речи». Далее я буду называть её строкой состояния.\n\nБиблиотека: faster-whisper, модель на процессоре (device=\"cpu\", compute_type=\"int8\"), vad_filter=True. Модель сама скачивается из Hugging Face при первом запуске. Токен в коде не нужен и вписывать его никуда нельзя. Импортируй faster_whisper внутри рабочего потока, чтобы окно открывалось сразу.\n\nФормат файла .md:\n# Расшифровка: <имя файла с расширением>\n\n- Длительность записи: 01:04 (минуты:секунды; для часа и больше часы:минуты:секунды)\n- Язык: ru\n- Модель: tiny\n- Дата: ГГГГ-ММ-ДД (сегодняшняя)\n\n---\n\n**[00:00]** Первая фраза.\n\n**[00:03]** Вторая фраза.\n\nЛовушки, о которых уже известно:\n- В зависимостях запиши \"av<19\", а не просто faster-whisper. Иначе uv поставит свежую av 19, и программа упадёт на любом файле с ошибкой про metadata_errors (faster-whisper 1.2.1 вызывает параметр, которого в av 19 уже нет).\n- В блоке запуска (if __name__ == \"__main__\") первой строкой вызови multiprocessing.freeze_support(). Без этого приложение, которое мы соберём позже, при работе запускает само себя заново и открывает второе окно.\n- В начале файла: если sys.stdout или sys.stderr равны None (так бывает у приложения без консоли), замени их на открытый os.devnull.\n- Задай минимальный размер окна (не меньше 680 на 600) и проверь, что при нём ничего не обрезано: кнопки, подписи, сообщение об ошибке на три-четыре строки. Как проверять, не показывая окно: создай окно из кода, сразу задай ему прозрачность 0 (attributes('-alpha', 0)), несколько раз вызови update(), у каждой кнопки, подписи и списка сравни winfo_reqwidth и winfo_reqheight с выданным местом (winfo_width и winfo_height) и сразу закрой окно. Перед таким запуском скажи мне: на Mac окно, даже невидимое, может на секунду забрать фокус. Текстовое поле tkinter по умолчанию просит ширину 80 знаков: задай ему маленькие width и height, пусть растягивается вместе с окном. Длинные сообщения переноси по ширине окна (wraplength), а под строку сообщения оставь фиксированное место на четыре строки, чтобы то, что ниже, не прыгало.\n- Шрифты, которые ты создаёшь через tkinter.font.Font, храни в атрибутах окна: иначе Python удалит шрифт, и Tk молча вернёт стандартный.\n- Если файл не читается как аудио или видео, покажи в окне понятное сообщение, а не трассировку.\n\nРежим для проверки без окна: transcribe_app.py --selftest запись.mp3 [модель]. Язык русский. Он печатает фразы в терминал. Так ты сам проверишь движок.\n\nТестовая запись: sample-ru.mp3, текст, который она читает, лежит рядом в sample-ru.txt. Запусти --selftest на ней, сверь результат с sample-ru.txt и покажи мне, что получилось. Потом запусти окно: uv run transcribe_app.py.\n\nПравила: не удаляй и не перезаписывай мои файлы, ничего не публикуй и не загружай. Если чего-то не смог проверить, скажи прямо, а не пиши «готово». В конце скажи, как запустить программу, что ты проверил и что нет.",
   "note": "Перед промптом: `sample-ru.mp3` и `sample-ru.txt` — в папке `transcribe`."
  },
  "Расшифровка, шаг 2. Запись звука": {
   "text": "Продолжаем править тот же файл transcribe_app.py. В папке лежит recorder.py: это готовый модуль записи звука. Не переписывай его и не копируй его код в окно, а подключи.\n\nСначала прочитай recorder.py целиком: шапку с зависимостями, описание в начале файла, классы Recorder и RecorderError. Главное из него:\n- recorder.Recorder(mode): mode равен \"mic\" (микрофон), \"system\" (звук компьютера: речь собеседника в звонке, любое видео; только Mac) или \"both\" (оба сразу в один файл).\n- start() включает запись и возвращает путь к файлу. Он может ждать долго: macOS спрашивает разрешение. Вызывай его только в отдельном потоке, не в главном потоке окна.\n- stop() заканчивает запись и возвращает путь к файлу; тоже вызывай в отдельном потоке.\n- elapsed() даёт, сколько секунд идёт запись; level() даёт громкость от 0 до 1 (опрашивай раз в 0,1 секунды); problem() даёт текст предупреждения или None.\n- Ошибка start() приходит как recorder.RecorderError. Её текст уже написан для человека: покажи его в окне как есть.\n- recorder.CAN_RECORD_SYSTEM говорит, можно ли на этом компьютере записывать звук компьютера. Если нельзя, в списке источника оставь только микрофон.\n\nЧто добавить в окно:\n1. Отдельной строкой сразу под выбором файла: «Записать:», список источника («Микрофон (мой голос)», «Звук из компьютера (собеседник)», «Мой голос и собеседник») и кнопка «● Начать запись», которая во время записи превращается в «■ Закончить запись». Кнопка не должна менять ширину при смене надписи: задай ей фиксированную ширину по длинной надписи, иначе строка прыгает и обрезается.\n2. Строкой ниже: часы 00:00 и полоса громкости. Текст problem(), если он есть, показывай в строке состояния. Выбор файла, «Расшифровать», модель и язык во время записи недоступны. Запись и расшифровка одновременно не идут.\n3. После «Закончить запись» файл записи сам становится выбранным для расшифровки. Сама расшифровка не стартует: я нажму «Расшифровать».\n4. Если закрыть окно во время записи, спроси «Закрыть?»; если я соглашусь, останови запись (записанное сохранится). Если окно закрывают, пока запись только включается (macOS ещё спрашивает разрешение), дождись ответа, останови запись и закрой окно.\n5. Рядом с часами или строкой ниже мелким серым: «В звонке наденьте наушники, иначе микрофон запишет и собеседника из колонок. Предупредите участников о записи. Экран не записывается, только звук.»\n\nЗависимости: возьми список из шапки recorder.py и добавь в шапку transcribe_app.py к уже имеющимся, условия по системе (после точки с запятой) оставь как есть. Файл записи Recorder кладёт сам в «Документы/Transcribe»; расшифровка (.md) ляжет рядом с ним. Папку не меняй. Минимальный размер окна пересчитай: блок записи добавил высоты и ширины. Если выйдет больше 680 на 600, это нормально, назови мне новый размер. Проверь, как в шаге 1, что при минимальном размере ничего не обрезано.\n\nПроверка без окна: recorder.py запускается и сам: «uv run recorder.py mic 4 проба.wav» записывает четыре секунды и печатает длительность и громкость. Запусти так режим mic и покажи результат. Звук компьютера пока не проверяй: для него нужно отдельное разрешение, мы дойдём до него после упаковки в приложение.\n\nПравила прежние. Если macOS спросит про микрофон у программы, из которой запущен терминал, это нормально: скажи мне, что нажать.",
   "note": "Перед промптом: `recorder.py` — в папке `transcribe`."
  },
  "Расшифровка, шаг 3. Одно пожелание к окну": {
   "text": "Продолжаем править тот же файл transcribe_app.py. Одно пожелание к окну: <вставь сюда одну строку из списка или своё пожелание>.\n\nДелай только это, остальное не трогай. После правки: запусти --selftest и убедись, что расшифровка по-прежнему работает; запусти окно; проверь, что при минимальном размере окна ничего не обрезано. Скажи, что изменил и что проверил.",
   "note": "Дома: одно пожелание из меню А–З — на странице «Домашка»."
  },
  "Расшифровка, шаг 4. Приложение": {
   "text": "Продолжаем. В папке лежат build-mac.sh и icon.icns. Нужно собрать из transcribe_app.py приложение Transcribe.app, которое открывается двойным щелчком.\n\n1. Прочитай build-mac.sh и скажи в трёх-четырёх строках, что он делает. Не меняй его, пока не убедишься, что он не подходит: программа должна называться transcribe_app.py, а recorder.py и icon.icns лежать рядом.\n2. Проверь, что в transcribe_app.py есть multiprocessing.freeze_support() в блоке запуска и зависимость \"av<19\". Если нет, поправь.\n3. Запусти ./build-mac.sh (если не запускается, сначала chmod +x build-mac.sh). Сборка идёт около минуты.\n4. Если будет ошибка, покажи её целиком и объясни, что она значит. Не меняй сборку наугад.\n5. Когда получится, скажи, где лежит dist/Transcribe.app и сколько он весит, и открой его командой: open dist/Transcribe.app\n\nСобирай один раз. После каждой пересборки macOS перестаёт доверять приложению, и разрешения придётся выдавать заново.",
   "note": "Перед промптом: `build-mac.sh` и `icon.icns` — в папке `transcribe`. На Windows шаг пропускаем."
  },
  "Расшифровка, шаг 5. tiny против base": {
   "text": "Рядом лежат две расшифровки одной записи: первая сделана моделью tiny, вторая моделью base (вторая с -2 в имени). Найди их по названию.\n\nНичего в них не исправляй. Покажи таблицей места, где два текста различаются: отметка времени / что в tiny / что в base. Потом по одной фразе про каждую модель: в каких словах ошиблась. Какая из них точнее, скажи только если это видно по самим файлам, и скажи, на какой записи ты это видишь. Если различий мало, так и скажи.",
   "note": "Дома."
  },
  "Расшифровка, шаг 5б. Окно по скиллу": {
   "text": "Продолжаем править тот же файл transcribe_app.py. Работу программы не меняй (расшифровка, запись, кнопки, тексты сообщений остаются), меняется только внешний вид окна.\n\nСначала сохрани копию текущего файла рядом под именем transcribe_app-before-design.py, чтобы мы могли сравнить «до» и «после».\n\nКак делать дизайн. Если у тебя есть скилл или плагин для визуального дизайна интерфейсов (например, frontend-design), используй его. Если нет, следуй принципам ниже. Бриф важнее скилла: это спокойный рабочий инструмент для людей, которые расшифровывают интервью и звонки на своём компьютере. Он должен выглядеть дружелюбно и цветно, без эффектов ради эффектов. Подсказка по цвету: возьми его из иконки приложения (сине-фиолетовая плитка с белой звуковой волной).\n\nРаботай в два прохода.\n1. План, без кода. В 6–8 строках: 4–6 цветов с названиями и значениями; шрифт и его роли (используй только системный, интернета нет); идея компоновки одной фразой; что в окне главное и запоминающееся. Проверь план: если какая-то часть подошла бы любой программе, замени её и скажи, что изменено и почему.\n2. Код по исправленному плану.\n\nПринципы:\n- Один главный цвет и одно запоминающееся место (например, звуковая волна в шапке, которая оживает, когда идёт запись или расшифровка). Остальное тихое. Перед тем как закончить, убери одну лишнюю деталь.\n- Номера шагов оставь: это настоящая последовательность. Рамки, линии и подписи только если они что-то сообщают. Не раскладывай всё по одинаковым карточкам с одинаковой тенью.\n- Без градиентов-подложек, без «мягких серых теней», без стрелок «→» в конце кнопок, без подписей заглавными буквами над блоками.\n- Контраст текста с фоном не ниже 4,5 к 1. Посчитай его скриптом для каждой пары цветов и покажи мне таблицей.\n- Кнопки называют действие («Расшифровать», «Остановить»), ошибки объясняют, что случилось и что проверить.\n- Кнопки в tkinter на Mac не красятся: стандартные ttk-кнопки игнорируют цвет. Нарисуй свои на Canvas (скруглённый прямоугольник и текст) с состояниями: обычная, под мышью, нажатая, недоступная, с видимым фокусом с клавиатуры. Снаружи они должны вести себя как прежние: config(text=, state=, command=), cget(\"state\"). Ширина кнопки считается по самой длинной надписи, чтобы она не прыгала при смене текста.\n- Списки (Combobox) оставь стандартными. Полосу прогресса и громкости рисуй сам на Canvas в цветах палитры.\n- Шрифты tkinter, которые ты создаёшь, храни в атрибутах окна (иначе Python их удалит).\n- Без новых зависимостей и без картинок из интернета.\n\nПроверка. После правок: запусти --selftest и покажи, что расшифровка по-прежнему работает; проверь без показа окна (как в шаге 1, прозрачность 0 и winfo), что при минимальном размере окна ничего не обрезано, и что кнопки включаются и выключаются, как раньше. Перед запуском окна предупреди меня: на Mac окно, даже невидимое, может на секунду забрать фокус. Покажи мне окно (если можешь, сделай снимок только окна) и расскажи, что изменил. Если что-то из старого перестало работать, верни как было и скажи об этом.",
